  /* ---- 메모 휴지통 ----
     지운 메모는 어느 이야기에서 나왔는지와 몇 번째였는지를 함께 들고 간다.
     되살릴 때 원래 자리로 돌아가야 사용자가 기억하는 화면과 맞는다. */
  function trashNote(p, id){
    const idx = (p.notes || []).findIndex(x=>x.id === id);
    if(idx < 0) return;
    const n = p.notes.splice(idx, 1)[0];
    if(!Array.isArray(state.noteTrash)) state.noteTrash = [];
    state.noteTrash.unshift(Object.assign({}, n, {
      fromId: p.id, fromName: p.name, fromIndex: idx, deletedAt: Date.now()
    }));
    save(); renderAll();
    showUndoToast("메모를 휴지통으로 보냈어요", ()=>restoreNote(id));
  }
  function noteHome(t){                    // 되살릴 곳 — 휴지통에 있는 이야기라도 받아준다
    return state.projects.find(p=>p.id === t.fromId) ||
           state.trash.find(p=>p.id === t.fromId) || null;
  }
  function restoreNote(id){
    const list = state.noteTrash || [];
    const i = list.findIndex(n=>n.id === id);
    if(i < 0) return;
    const home = noteHome(list[i]);
    if(!home){ showFleetingToast("원래 이야기가 없어서 되살릴 수 없어요", true); return; }
    const t = list.splice(i, 1)[0];
    if(!Array.isArray(home.notes)) home.notes = [];
    const at = Math.min(typeof t.fromIndex === "number" ? t.fromIndex : home.notes.length, home.notes.length);
    home.notes.splice(at, 0, {id: t.id, text: t.text, color: t.color, createdAt: t.createdAt});
    justStuckNoteId = t.id;                // 되살아나는 것도 붙는 모션으로 보여준다
    save(); renderAll();
  }
  function purgeNote(id){
    state.noteTrash = (state.noteTrash || []).filter(n=>n.id !== id);
    save(); renderAll();
  }
  function purgeNotesOf(projectIds){       // 이야기를 영구 삭제하면 그 메모도 남길 이유가 없다
    const ids = Array.isArray(projectIds) ? projectIds : [projectIds];
    state.noteTrash = (state.noteTrash || []).filter(n=> ids.indexOf(n.fromId) < 0);
  }
  function restoreProject(id){
    const idx = state.trash.findIndex(p=>p.id===id);
    if(idx<0) return;
    const [p] = state.trash.splice(idx,1);
    state.projects.push(p);
    save(); renderAll();
  }
  function destroyProject(id){
    openModal("영구 삭제", `
      <div class="alert-box"><span class="alert-icon">⚠️</span><p>되돌릴 수 없어요. 정말 삭제할까요?</p></div>
      <div class="modal-actions"><button class="btn-ghost" id="cancelBtn">취소</button><button class="btn-primary" id="okBtn" style="background:var(--danger)">영구 삭제</button></div>`,
      (m)=>{
        m.querySelector("#cancelBtn").onclick=closeModal;
        m.querySelector("#okBtn").onclick=()=>{
          state.trash=state.trash.filter(p=>p.id!==id);
          purgeNotesOf(id);                       // 이야기가 없어지면 그 메모도 되살릴 곳이 없다
          save(); closeModal(); renderAll();
        };
      });
  }
  function updateProject(id, patch){
    const p = state.projects.find(p=>p.id===id);
    if(!p) return;
    Object.assign(p, patch);
    save(); renderAll();
  }

  function channelSelectHtml(selectedId){
    return state.channels.map(c=>`<option value="${c.id}" ${c.id===selectedId?"selected":""}>${c.name}</option>`).join("")
      + `<option value="__new__">+ 새 채널 만들기</option>`;
  }

  // 새 이야기의 기본 채널 — 지금 보고 있는 채널을 따라간다.
  // 특정 채널을 열어둔 채로 만들었는데 엉뚱한 채널로 들어가면 안 된다.
  function newProjectDefaultChannel(){
    const filtered = state.channelFilter &&
      state.channels.some(c=>c.id === state.channelFilter) ? state.channelFilter : null;
    if(filtered) return filtered;
    const active = activeProject();           // 상세 화면에서 만들었다면 그 이야기의 채널
    if(active && active.channelId &&
       state.channels.some(c=>c.id === active.channelId)) return active.channelId;
    return state.channels[0] ? state.channels[0].id : "";
  }

  function openEditModal(p){
    const isNew = !p;
    // 채널이 하나도 없으면 이야기를 만들 수 없다 — 채널 만들기부터 띄운다
    if(isNew && !state.channels.length){
      openChannelModal(null, ()=>{ renderAll(); openEditModal(null); });
      return;
    }
    openModal(isNew ? "새 이야기" : "이야기 수정", `
      <div class="field"><label>제목</label><input type="text" id="mName" value="${isNew?'':p.name.replace(/"/g,'&quot;')}" placeholder="ex) 몰락한 무관과 도망친 궁녀 이야기"></div>
      <div class="field">
        <label>썸네일</label>
        <div class="thumb-upload">
          <div class="thumb-preview" id="thumbPreview">
            ${(!isNew && p.thumbnail) ? `<img src="${p.thumbnail}">` : `이미지 없음`}
          </div>
          <div class="thumb-upload-btns">
            <button type="button" id="thumbPickBtn"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="4" width="18" height="16" rx="2" stroke-width="1.6"/><circle cx="8.5" cy="9.5" r="1.5" stroke-width="1.6"/><path d="M21 15l-5.5-5.5a1.5 1.5 0 0 0-2.12 0L4 19" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg> 이미지 선택</button>
            <button type="button" id="thumbClearBtn">삭제</button>
          </div>
          <input type="file" accept="image/*" id="thumbFile" class="file-hidden">
        </div>
      </div>
      <div class="field-row">
        <div class="field" style="flex:1;margin-bottom:0">
          <label>채널 <span style="color:var(--danger)">*</span></label>
          <select id="mChannel">
            ${(!isNew && !p.channelId) ? `<option value="" selected>미분류</option>` : ``}
            ${state.channels.map(c=>`<option value="${c.id}" ${(isNew ? (c.id===newProjectDefaultChannel()) : (p.channelId===c.id)) ? "selected":""}>${c.name}</option>`).join("")}
          </select>
          <div id="mChannelErr" style="display:none;font-size:var(--fs-xs);color:var(--danger);margin-top:5px;">채널을 선택해주세요.</div>
        </div>
        <button type="button" id="chAddBtn" style="align-self:flex-end;height:38px;border:1px solid var(--border);background:var(--panel);color:var(--accent);border-radius:var(--r-md);padding:0 12px;font-size:var(--fs-sm);cursor:pointer;white-space:nowrap;">+ 새 채널</button>
      </div>
      <div class="field"></div>
      <div class="field"><label>예상 업로드 날짜·시간</label>
        <input type="text" id="mDate" readonly value="${isNew?'':(p.uploadAt?fmtDateTime(p.uploadAt).label:'')}" placeholder="클릭해서 날짜 선택" style="cursor:pointer">
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelBtn">취소</button>
        <button class="btn-primary" id="saveBtn">${isNew?'만들기':'저장'}</button>
      </div>
    `, (m)=>{
      let pickedDate = isNew ? "" : (p.uploadAt || "");
      let pendingThumb = isNew ? null : (p.thumbnail || null);
      const dateInput = m.querySelector("#mDate");
      dateInput.addEventListener("click", ()=>{
        openDateModal(pickedDate, (iso)=>{ pickedDate=iso; dateInput.value = iso ? fmtDateTime(iso).label : ""; });
      });

      const thumbPreview = m.querySelector("#thumbPreview");
      const thumbFile = m.querySelector("#thumbFile");
      m.querySelector("#thumbPickBtn").addEventListener("click", ()=> thumbFile.click());
      thumbFile.addEventListener("change", ()=>{
        const file = thumbFile.files[0];
        if(!file) return;
        encodeImage(file, {maxW:480, aspect:16/9}, (dataUrl)=>{
          pendingThumb = dataUrl;
          thumbPreview.innerHTML = `<img src="${dataUrl}">`;
        });
      });
      m.querySelector("#thumbClearBtn").addEventListener("click", ()=>{
        pendingThumb = null;
        thumbPreview.innerHTML = "이미지 없음";
      });

      const chSel = m.querySelector("#mChannel");
      m.querySelector("#chAddBtn").addEventListener("click", ()=>{
        openChannelModal(null, (ch)=>{
          const opt = document.createElement("option");
          opt.value = ch.id; opt.textContent = ch.name;
          chSel.appendChild(opt);
          chSel.value = ch.id;
        });
      });
      chSel.addEventListener("change", ()=>{
        const err = m.querySelector("#mChannelErr");
        if(err) err.style.display = "none";
      });
      m.querySelector("#cancelBtn").onclick = closeModal;
      m.querySelector("#saveBtn").onclick = ()=>{
        const name = m.querySelector("#mName").value.trim();
        if(!name){ m.querySelector("#mName").focus(); return; }
        let chVal = chSel.value;
        if(chVal==="__new__") chVal = state.channels[state.channels.length-1] ? state.channels[state.channels.length-1].id : "";
        if(!chVal){                          // 채널은 필수
          const err = m.querySelector("#mChannelErr");
          if(err) err.style.display = "block";
          chSel.focus();
          return;                            // 모달을 닫지 않는다
        }
        closeModal();
        if(isNew) createProject(name, pickedDate, chVal, pendingThumb);
        else updateProject(p.id, {name, uploadAt: pickedDate, channelId: chVal, thumbnail: pendingThumb});
      };
      submitOnEnter(m, "#saveBtn");
      m.querySelector("#mName").focus();
    });
  }

  // ---------- drag & drop reorder ----------
  function attachDrag(el, p, listGetter){
    el.draggable = true;
    el.addEventListener("dragstart", (e)=>{ el.classList.add("dragging"); e.dataTransfer.setData("text/plain", p.id); });
    el.addEventListener("dragend", ()=> el.classList.remove("dragging"));
    el.addEventListener("dragover", (e)=>{ e.preventDefault(); el.classList.add("drag-over"); });
    el.addEventListener("dragleave", ()=> el.classList.remove("drag-over"));
    el.addEventListener("drop", (e)=>{
      e.preventDefault(); el.classList.remove("drag-over");
      const draggedId = e.dataTransfer.getData("text/plain");
      if(draggedId===p.id) return;
      const list = listGetter();
      const dragged = state.projects.find(x=>x.id===draggedId);
      if(!dragged) return;
      const ordered = sortList(list);
      const targetIdx = ordered.findIndex(x=>x.id===p.id);
      ordered.splice(ordered.findIndex(x=>x.id===draggedId),1);
      ordered.splice(targetIdx,0,dragged);
      ordered.forEach((pr,i)=> pr.order = i);
      state.sortMode = "manual";
      save(); renderAll();
    });
  }

  // ---------- sidebar ----------
  function renderSidebar(){
    document.getElementById("allCount").textContent = state.projects.filter(p=>!p.completed || state.showCompleted).length;
    document.getElementById("trashCount").textContent = state.trash.length;
    document.getElementById("navAll").classList.toggle("active", state.view==="all" && !state.channelFilter);
    document.getElementById("navTrash").classList.toggle("active", state.view==="trash");

    const list = document.getElementById("projList");
    const label = document.getElementById("listSectionLabel");
    list.innerHTML = "";

    if(state.view === "settings"){
      label.textContent = "설정";
      document.getElementById("channelSectionLabel").style.display = "none";
      document.getElementById("sidebarChannelFilter").innerHTML = "";
      const row = document.createElement("div");
      row.className = "nav-item";
      row.innerHTML = `⚙️ <span>진행 단계 설정</span>`;
      row.addEventListener("click", openStageSettings);
      list.appendChild(row);
      return;
    }

    label.textContent = "이야기";

    const chSectionLabel = document.getElementById("channelSectionLabel");
    const chFilterEl = document.getElementById("sidebarChannelFilter");
    /* 채널이 늘어날수록 이야기 목록이 밀린다. 2개 이상이면 접을 수 있게 한다.
       1개일 때 목록을 감춰봤더니 어느 채널인지 알 수 없어져서, 항상 보여준다. */
    const chCount = state.channels.length;
    const collapsible = chCount >= 2;
    const chCollapsed = collapsible && !!state.channelsCollapsed;
    const caretBtn = document.getElementById("chCollapseBtn");
    chSectionLabel.style.display = chCount ? "" : "none";
    caretBtn.classList.toggle("collapsed", chCollapsed);
    caretBtn.style.cursor = collapsible ? "pointer" : "default";
    caretBtn.querySelector(".sec-caret").style.display = collapsible ? "" : "none";
    caretBtn.title = collapsible ? (chCollapsed ? "채널 목록 펼치기" : "채널 목록 접기") : "";
    caretBtn.onclick = collapsible
      ? ()=>{ state.channelsCollapsed = !state.channelsCollapsed; save(); renderAll(); }
      : null;

    /* 접었을 때 전부 감추면 지금 어느 채널을 보고 있는지 알 수 없다.
       그래서 보고 있는 채널 한 줄만 남긴다. 전체 이야기를 보는 중이면 남길 게 없다. */
    /* 내 채널을 먼저, 공유받은 것을 뒤에. 섞여 있으면 어느 게 내 것인지
       한 줄씩 읽어봐야 안다. 각 무리 안의 순서는 사용자가 정한 그대로 둔다. */
    const ordered = state.channels.filter(c=>!isCollab(c)).concat(state.channels.filter(isCollab));
    const shownChannels = chCollapsed
      ? ordered.filter(c => c.id === state.channelFilter)
      : ordered;
    const firstCollabId = (ordered.find(isCollab) || {}).id;

    if(!shownChannels.length){
      chFilterEl.innerHTML = "";
    } else {
      const activeProjects = state.projects.filter(p=>!p.completed || state.showCompleted);
      chFilterEl.innerHTML = `
        <div class="sidebar-ch-filter" id="chFilterList">
          ${shownChannels.map(c=>{
            const cnt = activeProjects.filter(p=>p.channelId===c.id).length;
            const head = (!chCollapsed && c.id === firstCollabId)
              ? `<div class="ch-group-label">협업 중</div>` : "";
            return `${head}<div class="ch-row-wrap" data-ch-row="${c.id}">
              <div class="ch-drop-indicator"></div>
              <button data-ch="${c.id}" class="${state.channelFilter===c.id?'active':''}" draggable="${chCollapsed?'false':'true'}">
                ${chAvatarHtml(c,18)}<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(chDisplayName(c))}${c.shared ? `<span class="ch-owner">${escapeHtml(chOwnerSuffix(c))}</span>` : ""}</span>${isCollab(c) ? `<span class="ch-shared-mark" title="${c.shared ? "공유받은 채널" : "함께 쓰는 채널"}">${ICON.shared}</span>` : ""}<span class="ch-count-badge">${cnt}</span>
              </button>
            </div>`;
          }).join("")}
          <div class="ch-drop-indicator" data-end="1"></div>
        </div>
      `;
      const listEl = document.getElementById("chFilterList");
      chFilterEl.querySelectorAll("[data-ch]").forEach(b=>{
        b.addEventListener("click", ()=>{
          /* 선택된 채널을 다시 눌러도 유지한다. 예전엔 토글로 필터를 풀었지만
             바로 위에 "전체 이야기"가 있어서, 선택이 풀리는 게 놀랍기만 하다. */
          state.channelFilter = b.dataset.ch;
          state.view = "all"; state.active = null;
          save(); renderAll();
        });
        bindCtx(b, ()=>{
          const c = state.channels.find(x=>x.id===b.dataset.ch);
          if(!c) return [];
          // 공유받은 채널은 내 것이 아니다. 고치거나 지울 수 없고, 나갈 수만 있다.
          if(c.shared){
            return [
              {header:true, label:"공유받은 채널" + (c.ownerName ? " · " + c.ownerName : "")},
              {icon:ICON.shared, label:"멤버 보기", action:()=>openMembersModal(c)},
              "sep",
              {icon:ICON.leave, label:"채널에서 나가기", danger:true, action:()=>leaveChannelConfirm(c)},
            ];
          }
          return [
            {icon:ICON.edit, label:"채널 수정", action:()=>openChannelModal(c, ()=>renderAll())},
            {icon:ICON.shared, label:"멤버 보기", action:()=>openMembersModal(c)},
            {icon:ICON.link, label:"초대 링크 만들기", action:()=>openInviteModal(c)},
            "sep",
            {icon:ICON.trash, label:"채널 삭제", danger:true, action:()=>deleteChannelConfirm(c)},
          ];
        });
      });

      // drag reorder with insertion-line indicator
      // 접혀 있으면 목록이 한 줄뿐이라 순서를 바꿀 것도, 바꿀 방법도 없다
      if(!chCollapsed){
      let dragChId = null;
      chFilterEl.querySelectorAll('[data-ch]').forEach(b=>{
        b.addEventListener("dragstart", (e)=>{
          dragChId = b.dataset.ch;
          b.closest(".ch-row-wrap").classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
        });
        b.addEventListener("dragend", ()=>{
          b.closest(".ch-row-wrap").classList.remove("dragging");
          listEl.querySelectorAll(".ch-drop-indicator").forEach(el=>el.classList.remove("show"));
        });
      });
      listEl.addEventListener("dragover", (e)=>{
        e.preventDefault();
        const rows = [...listEl.querySelectorAll(".ch-row-wrap:not(.dragging)")];
        let target = null, before = true;
        for(const row of rows){
          const rect = row.getBoundingClientRect();
          if(e.clientY < rect.top + rect.height/2){ target = row; before = true; break; }
          target = row; before = false;
        }
        listEl.querySelectorAll(".ch-drop-indicator").forEach(el=>el.classList.remove("show"));
        if(target){
          const indicator = before ? target.querySelector(".ch-drop-indicator") : (target.nextElementSibling && target.nextElementSibling.classList.contains("ch-row-wrap") ? target.nextElementSibling.querySelector(".ch-drop-indicator") : listEl.querySelector('[data-end="1"]'));
          if(indicator) indicator.classList.add("show");
        } else {
          const endInd = listEl.querySelector('[data-end="1"]');
          if(endInd) endInd.classList.add("show");
        }
      });
      listEl.addEventListener("drop", (e)=>{
        e.preventDefault();
        if(!dragChId) return;
        const rows = [...listEl.querySelectorAll(".ch-row-wrap")];
        const draggedIdx = state.channels.findIndex(c=>c.id===dragChId);
        if(draggedIdx<0) return;
        let insertBeforeId = null;
        for(const row of rows){
          if(row.dataset.chRow === dragChId) continue;
          const rect = row.getBoundingClientRect();
          if(e.clientY < rect.top + rect.height/2){ insertBeforeId = row.dataset.chRow; break; }
        }
        const [dragged] = state.channels.splice(draggedIdx, 1);
        const insertIdx = insertBeforeId ? state.channels.findIndex(c=>c.id===insertBeforeId) : state.channels.length;
        state.channels.splice(insertIdx, 0, dragged);
        save(); renderAll();
      });
      }
    }
    document.getElementById("addChBtnSidebar").onclick = ()=> openChannelModal(null, ()=>renderAll());

    let visible = state.projects.filter(p=>!p.completed || state.showCompleted);
    if(state.channelFilter) visible = visible.filter(p=>p.channelId===state.channelFilter);
    sortByDeadline(visible).forEach((p)=>{
      const globalIdx = state.projects.indexOf(p);
      const row = document.createElement("div");
      row.className = "proj" + (p.id===state.active && state.view==="detail" ? " active":"") + (p.completed ? " completed":"");
      const d = fmtDateTime(p.uploadAt);
      // 사이드바는 한 줄로. 아이콘과 분 단위를 빼야 폭 200px 안에 들어온다.
      const dateHtml = d ? `<div class="proj-date${!p.completed?' u-'+d.urgency:''}">📅 ${d.label} · ${countdownSpanHtml(d.ts, true)}</div>` : `<div class="proj-date">날짜 미정</div>`;
      const prog = progressOf(p);
      row.innerHTML = `
        <span class="proj-color" style="background:${COLORS[globalIdx%COLORS.length]}"></span>
        <div class="proj-main">
          <div class="proj-name" title="${escapeHtml(p.name)}">${escapeHtml(displayTitle(p.name))}</div>
          ${dateHtml}
          <div class="proj-bar"><div class="proj-bar-fill" style="width:${prog.overall}%"></div></div>
        </div>
      `;
      row.addEventListener("click", (e)=>{ state.view="detail"; state.active=p.id; save(); renderAll(); });
      bindCtx(row, ()=>contextItemsFor(p));
      // 사이드바는 항상 임박일순 고정이라 드래그 재정렬은 대시보드(직접순서 모드)에서만 사용
      list.appendChild(row);
    });
  }

  // ---------- body ----------
  /* 경고 칸은 해당되는 게 있을 때만 뜬다. 필터를 걸어둔 채 그 건수가 0이 되면
     칸이 사라져서 해제할 방법이 없어지고, 빈 목록에 갇힌다. 그리기 전에 풀어준다. */
  function pruneStatFilter(){
    const f = state.statFilter;
    if(!f) return;
    let list = state.projects;
    if(state.channelFilter) list = list.filter(p=>p.channelId === state.channelFilter);
    const n = f === "overdue" ? list.filter(isOverdue).length
            : f === "wrapup"  ? list.filter(needsPublish).length
            : 0;
    if(!n) state.statFilter = null;
  }

  function renderBody(){
    pruneStatFilter();
    const body = document.getElementById("body");
    const headTitleWrap = document.getElementById("headTitleWrap");
    const headDot = document.getElementById("headDot");
    const headExtra = document.getElementById("headExtra");
    headDot.style.background = "var(--accent)";
    headExtra.innerHTML = "";
    document.getElementById("backBtnWrap").innerHTML = "";

    if(state.view==="trash"){
      headTitleWrap.textContent = "휴지통";
      const noteBin = state.noteTrash || [];
      if(state.trash.length>0 || noteBin.length>0){
        const parts = [];
        if(state.trash.length) parts.push(`이야기 <b>${state.trash.length}개</b>`);
        if(noteBin.length)     parts.push(`메모 <b>${noteBin.length}개</b>`);
        headExtra.innerHTML = `<button id="emptyTrashBtn" class="danger-outline-btn">${ICON.destroy}<span>휴지통 비우기</span></button>`;
        document.getElementById("emptyTrashBtn").addEventListener("click", ()=>{
          openModal("휴지통 비우기", `
            <div class="alert-box"><span class="alert-icon">⚠️</span><p>휴지통에 있는 ${parts.join(" · ")}가 모두 <b>영구 삭제</b>돼요.<br>되돌릴 수 없어요.</p></div>
            <p class="modal-question">계속할까요?</p>
            <div class="modal-actions"><button class="btn-ghost" id="cancelBtn">취소</button><button class="btn-primary" id="okBtn" style="background:var(--danger)">모두 삭제</button></div>
          `, (m)=>{
            m.querySelector("#cancelBtn").onclick = closeModal;
            m.querySelector("#okBtn").onclick = ()=>{
              state.trash = [];
              state.noteTrash = [];
              save(); closeModal(); renderAll();
            };
          });
        });
      }
      if(state.trash.length===0 && noteBin.length===0){
        body.innerHTML = `<div class="empty-rich">
          <svg class="ei" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <h3>휴지통이 비어 있어요</h3>
          <p>지운 이야기와 메모는 여기에 모여요.<br>실수로 지워도 언제든 되돌릴 수 있어요.</p>
        </div>`;
        return;
      }
      body.innerHTML =
        (state.trash.length ? `<div class="trash-sec">
           <div class="trash-sec-head">이야기<span class="cnt">${state.trash.length}</span></div>
           <div class="pgrid" id="trashGrid"></div></div>` : "") +
        (noteBin.length ? `<div class="trash-sec">
           <div class="trash-sec-head">메모<span class="cnt">${noteBin.length}</span></div>
           <div class="note-board" id="trashNotes"></div></div>` : "");

      const noteWrap = document.getElementById("trashNotes");
      if(noteWrap){
        noteBin.forEach(t=>{
          const c = NOTE_COLORS[t.color] || NOTE_COLORS.y;
          const home = noteHome(t);
          const el = document.createElement("div");
          el.className = "note trashed" + (home ? "" : " gone");
          el.style.cssText = `--n-bg:${c.bg};--n-line:${c.line};--n-ink:${c.ink};--tilt:0deg`;

          el.querySelector('[data-act="restore"]').addEventListener("click", ()=>restoreNote(t.id));
          el.querySelector('[data-act="purge"]').addEventListener("click", ()=>purgeNote(t.id));

      }
      const grid = document.getElementById("trashGrid");
      if(!grid) return;
      state.trash.forEach((p,idx)=>{
        const c1 = COLORS[idx%COLORS.length], c2 = COLORS[(idx+2)%COLORS.length];
        const d = fmtDateTime(p.uploadAt);
        const prog = progressOf(p);
        const ch = channelOf(p);

        card.style.cursor = "pointer";
        card.innerHTML = `
          <div class="pcard-thumb" style="--tc1:${c1};--tc2:${c2}">
            ${p.thumbnail ? `<img src="${p.thumbnail}">` : `<span class="thumb-letter">${(p.name||'?')[0]}</span>`}
            <span class="thumb-pct-badge">${prog.overall}%</span>
            <div class="thumb-prog-track"><div class="thumb-prog-fill" style="width:${prog.overall}%"></div></div>

          ${p.completed ? `<div class="stamp-overlay-card">${completionStampSvg()}</div>` : ""}
          <div class="pcard-body">
            <div class="pcard-title" title="${escapeHtml(p.name)}">${escapeHtml(displayTitle(p.name))}</div>
            ${ch ? `<div class="pcard-channel">${chAvatarHtml(ch, 18)}<span>${escapeHtml(chDisplayName(ch))}</span>${p._ro ? `<span class="shared-mark" title="공유받은 이야기">${ICON.shared}${ch.ownerName ? escapeHtml(ch.ownerName) : "보기 전용"}</span>` : ""}</div>` : ""}
            <div class="pcard-meta">

            </div>
            <div class="trash-actions" style="margin-top:12px;">
              <button data-act="restore">${ICON.restore}<span>복원</span></button>
              <button class="danger" data-act="destroy">${ICON.destroy}<span>영구삭제</span></button>
            </div>
          </div>

        card.addEventListener("click", (e)=>{
          if(e.target.closest(".trash-actions")) return;
          state.view="detail"; state.active=p.id; save(); renderAll();
        });
        card.querySelector('[data-act="restore"]').addEventListener("click",(e)=>{e.stopPropagation();restoreProject(p.id);});
        card.querySelector('[data-act="destroy"]').addEventListener("click",(e)=>{e.stopPropagation();destroyProject(p.id);});

    if(state.view==="settings"){
      headTitleWrap.textContent = "설정";
      body.innerHTML = `<div class="empty-state" style="padding:40px 0">왼쪽에서 설정 항목을 선택해주세요.</div>`;
      return;
    }

    if(state.view==="detail" && activeProject()){ renderDetailBody(); return; }

    state.view = "all"; state.active = null;
    headTitleWrap.textContent = "전체 이야기";

    body.innerHTML = `
      <div class="toolbar">
        <input class="search" id="search" placeholder="이야기 제목 검색..." value="${state.search||''}">
        <div class="sort-toggle">
          <button data-s="date" class="${state.sortMode==='date'?'active':''}" title="업로드일이 가까운 순서 · 날짜 미정은 뒤로">임박순</button>
          <button data-s="progress" class="${state.sortMode==='progress'?'active':''}">진행률순</button>
        </div>
        <div class="view-toggle">
          <button id="viewGrid" class="${state.layout==='grid'?'active':''}">▦</button>
          <button id="viewList" class="${state.layout==='list'?'active':''}">☰</button>
        </div>
        <button class="toggle-completed ${state.showCompleted?'active':''}" id="toggleDone">${state.showCompleted?'완료 숨기기':'완료 보기'}</button>
        <button class="add-btn" id="dashNewBtn">+ 새 이야기</button>
      </div>
      <div class="sub-note">💡 완료(100%)된 이야기는 기본적으로 숨겨져요.</div>
      ${statRowHtml()}
      <div class="pgrid ${state.layout==='list'?'list':''}" id="pgrid"></div>
    `;
    document.getElementById("search").addEventListener("input",(e)=>{ state.search=e.target.value; save(); renderPgrid(); });
    document.querySelectorAll(".sort-toggle button").forEach(b=>b.addEventListener("click",()=>{ state.sortMode=b.dataset.s; save(); renderBody(); }));
    document.getElementById("viewGrid").onclick=()=>{ state.layout="grid"; save(); renderBody(); };
    document.getElementById("viewList").onclick=()=>{ state.layout="list"; save(); renderBody(); };
    document.getElementById("toggleDone").onclick=()=>{ state.showCompleted=!state.showCompleted; save(); renderAll(); };
    document.getElementById("dashNewBtn").addEventListener("click", ()=>openEditModal(null));
    // 현황 숫자를 눌러 그 조건만 걸러본다 (같은 걸 다시 누르면 해제)
    document.querySelectorAll("[data-statf]").forEach(el=>{
      el.addEventListener("click", ()=>{
        const f = el.dataset.statf;
        state.statFilter = (state.statFilter === f) ? null : f;
        save(); renderBody();
      });
    });
    renderPgrid();
  }

  const bannerPasteCleanup = [];   // 상세 화면 붙여넣기 리스너 중복 방지
  let focusSubAddKey = null;       // 하위 작업 연속 입력 — 재렌더 후 커서 복귀



  /* 로컬 경로 지원.
     브라우저는 웹페이지에서 file:// 로 나가는 걸 막는다(보안). 그래서 폴더 경로는
     링크로 만들지 않고 "복사" 버튼으로 내보내고, 탐색기 주소창에 붙여넣게 한다. */
  function isLocalPath(v){
    if(!v) return false;
    return /^[a-zA-Z]:[\\/]/.test(v)      // C:\... 또는 C:/...
        || /^\\\\/.test(v)                 // \\서버\공유
        || /^file:\/\//i.test(v);
  }
  function normalizeLinkValue(v){
    v = (v || "").trim();
    if(!v) return "";
    if(isLocalPath(v)) return v;                       // 경로는 손대지 않는다
    if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v = "https://" + v;
    return v;
  }
  function copyText(text){
    const done = ()=> showFleetingToast("경로를 복사했어요. 탐색기 주소창에 붙여넣으세요");
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
        return;
      }
    }catch(e){}
    fallback();
    function fallback(){                                // iframe 에서 클립보드 API 가 막힐 때
      try{
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.cssText = "position:fixed;top:-1000px;left:0;opacity:0;";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        done();
      }catch(e){
        showFleetingToast("복사에 실패했어요", true);
      }
    }
  }

  // 단계 링크 설정 — 우클릭 메뉴와 단계 줄의 🔗 버튼이 함께 쓴다
  function openStageLinkModal(stage){
    openSubModal("작업 링크", `<div class="field"><label>URL</label><input type="text" id="stUrl" placeholder="https://..." value="${(stage.url||'').replace(/"/g,'&quot;')}"></div>
      <p style="font-size:var(--fs-xs);color:var(--sub);line-height:1.7;margin:-8px 0 0;">
        대본 문서, 이미지 폴더처럼 이 단계에서 자주 여는 주소를 저장해두세요.<br>
        <b style="color:var(--text);">내 컴퓨터 폴더 경로</b>(<code style="font-size:var(--fs-xs);">C:\\...</code>)도 넣을 수 있어요 —
        브라우저 보안 때문에 바로 열리진 않고, <b style="color:var(--text);">경로 복사</b> 버튼이 생겨요.
        복사한 뒤 탐색기 주소창에 붙여넣으면 됩니다.</p>
      <div class="modal-actions">
        ${stage.url ? '<button class="btn-ghost" id="cRemove" style="color:var(--danger);margin-right:auto;">링크 삭제</button>' : ''}
        <button class="btn-ghost" id="cCancel">취소</button><button class="btn-primary" id="cOk">저장</button>
      </div>`,
      (m2)=>{
        m2.querySelector("#cCancel").onclick = closeSubModal;
        const removeBtn = m2.querySelector("#cRemove");
        if(removeBtn) removeBtn.onclick = ()=>{ stage.url=""; closeSubModal(); save(); renderAll(); };
        m2.querySelector("#cOk").onclick = ()=>{
          let v = m2.querySelector("#stUrl").value.trim();
          v = normalizeLinkValue(v);
          stage.url = v;
          closeSubModal(); save(); renderAll();
        };
        submitOnEnter(m2, "#cOk");
        m2.querySelector("#stUrl").focus();
      });
  }

  // 하위 작업 링크 — 우클릭 메뉴와 줄 안의 🔗 버튼이 함께 쓴다
  function openSubtaskLinkModal(sub){
    openSubModal("하위 작업 링크", `<div class="field"><label>URL</label><input type="text" id="subUrl" placeholder="https://..." value="${(sub.url||'').replace(/"/g,'&quot;')}"></div>
      <p style="font-size:var(--fs-xs);color:var(--sub);line-height:1.7;margin:-8px 0 0;">
        웹 주소도, <b style="color:var(--text);">내 컴퓨터 폴더 경로</b>도 넣을 수 있어요.
        경로를 넣으면 눌렀을 때 복사됩니다.</p>
      <div class="modal-actions">
        ${sub.url ? '<button class="btn-ghost" id="cRemove" style="color:var(--danger);margin-right:auto;">링크 삭제</button>' : ''}
        <button class="btn-ghost" id="cCancel">취소</button><button class="btn-primary" id="cOk">저장</button>
      </div>`,
      (m2)=>{
        m2.querySelector("#cCancel").onclick = closeSubModal;
        const removeBtn = m2.querySelector("#cRemove");
        if(removeBtn) removeBtn.onclick = ()=>{ sub.url=""; closeSubModal(); save(); renderAll(); };
        m2.querySelector("#cOk").onclick = ()=>{
          sub.url = normalizeLinkValue(m2.querySelector("#subUrl").value);
          closeSubModal(); save(); renderAll();
        };
        submitOnEnter(m2, "#cOk");
        m2.querySelector("#subUrl").focus();

  /* 예정일 판정 — 현황 요약과 필터가 같은 기준을 쓰도록 한 곳에 둔다 */
  function uploadTs(p){
    if(!p.uploadAt) return null;
    const t = new Date(p.uploadAt).getTime();
    return isNaN(t) ? null : t;
  }
  function isOverdue(p){
    const t = uploadTs(p);
    return !p.completed && t !== null && t < Date.now();
  }

  /* 목록에 실제로 보이는 이야기. 격자와 이전/다음 이동이 같은 순서를 써야
     "다음"이 화면에 보이는 그 다음 카드가 된다. */
  function visibleProjects(){
    const sf = state.statFilter;
    let list = state.projects.slice();
    if(sf === "overdue")     list = list.filter(isOverdue);
    else if(sf === "wrapup") list = list.filter(needsPublish);
    else list = list.filter(p=>!p.completed || state.showCompleted);

    if(state.channelFilter) list = list.filter(p=>p.channelId===state.channelFilter);
    if(state.search) list = list.filter(p=>p.name.toLowerCase().includes(state.search.toLowerCase()));
    return sortList(list);
  }

  /* "마무리만 남음" 판정.
     마지막 단계만 빼고 다 끝났는데 예정일이 지난 상태 = 올렸는데 체크를 잊었거나,
     정말 아직 안 올렸거나. 어느 쪽이든 손이 필요하니 표시해준다. */
  function needsPublish(p){
    if(p.completed) return false;
    const n = p.stages.length;
    if(n < 2 || !p.uploadAt) return false;
    const t = new Date(p.uploadAt).getTime();
    if(isNaN(t) || t > Date.now()) return false;        // 아직 예정일 전이면 정상 진행 중
    const pcts = progressOf(p).pcts;
    if(pcts[n-1] === 100) return false;                 // 마지막 단계가 끝났으면 해당 없음
    return pcts.slice(0, n-1).every(x=>x === 100);      // 나머지는 전부 완료
  }

  /* 상단 경고 줄 — 지금 보고 있는 범위(전체 또는 선택한 채널) 기준.

     예전에는 "진행 중 / 이번 주 마감 / 완료" 를 항상 띄웠다. 그런데 그 숫자는
     전부 다른 데서 이미 보인다 — 진행 중은 아래 카드 개수, 완료는 툴바의
     "완료 보기", 이번 주 마감은 임박순 정렬이 알아서 위로 올려준다.
     화면 맨 윗줄을 늘 차지할 값어치가 없어서 지웠다.

     남긴 둘은 성격이 다르다. 손이 필요한 상태일 때만 나타나는 경고다.
     평소에는 아무것도 안 뜨고, 뜨면 그게 곧 신호가 된다. */
  function statRowHtml(){
    let list = state.projects;
    if(state.channelFilter) list = list.filter(p=>p.channelId === state.channelFilter);
    if(!list.length) return "";

    const overdue = list.filter(isOverdue).length;
    const wrapUp  = list.filter(needsPublish).length;
    if(!overdue && !wrapUp) return "";
    const cell = (label, value, unit, color, filter, cls, sub)=>{
      const on = state.statFilter === filter;
      return `<div class="stat ${cls||''} ${on?'on':''}" style="--stat-c:${color}" data-statf="${filter}">
         <div class="stat-label">${label}</div>
         <div class="stat-value">${value}${unit?`<small>${unit}</small>`:""}</div>
         <span class="stat-sub">${on ? "필터 해제" : (sub || "눌러서 보기")}</span>
         <span class="stat-mark">${on
             ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`
             : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8Z"/></svg>`}</span>
       </div>`;
    };

    return `<div class="stat-row">
      ${overdue ? cell("예정일 지남", overdue, "건", "var(--danger)", "overdue", "urgent") : ""}
      ${wrapUp  ? cell("마무리만 남음", wrapUp, "건", "#c9a227", "wrapup", "wrapup") : ""}
    </div>`;
  }

  function renderPgrid(){
    const grid = document.getElementById("pgrid");
    if(!grid) return;
    let list = visibleProjects();

    grid.innerHTML = "";
    if(list.length===0){
      const searching = !!state.search;
      const filtered = !!state.channelFilter;
      const nothingAtAll = !searching && !filtered && state.projects.length === 0;
      if(searching){
        grid.innerHTML = `<div class="empty-rich">
          <svg class="ei" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <h3>검색 결과가 없어요</h3>
          <p>"${escapeHtml(state.search)}"와(과) 일치하는 이야기를 찾지 못했어요.<br>다른 단어로 찾아보세요.</p>
          <button class="add-btn" id="emptyClearSearch">검색 지우기</button>
        </div>`;
        const b = document.getElementById("emptyClearSearch");
        if(b) b.addEventListener("click", ()=>{
          state.search = "";
          const s = document.getElementById("search"); if(s) s.value = "";
          save(); renderPgrid();
        });
      }else if(nothingAtAll){
        grid.innerHTML = `<div class="empty-rich">
          <svg class="ei" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <h3>첫 이야기를 시작해볼까요?</h3>
          <p>이야기를 만들면 대본부터 업로드까지<br>진행 상황을 한눈에 따라갈 수 있어요.</p>
          <button class="add-btn" id="emptyNewProj">+ 첫 이야기 만들기</button>
        </div>`;
        const b = document.getElementById("emptyNewProj");
        if(b) b.addEventListener("click", ()=>openEditModal(null));
      }else{
        grid.innerHTML = `<div class="empty-rich">
          <svg class="ei" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          <h3>여기엔 아직 이야기가 없어요</h3>
          <p>${filtered ? "이 채널에 " : ""}조건에 맞는 이야기가 없어요.<br>새로 만들거나 필터를 바꿔보세요.</p>
          <button class="add-btn" id="emptyNewProj2">+ 새 이야기</button>
        </div>`;
        const b = document.getElementById("emptyNewProj2");
        if(b) b.addEventListener("click", ()=>openEditModal(null));
      }
      return;
    }
    list.forEach(p=>{
      const idx = state.projects.indexOf(p);
      const d = fmtDateTime(p.uploadAt);
      const prog = progressOf(p);
      const ch = channelOf(p);
      const c1 = COLORS[idx%COLORS.length], c2 = COLORS[(idx+2)%COLORS.length];
      const card = document.createElement("div");
      card.className = "pcard" + (p.completed ? " completed":"");
      card.innerHTML = `
        <div class="pcard-actions">
          <button class="icon-btn" data-act="edit" title="정보 수정">${ICON.edit}</button>
          <button class="icon-btn danger" data-act="del" title="휴지통으로">${ICON.trash}</button>
        </div>
        <div class="pcard-thumb" style="--tc1:${c1};--tc2:${c2}">
          ${p.thumbnail ? `<img src="${p.thumbnail}">` : `<span class="thumb-letter">${(p.name||'?')[0]}</span>`}
          <span class="thumb-pct-badge">${prog.overall}%</span>
          <div class="thumb-prog-track"><div class="thumb-prog-fill" style="width:${prog.overall}%"></div></div>
        </div>
        ${p.completed ? `<div class="stamp-overlay-card">${completionStampSvg()}</div>` : ""}
        <div class="pcard-body">
          <div class="pcard-title" title="${escapeHtml(p.name)}">${escapeHtml(displayTitle(p.name))}</div>
          <div class="stage-pips">
            ${prog.pcts.map(pct=>`<span class="${pct===100?'full':''}"><i style="transform:scaleX(${pct/100})"></i></span>`).join("")}
          </div>
          <div class="pips-legend">
            <span>${p.stages.map((s,i)=> prog.pcts[i]===100 ? null : s.name).filter(Boolean)[0]
              ? `<span class="now">${escapeHtml(p.stages.map((s,i)=> prog.pcts[i]===100 ? null : s.name).filter(Boolean)[0])}</span> 진행 중`
              : "모든 단계 완료"}</span>
            <span>${prog.pcts.filter(x=>x===100).length}/${prog.pcts.length}</span>
          </div>
          ${needsPublish(p) ? `<div class="wrapup-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
            <span><b>${escapeHtml(p.stages[p.stages.length-1].name)}</b>만 남았어요</span></div>` : ""}
          ${ch ? `<div class="pcard-channel">${chAvatarHtml(ch, 18)}<span>${ch.name}</span></div>` : ""}
          <div class="pcard-meta">
            <span class="${d&&!p.completed?'u-'+d.urgency:''}">${d ? "📅 "+d.label+d.rel+"<br>"+countdownSpanHtml(d.ts) : "날짜 미정"}</span>
          </div>
        </div>
      `;
      if(d && !p.completed && d.urgency === "red") card.classList.add("soon-red");
      card.addEventListener("click",(e)=>{ if(e.target.closest(".pcard-actions")) return; state.view="detail"; state.active=p.id; save(); renderAll(); });
      bindCtx(card, ()=>contextItemsFor(p));
      card.querySelector('[data-act="edit"]').addEventListener("click",(e)=>{e.stopPropagation();openEditModal(p);});
      card.querySelector('[data-act="del"]').addEventListener("click",(e)=>{e.stopPropagation();trashProject(p.id);});
      // 직접순서 모드를 없애서 드래그 재정렬은 더 이상 사용하지 않음
      grid.appendChild(card);
    });
  }

  /* 단계 진행 막대. 하위 작업이 있으면 그 개수만큼 칸을 나눈다 —
     "몇 개 중 몇 개"가 채워진 길이보다 훨씬 빨리 읽힌다.
     칸이 너무 많아지면 오히려 안 보이므로 그때는 통막대로 돌아간다. */
  function miniTrackHtml(stage, pct){
    const subs = stage.subtasks || [];
    if(subs.length && subs.length <= 12){
      const done = subs.filter(s=>s.done).length;
      return `<span class="stage-mini-track seg">${
        subs.map((s,i)=>`<span class="mini-seg${s.done ? " on" : ""}"></span>`).join("")
      }</span>`;
    }
    return `<span class="stage-mini-track"><span class="stage-mini-fill" style="width:${pct}%"></span></span>`;
  }

  /* 지금 할 일 — 열자마자 "뭘 해야 하는지"가 보여야 한다.
     끝나지 않은 첫 단계의, 끝나지 않은 첫 하위 작업. */
  function nextTaskOf(p){
    for(let i=0;i<p.stages.length;i++){
      const st = p.stages[i];
      if(stagePct(st) === 100) continue;
      const sub = (st.subtasks||[]).find(s=>!s.done);
      return {stageName: st.name, icon: st.icon || iconFor(st.name), sub: sub ? sub.t : null};
    }
    return null;
  }
  function nextTaskCardHtml(p){
    const n = nextTaskOf(p);
    if(!n) return `<div class="side-card done-card hide-mobile">${ICON.check}<span>모든 단계를 마쳤어요</span></div>`;
    return `<div class="side-card next-card hide-mobile">
      <div class="side-card-head">${ICON.play}<span>지금 할 일</span></div>
      <div class="next-stage"><span class="next-icon">${n.icon}</span>${escapeHtml(n.stageName)}</div>
      ${n.sub ? `<div class="next-sub">${escapeHtml(n.sub)}</div>`
              : `<div class="next-sub muted">하위 작업 없음 — 동그라미를 눌러 완료</div>`}
    </div>`;
  }

  /* 링크 모음 — 단계마다 흩어진 링크를 한 곳에서 연다 */
  /* 링크는 단계에 붙거나, 그 단계의 하위 작업에 붙는다.
     예전에는 전부 한 줄로 늘어놓고 하위 작업 밑에 소속 단계를 작게 적었다.
     "만들기 / 인트로" 처럼 소속이 아래에 붙으니 거꾸로 읽히고, 단계 이름이 목록에
     두 번 나와서(제 링크로 한 번, 소속 표시로 한 번) 구조가 안 보였다.
     이제 단계 아래로 들여쓴다. 순서는 그대로 둔다 — 복사 버튼이 이 배열의
     번호를 그대로 쓰기 때문에 순서가 바뀌면 엉뚱한 링크가 복사된다. */
  function collectLinks(p){
    const out = [];
    p.stages.forEach(st=>{
      if(st.url) out.push({label: st.name, url: st.url, kind: "stage", stage: st.name});
      (st.subtasks||[]).forEach(s=>{
        if(s.url) out.push({label: s.t, url: s.url, kind: "sub", stage: st.name});
      });
    });
    return out;
  }
  /* 단계로 묶어서 그린다. 단계 이름 줄이 곧 그 단계의 링크다 —
     따로 한 줄을 더 두면 "인트로 > 인트로" 처럼 이름이 두 번 나온다.
     링크가 없는 단계는 상자 없는 회색 이름표로 남긴다.
     상자가 있으면 눌리는 것, 회색 글씨면 이름표 — 규칙은 이 하나다.

     번호(idx)는 collectLinks 가 담는 순서와 정확히 같아야 한다. 복사 버튼이
     그 배열의 번호를 그대로 쓰기 때문에, 어긋나면 엉뚱한 링크가 복사된다. */
  function linkRowHtml(label, url, idx, isHead, icon){
    const cls = "link-item" + (isHead ? " head" : " sub");
    const mark = isHead
      ? `<span class="link-emoji">${icon}</span>`
      : (isLocalPath(url)
        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>`);
    const body = `${mark}<span class="link-text">${escapeHtml(label)}</span>`;
    return isLocalPath(url)
      ? `<button class="${cls}" data-copylink="${idx}" title="${escapeHtml(url)}">
           ${body}<span class="link-act">복사</span></button>`
      : `<a class="${cls}" href="${url}" target="_blank" rel="noopener" title="${escapeHtml(url)}">
           ${body}<span class="link-act">열기 ↗</span></a>`;
  }

  function linkRowsHtml(p){
    const rows = [];
    let idx = -1;
    p.stages.forEach(st=>{
      const subs = (st.subtasks || []).filter(s=>s.url);
      if(!st.url && !subs.length) return;
      const icon = st.icon || iconFor(st.name);
      if(st.url){
        rows.push(linkRowHtml(st.name, st.url, ++idx, true, icon));
      }else{
        rows.push(`<div class="link-group">${icon}<span>${escapeHtml(st.name)}</span></div>`);
      }
      subs.forEach(s=> rows.push(linkRowHtml(s.t, s.url, ++idx, false, null)));
    });
    return rows.join("");
  }

  function linkListHtml(p){
    const links = collectLinks(p);
    if(!links.length) return "";
    return `<div class="side-card hide-mobile">
      <div class="side-card-head">${ICON.link}<span>연결된 자료 ${links.length}</span></div>
      <div class="link-list">${linkRowsHtml(p)}</div>
    </div>`;
  }

  /* ---------- 포스트잇 메모 ---------- */
  const NOTE_COLORS = {
    y:{bg:"#fff3b0", line:"#f2df84", ink:"#4a3f16"},
    p:{bg:"#ffd9e2", line:"#f5c2ce", ink:"#5a2333"},
    b:{bg:"#cfe6ff", line:"#b5d6f7", ink:"#173751"},
    g:{bg:"#d3f2d8", line:"#b8e5c0", ink:"#1d4527"}
  };
  let justStuckNoteId = null;     // 방금 붙인 쪽지 — 붙는 모션을 한 번만 준다

  function noteTilt(id){          // 살짝 삐뚤게 — 진짜 포스트잇처럼
    let h = 0;
    for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) & 0xffff;
    return ((h % 5) - 2) * 0.9;   // -1.8 ~ 1.8도
  }

  function noteBoardHtml(p, inTrash){
    const notes = p.notes || [];
    return `<div class="side-card note-card">
      <div class="side-card-head">${ICON.note}<span>메모${notes.length?` ${notes.length}`:""}</span></div>
      <div class="note-board">
        ${notes.map(n=>{
          const c = NOTE_COLORS[n.color] || NOTE_COLORS.y;
          return `<div class="note ${justStuckNoteId===n.id?"stick":""}" data-note="${n.id}"${inTrash?"":' draggable="true"'}
              style="--n-bg:${c.bg};--n-line:${c.line};--n-ink:${c.ink};--tilt:${noteTilt(n.id)}deg">
            <div class="note-text">${escapeHtml(n.text)}</div>
            ${inTrash?"":`<button class="note-del" data-notedel="${n.id}" title="삭제">✕</button>`}
          </div>`;
        }).join("")}
        ${inTrash?"":`<button class="note-add" id="noteAddBtn" title="메모 추가">
          <span>+</span><em>메모 추가</em></button>`}
      </div>
    </div>`;
  }

  /* 메모 순서 이동. targetId 가 없으면(빈 자리에 떨어뜨림) 맨 뒤로 보낸다. */
  function moveNote(p, dragId, targetId, before){
    const list = p.notes || [];
    const from = list.findIndex(n=>n.id === dragId);
    if(from < 0 || dragId === targetId) return;
    const moved = list.splice(from, 1)[0];
    let at = list.length;
    if(targetId){
      const t = list.findIndex(n=>n.id === targetId);
      if(t >= 0) at = before ? t : t + 1;
    }
    list.splice(at, 0, moved);
    save(); renderAll();
  }

  /* 메모는 눌러서 그 자리에서 고친다.
     창을 띄웠다 닫는 건 한 줄 고치자고 하기엔 번거롭다.
     Enter 로 저장, Shift+Enter 로 줄바꿈, Esc 로 되돌리기 — 창에서 쓰던 규칙 그대로다.
     다른 데를 눌러도 저장된다(blur). 비우고 나가면 지우지 않고 원래 글로 되돌린다 —
     지우는 건 ✕ 로만 한다. 잘못 지우는 것보다 안 지워지는 게 낫다. */
  function beginNoteEdit(p, el, n){
    el.classList.add("editing");
    el.setAttribute("draggable", "false");
    const textEl = el.querySelector(".note-text");
    if(!textEl) return;

    let color = n.color || "y";
    const ta = document.createElement("textarea");
    ta.className = "note-edit-area";
    ta.value = n.text;
    textEl.replaceWith(ta);

    const grow = ()=>{ ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };
    grow();
    ta.addEventListener("input", grow);

    const colors = document.createElement("div");
    colors.className = "note-edit-colors";
    colors.innerHTML = Object.keys(NOTE_COLORS).map(k=>
      `<button type="button" data-c="${k}" class="${k===color?"on":""}"
        style="background:${NOTE_COLORS[k].bg};border-color:${NOTE_COLORS[k].line}"></button>`).join("");
    ta.after(colors);
    colors.addEventListener("click", (e)=>{
      const b = e.target.closest("[data-c]");
      if(!b) return;
      color = b.dataset.c;
      const c = NOTE_COLORS[color];
      el.style.setProperty("--n-bg", c.bg);
      el.style.setProperty("--n-line", c.line);
      el.style.setProperty("--n-ink", c.ink);
      colors.querySelectorAll("[data-c]").forEach(x=> x.classList.toggle("on", x === b));
      ta.focus();
    });

    let done = false;
    const finish = (keep)=>{
      if(done) return;
      done = true;
      if(keep){
        const t = ta.value.trim();
        if(t) n.text = t;          // 비우고 나가면 원래 글을 지키다
        n.color = color;
        save();
      }
      renderAll();                 // 다시 그리면 편집 상태가 걷힌다
    };

    ta.addEventListener("keydown", (e)=>{
      if(e.key === "Escape"){ e.preventDefault(); finish(false); return; }
      if(e.key !== "Enter" || e.shiftKey) return;
      if(e.isComposing || e.keyCode === 229) return;   // 한글 조합 중 Enter 는 확정용이다
      e.preventDefault();
      finish(true);
    });
    /* 색을 고르는 동안 잠깐 초점이 떠난다. 그때 저장해버리면 편집이 닫힌다. */
    ta.addEventListener("blur", ()=> setTimeout(()=>{
      if(!el.contains(document.activeElement)) finish(true);
    }, 0));

    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }

  function openNoteModal(p, note){
    const isNew = !note;
    const cur = note || {text:"", color:"y"};
    openModal(isNew ? "새 메모" : "메모 수정", `
      <div class="note-edit" id="noteEdit" style="--n-bg:${NOTE_COLORS[cur.color].bg};--n-line:${NOTE_COLORS[cur.color].line};--n-ink:${NOTE_COLORS[cur.color].ink}">
        <textarea id="noteText" rows="5" placeholder="생각나는 대로 적어두세요">${escapeHtml(cur.text)}</textarea>
      </div>
      <div class="note-colors" id="noteColors">
        ${Object.keys(NOTE_COLORS).map(k=>`<button type="button" data-c="${k}"
          class="swatch ${k===cur.color?"on":""}" style="background:${NOTE_COLORS[k].bg};border-color:${NOTE_COLORS[k].line}"></button>`).join("")}
      </div>
      <p class="modal-question" style="margin-top:10px;">Enter로 저장 · Shift+Enter로 줄바꿈</p>
      <div class="modal-actions">
        ${isNew?"":'<button class="btn-ghost" id="noteRemove" style="color:var(--danger);margin-right:auto;">삭제</button>'}
        <button class="btn-ghost" id="cancelBtn">취소</button>
        <button class="btn-primary" id="okBtn">${isNew?"붙이기":"저장"}</button>
      </div>
    `, (m)=>{
      let color = cur.color;
      const ta = m.querySelector("#noteText");
      const box = m.querySelector("#noteEdit");
      m.querySelectorAll("#noteColors .swatch").forEach(b=>{
        b.addEventListener("click", ()=>{
          color = b.dataset.c;
          const c = NOTE_COLORS[color];
          box.style.setProperty("--n-bg", c.bg);
          box.style.setProperty("--n-line", c.line);
          box.style.setProperty("--n-ink", c.ink);
          m.querySelectorAll("#noteColors .swatch").forEach(x=>x.classList.toggle("on", x===b));
          ta.focus();
        });
      });
      const commit = ()=>{
        const text = ta.value.trim();
        if(!text){ ta.focus(); return; }
        if(isNew){
          const id = uid();
          p.notes.push({id, text, color, createdAt: Date.now()});   // "메모 추가"가 맨 뒤에 있으니 뒤에 붙는다
          justStuckNoteId = id;               // 붙는 모션 대상
        }else{
          note.text = text; note.color = color;
        }
        closeModal(); save(); renderAll();
      };
      m.querySelector("#okBtn").onclick = commit;
      m.querySelector("#cancelBtn").onclick = closeModal;
      const rm = m.querySelector("#noteRemove");
      if(rm) rm.onclick = ()=>{
        p.notes = p.notes.filter(x=>x.id !== note.id);
        closeModal(); save(); renderAll();
      };
      // Enter 로 저장, Shift+Enter 는 줄바꿈. 한글 조합 중 Enter 는 무시.
      ta.addEventListener("keydown", (e)=>{
        if(e.key !== "Enter" || e.shiftKey) return;
        if(e.isComposing || e.keyCode === 229) return;
        e.preventDefault();
        commit();
      });
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    });
  }

  function renderDetailBody(){
    const p = activeProject();
    const inTrash = !state.projects.some(x=>x.id===p.id);
    const isPending = pendingTrashId === p.id;
    const body = document.getElementById("body");
    const headTitleWrap = document.getElementById("headTitleWrap");
    const headDot = document.getElementById("headDot");
    const headExtra = document.getElementById("headExtra");
    let idx = state.projects.indexOf(p);       // 아래 배너 그라데이션에서도 쓴다
    if(idx<0) idx = state.trash.indexOf(p);
    if(idx<0) idx = 0;

    const backCh = channelOf(p);
    // 제목 옆 점을 채널 색으로 — 채널명을 또 적지 않고도 소속이 보인다
    headDot.style.background = (backCh && backCh.color) ? backCh.color : COLORS[idx%COLORS.length];

    // 목록에 보이는 순서대로 앞뒤 이야기 — 연달아 볼 때 목록을 거치지 않게
    const siblings = visibleProjects();
    const myIdx = siblings.findIndex(x=>x.id === p.id);
    const prevP = myIdx > 0 ? siblings[myIdx-1] : null;
    const nextP = (myIdx >= 0 && myIdx < siblings.length-1) ? siblings[myIdx+1] : null;

    document.getElementById("backBtnWrap").innerHTML = `
      <div class="detail-nav">
        <button id="backToListBtn" class="back-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <span>목록</span>
        </button>
        ${(prevP || nextP) ? `<div class="detail-stepper">
          <button id="prevProjBtn" class="step-btn" ${prevP?`title="${escapeHtml(prevP.name)}"`:"disabled"}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <span class="step-count">${myIdx+1} / ${siblings.length}</span>
          <button id="nextProjBtn" class="step-btn" ${nextP?`title="${escapeHtml(nextP.name)}"`:"disabled"}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>` : ""}
      </div>
    `;
    const goTo = (t)=>{ if(!t) return; state.active = t.id; save(); renderAll(); };
    const pb = document.getElementById("prevProjBtn");
    const nb = document.getElementById("nextProjBtn");
    if(pb) pb.addEventListener("click", ()=>goTo(prevP));
    if(nb) nb.addEventListener("click", ()=>goTo(nextP));
    document.getElementById("backToListBtn").addEventListener("click", ()=>{
      state.view = "all"; state.active = null;
      state.channelFilter = backCh ? backCh.id : null;
      save(); renderAll();
    });

    // inline-editable title
    const noEdit = inTrash || p._ro;
    headTitleWrap.innerHTML = `<span id="titleText" contenteditable="false" style="cursor:${noEdit?"default":"text"};border-bottom:1px dashed transparent;outline:none;display:inline-block;" ${inTrash?'':'title="클릭해서 제목 수정"'}>${p.name}</span>`;
    const titleText = document.getElementById("titleText");
    let editing = false;
    if(!noEdit){
    titleText.addEventListener("mouseenter", ()=>{ if(!editing) titleText.style.borderBottomColor = "var(--sub)"; });
    titleText.addEventListener("mouseleave", ()=>{ if(!editing) titleText.style.borderBottomColor = "transparent"; });
    titleText.addEventListener("click", ()=>{
      if(editing) return;
      editing = true;
      titleText.contentEditable = "true";
      titleText.style.borderBottomColor = "var(--accent)";
      titleText.style.borderBottomStyle = "solid";
      titleText.focus();
      const range = document.createRange();
      range.selectNodeContents(titleText);
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
    });
    const commitTitle = ()=>{
      if(!editing) return;
      editing = false;
      titleText.contentEditable = "false";
      const v = titleText.textContent.trim();
      if(v && v !== p.name) updateProject(p.id, {name: v});
      else renderDetailBody();
    };
    titleText.addEventListener("blur", commitTitle);
    titleText.addEventListener("keydown", (e)=>{
      if(e.key==="Enter"){ e.preventDefault(); titleText.blur(); }
      if(e.key==="Escape"){ e.preventDefault(); editing=false; renderDetailBody(); }
    });
    }

    const d = fmtDateTime(p.uploadAt);
    const ch = channelOf(p);
    headExtra.innerHTML = `
      <div class="head-meta">
      ${ch ? `<div class="channel-badge-lg">${chAvatarHtml(ch, 22)}<span>${ch.name}</span></div>` : ""}
      <div class="date-badge" id="dateBadge" title="${inTrash?'':'클릭하면 캘린더가 열려요'}" style="${inTrash?'cursor:default;':''}">
        ${d ? `📅 예상 업로드 <span class="${!p.completed?'u-'+d.urgency:''}"><b>${d.label}</b>${d.rel}<span class="hide-mobile"> · ${countdownSpanHtml(d.ts)}</span></span>` : `📅 예상 업로드 날짜를 지정해주세요`}      </div>
      <div class="detail-actions">
        ${inTrash ? `
          <button id="restoreBtn">${ICON.restore}<span>복원하기</span></button>
          <button id="destroyBtn" class="danger">${ICON.destroy}<span>영구 삭제</span></button>
        ` : (p._ro ? `` : `
          <button id="editBtn">${ICON.edit}<span>정보 수정</span></button>
          ${isPending
            ? `<button id="cancelTrashBtn" style="background:var(--danger);color:#fff;border-color:var(--danger);">${ICON.undo}<span>취소</span></button>`
            : `<button id="delBtn" class="danger">${ICON.trash}<span>휴지통</span></button>`}
        `)}
      </div>
      </div>
      ${inTrash ? `<div class="done-banner" style="background:#fde8e6;color:var(--danger);">휴지통에 있는 이야기예요. 복원하기 전까지는 수정할 수 없어요.</div>` : ""}
      ${(!inTrash && !isPending && p.completed) ? `<div class="done-banner">✅ 완료된 이야기예요. 대시보드 "완료 보기"를 꺼두면 목록에서 자동으로 숨겨져요.</div>` : ""}
    `;
    if(inTrash){
      document.getElementById("restoreBtn").addEventListener("click", ()=>restoreProject(p.id));
      document.getElementById("destroyBtn").addEventListener("click", ()=>destroyProject(p.id));
    } else {
      const dateBadge = document.getElementById("dateBadge");
      if(p._ro){ dateBadge.style.cursor = "default"; dateBadge.title = ""; }
      else dateBadge.addEventListener("click", ()=>{
        openDateModal(p.uploadAt, (iso)=> updateProject(p.id, {uploadAt: iso}));
      });
      const editBtn = document.getElementById("editBtn");
      if(editBtn) editBtn.addEventListener("click", ()=>openEditModal(p));
      if(p._ro){ /* 공유받은 이야기는 여기서 끝 — 아래 버튼들이 아예 없다 */ }
      else if(isPending){
        document.getElementById("cancelTrashBtn").addEventListener("click", ()=>{
          pendingTrashId = null;
          renderAll();
        });
      } else {
        document.getElementById("delBtn").addEventListener("click", ()=>{
          pendingTrashId = p.id;
          renderAll();
          showFleetingToast("이 페이지를 벗어나면 휴지통으로 이동돼요", true);
        });
      }
    }

    const prog = progressOf(p);
    const c1 = COLORS[idx%COLORS.length], c2 = COLORS[(idx+2)%COLORS.length];
    const doneCount = p.stages.filter((s,si)=>prog.pcts[si]===100).length;
    const ringStart = (lastRingPct[p.id] !== undefined) ? lastRingPct[p.id] : prog.overall;
    body.innerHTML = `
      ${p._ro ? `<div class="ro-banner">${ICON.shared}
        <span><b>공유받은 이야기</b> — 보기만 됩니다${ch && ch.ownerName ? " · " + escapeHtml(ch.ownerName) : ""}</span>
      </div>` : ""}
      <div class="detail-grid${p._ro ? " ro-view" : ""}">
        <div class="detail-left">
          <div class="detail-banner" id="detailBanner" style="--tc1:${c1};--tc2:${c2}">
            ${p.thumbnail ? `<img src="${p.thumbnail}">` : `<span class="banner-letter">${(p.name||'?')[0]}</span>`}
            ${p.completed ? `<div class="stamp-overlay">${completionStampSvg()}</div>` : ""}
            ${(inTrash || p._ro) ? "" : `<div class="banner-edit">
              <div class="banner-edit-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              </div>
              <span class="banner-edit-title">${p.thumbnail ? "썸네일 바꾸기" : "썸네일 올리기"}</span>
              <span class="banner-edit-sub">클릭해서 이미지 선택</span>
            </div>`}
            ${(p.thumbnail || inTrash || p._ro) ? "" : `<span class="banner-hint">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
              썸네일 없음</span>`}
          </div>
          <input type="file" accept="image/*" id="bannerFile" class="file-hidden">
          <div class="level-card">
            <div class="ring" id="progRing" style="--p:${ringStart}"><span id="ringPctText">${prog.overall}%</span></div>
            <div class="level-info">
              <b id="flavorText">${flavorFor(prog.overall)}</b>
              <small>${doneCount}/${p.stages.length}단계 완료</small>
            </div>
          </div>
          ${nextTaskCardHtml(p)}
          ${linkListHtml(p)}
        </div>
        <div class="detail-right">
          <div class="stage-list" id="stageList"></div>
        </div>
        <div class="detail-notes">
          ${noteBoardHtml(p, inTrash || p._ro)}
        </div>
      </div>
    `;
    const bumpRing = progressBumped;         // 값을 먼저 잡아둔다 (rAF 는 나중에 실행됨)
    progressBumped = false;
    requestAnimationFrame(()=>{
      const ringEl = document.getElementById("progRing");
      if(!ringEl) return;
      ringEl.style.setProperty("--p", prog.overall);
      if(bumpRing){                          // 진행률이 방금 오른 경우에만 한 번
        ringEl.classList.add("bump");
        setTimeout(()=>ringEl.classList.remove("bump"), 560);
      }
    });
    lastRingPct[p.id] = prog.overall;
    if(!inTrash){
      const bannerEl = document.getElementById("detailBanner");
      const takeImage = (file)=>{
        if(!file || !/^image\//.test(file.type)){
          showFleetingToast("이미지 파일만 넣을 수 있어요", true);
          return;
        }
        encodeImage(file, {maxW:480, aspect:16/9}, (dataUrl)=>{
          updateProject(p.id, {thumbnail: dataUrl});
          showFleetingToast("썸네일을 바꿨어요");
        });
      };

      bannerEl.addEventListener("click", ()=>document.getElementById("bannerFile").click());
      document.getElementById("bannerFile").addEventListener("change", (e)=>{
        takeImage(e.target.files[0]);
        e.target.value = "";               // 같은 파일 다시 고를 수 있게
      });

      // 파일을 끌어다 놓기
      ["dragenter","dragover"].forEach(ev=>
        bannerEl.addEventListener(ev, (e)=>{ e.preventDefault(); bannerEl.classList.add("drop-on"); }));
      ["dragleave","dragend"].forEach(ev=>
        bannerEl.addEventListener(ev, ()=> bannerEl.classList.remove("drop-on")));
      bannerEl.addEventListener("drop", (e)=>{
        e.preventDefault();
        bannerEl.classList.remove("drop-on");
        takeImage(e.dataTransfer.files && e.dataTransfer.files[0]);
      });

      // 캡처한 이미지를 Ctrl+V 로 바로 붙이기
      const onPaste = (e)=>{
        if(state.view !== "detail" || state.active !== p.id) return;
        const t = e.target;
        if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
        const items = (e.clipboardData && e.clipboardData.items) || [];
        for(let i=0;i<items.length;i++){
          if(items[i].type && items[i].type.indexOf("image") === 0){
            e.preventDefault();
            takeImage(items[i].getAsFile());
            return;
          }
        }
      };
      document.addEventListener("paste", onPaste);
      // 다음 렌더에서 중복 등록되지 않게 정리
      bannerPasteCleanup.forEach(fn=>fn());
      bannerPasteCleanup.length = 0;
      bannerPasteCleanup.push(()=> document.removeEventListener("paste", onPaste));
    } else {
      document.getElementById("detailBanner").style.cursor = "default";
    }
    // 포스트잇
    const addBtn = document.getElementById("noteAddBtn");
    if(addBtn) addBtn.addEventListener("click", ()=>openNoteModal(p, null));

    /* 끌어서 순서 바꾸기 — 어디로 들어갈지 막대로 먼저 보여준다.

       메모가 옆으로 놓이면 좌우를, 세로로 쌓이면 위아래를 봐야 한다.
       오른쪽 칸으로 옮기고 나서 한 줄로 쌓이는데 막대는 왼쪽에 서 있었다 —
       위에 넣겠다는 건지 앞에 넣겠다는 건지 알 수 없었다.
       그래서 지금 몇 칸으로 놓였는지 보고 방향을 정한다. */
    if(!inTrash){
      const board = document.querySelector(".note-board");
      let dragId = null;
      let vertBoard = false;
      const clearMarks = ()=> document.querySelectorAll(".note.drop-before,.note.drop-after")
        .forEach(el=> el.classList.remove("drop-before","drop-after"));

      document.querySelectorAll("[data-note]").forEach(el=>{
        el.addEventListener("dragstart", (e)=>{
          dragId = el.dataset.note;
          el.classList.add("dragging");
          if(board){
            const cols = getComputedStyle(board).gridTemplateColumns.split(/\s+/).filter(Boolean).length;
            vertBoard = cols <= 1;
            board.classList.toggle("col", vertBoard);
            board.classList.add("dragging");
          }
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", dragId);
        });
        el.addEventListener("dragend", ()=>{
          el.classList.remove("dragging");
          if(board) board.classList.remove("dragging");
          clearMarks(); dragId = null;
        });
        el.addEventListener("dragover", (e)=>{
          if(!dragId || el.dataset.note === dragId) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          const r = el.getBoundingClientRect();
          const before = vertBoard
            ? e.clientY < r.top + r.height / 2
            : e.clientX < r.left + r.width / 2;
          clearMarks();
          el.classList.add(before ? "drop-before" : "drop-after");
        });
        el.addEventListener("drop", (e)=>{
          if(!dragId) return;
          e.preventDefault(); e.stopPropagation();      // 보드의 drop 까지 가면 맨 뒤로 가버린다
          const before = el.classList.contains("drop-before");
          clearMarks();
          moveNote(p, dragId, el.dataset.note, before);
        });
      });

      if(board){                                        // 빈 자리에 떨어뜨리면 맨 뒤로
        board.addEventListener("dragover", (e)=>{ if(dragId) e.preventDefault(); });
        board.addEventListener("drop", (e)=>{
          if(!dragId) return;
          e.preventDefault(); clearMarks();
          moveNote(p, dragId, null, false);
        });
      }
    }
    document.querySelectorAll("[data-note]").forEach(el=>{
      el.addEventListener("click", (e)=>{
        if(e.target.closest("[data-notedel]")) return;
        if(el.classList.contains("editing")) return;      // 편집 중에는 그대로 둔다
        const n = (p.notes||[]).find(x=>x.id === el.dataset.note);
        if(n && !inTrash) beginNoteEdit(p, el, n);
      });
    });
    document.querySelectorAll("[data-notedel]").forEach(el=>{
      el.addEventListener("click", (e)=>{
        e.stopPropagation();
        const id = el.dataset.notedel;
        const card = el.closest(".note");
        if(card){                       // 떼어지는 모션 뒤에 지운다
          card.classList.add("peel");
          setTimeout(()=>trashNote(p, id), 220);
        }
      });
    });
    justStuckNoteId = null;             // 모션은 한 번만
    // 링크 모음에서 로컬 경로는 눌러서 복사
    const allLinks = collectLinks(p);
    document.querySelectorAll("[data-copylink]").forEach(el=>{
      el.addEventListener("click", (e)=>{
        e.preventDefault();
        const l = allLinks[+el.dataset.copylink];
        if(l) copyText(l.url);
      });
    });

    const stageList = document.getElementById("stageList");
    p.stages.forEach((stage, si)=>{
      const key = p.id+":"+si;
      const pct = prog.pcts[si];
      const isOpen = openStages.has(key);
      const isDone = pct===100;
      const el = document.createElement("div");
      el.className = "stage"+(isDone?" done":"")+(isOpen?" open":"")+(justCompletedStageKey===key?" flash":"");
      const subHtml = stage.subtasks.map((s,ti)=>`
        <div class="sub-item${s.done?' done':''}" data-ti="${ti}">
          <span class="sub-check">${s.done?"✓":""}</span>
          <span class="sub-text" contenteditable="true" spellcheck="false">${s.t}</span>
          ${!s.url ? ""
            : isLocalPath(s.url)
            ? `<span class="sub-link-icon" data-copysub="${ti}" title="${escapeHtml(s.url)} — 눌러서 경로 복사"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>`
            : `<a href="${s.url}" target="_blank" rel="noopener" class="sub-link-icon" title="${escapeHtml(s.url)}" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg></a>`}
          ${s.url ? "" : `<button class="sub-link-add" data-sublinkadd="${ti}" title="이 하위 작업에 링크 연결">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg></button>`}
          <button class="sub-rm">✕</button>
        </div>`).join("");
      el.innerHTML = `
        <div class="stage-head">
          <span class="stage-check">${isDone?"✓":""}</span>
          <span class="stage-icon">${stage.icon || iconFor(stage.name)}</span>
          ${!stage.url
            ? `<span class="stage-title">${stage.name}</span>`
            : isLocalPath(stage.url)
            ? `<span class="stage-title stage-title-link" data-copypath="${si}" title="${escapeHtml(stage.url)}">
                <span>${stage.name}</span>
                <svg class="lk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                <span class="lk-hint">경로 복사<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></span></span>`
            : `<a href="${stage.url}" target="_blank" rel="noopener" class="stage-title stage-title-link" title="${escapeHtml(stage.url)}" onclick="event.stopPropagation()">
                <span>${stage.name}</span>
                <svg class="lk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
                <span class="lk-hint">링크 열기<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg></span></a>`}
          <span class="stage-fill"></span>
          ${stage.url ? "" : `<button class="stage-link-add" data-linkadd="${si}" title="이 단계에 링크 연결">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
                <span>링크 연결</span></button>`}
          ${stage.subtasks.length ? `<span class="stage-subcount">${stage.subtasks.filter(s=>s.done).length}/${stage.subtasks.length}</span>` : ""}
          ${miniTrackHtml(stage, pct)}
          <span class="stage-pct">${pct}%</span>
          <span class="stage-caret">▶</span>
        </div>
        <div class="stage-body">
          <div class="stage-body-inner">
            ${subHtml}
            <div class="sub-add-row"><input type="text" placeholder="하위 작업을 입력하고 Enter"><button>추가</button></div>
          </div>
        </div>
      `;
      requestAnimationFrame(()=>{
        const fillEl = el.querySelector(".stage-mini-fill");
        if(fillEl) fillEl.style.width = pct + "%";
      });
      lastStagePct[key] = pct;
      if(justCompletedStageKey===key){
        justCompletedStageKey = null;
        setTimeout(()=> el.classList.remove("flash"), 650);
      }
      // 단계 전체가 아니라 "단계 줄"에만 건다. 펼친 본문(입력칸·하위 작업)까지
      // 걸려 있으면 글자를 복사하려 우클릭했는데 단계 메뉴가 뜬다.
      bindCtx(el.querySelector(".stage-head"), ()=>{
        return [
          {icon: isDone ? ICON.circle : ICON.check, label: isDone ? "완료 해제" : "완료로 표시", action:()=>{
            const wasDone = isDone;
            if(stage.subtasks.length>0){ stage.subtasks.forEach(s=> s.done = !wasDone); }
            else { stage.manualDone = !wasDone; }
            if(!wasDone) justCompletedStageKey = key;
            save(); renderAll();
          }},
          {icon:ICON.rename, label:"단계 이름 수정", action:()=>{
            openSubModal("단계 이름 수정", `<div class="field"><input type="text" id="stName" value="${stage.name.replace(/"/g,'&quot;')}"></div>
              <div class="modal-actions"><button class="btn-ghost" id="cCancel">취소</button><button class="btn-primary" id="cOk">저장</button></div>`,
              (m2)=>{
                m2.querySelector("#cCancel").onclick = closeSubModal;
                m2.querySelector("#cOk").onclick = ()=>{
                  stage.name = m2.querySelector("#stName").value.trim() || stage.name;
                  closeSubModal(); save(); renderAll();
                };
                submitOnEnter(m2, "#cOk");
                m2.querySelector("#stName").focus();
              });
          }},
          {icon:ICON.link, label: stage.url ? "링크 수정" : "링크 연결",
           action:()=> openStageLinkModal(stage)},
          "sep",
          {icon:ICON.broom, label:"하위 작업 모두 삭제", danger:true, action:()=>{
            stage.subtasks = []; stage.manualDone = false;
            save(); renderAll();
          }},
        ];
      });
      el.querySelector(".stage-head").addEventListener("click", ()=>{
        if(openStages.has(key)) openStages.delete(key); else openStages.add(key);
        renderDetailBody();
      });
      const copyPathEl = el.querySelector("[data-copypath]");
      if(copyPathEl){
        copyPathEl.style.cursor = "pointer";
        copyPathEl.addEventListener("click", (e)=>{
          e.stopPropagation();          // 단계 펼치기와 겹치지 않게
          copyText(stage.url);
        });
      }
      const linkAddBtn = el.querySelector(".stage-link-add");
      if(linkAddBtn) linkAddBtn.addEventListener("click", (e)=>{
        e.stopPropagation();               // 단계 펼치기와 겹치지 않게
        openStageLinkModal(stage);
      });
      el.querySelector(".stage-check").addEventListener("click", (e)=>{
        e.stopPropagation();
        const before = progressOf(p).overall;
        const makeDone = !isDone;
        if(stage.subtasks.length>0){
          stage.subtasks.forEach(s=> s.done = makeDone);
        } else {
          stage.manualDone = makeDone;
        }
        e.currentTarget.classList.add("pop");
        if(makeDone) justCompletedStageKey = key;
        setTimeout(()=>{
          save(); renderAll();
          const after = progressOf(p).overall;
          if(before<100 && after===100){ celebrateProject(); }
        }, 160);
      });
      el.querySelectorAll(".sub-item").forEach(row=>{
        const ti = +row.dataset.ti;
        if(justToggledSubKey === key + ":" + ti){
          justToggledSubKey = null;
          const chk = row.querySelector(".sub-check");
          if(chk){ chk.classList.add("pop"); setTimeout(()=>chk.classList.remove("pop"), 400); }
        }
        const toggle = ()=>{
          const before = progressOf(p).overall;
          const wasStageDone = isDone;
          const makeDone = !stage.subtasks[ti].done;
          stage.subtasks[ti].done = makeDone;
          const nowStageDone = stage.subtasks.every(s=>s.done);
          if(!wasStageDone && nowStageDone) justCompletedStageKey = key;
          justToggledSubKey = key + ":" + ti;
          const after = progressOf(p).overall;   // 이미 반영된 상태 — 재렌더 전에 계산
          if(after > before) progressBumped = true;
          save(); renderAll();
          if(before<100 && after===100){ celebrateProject(); }
        };
        const subLinkAdd = row.querySelector("[data-sublinkadd]");
        if(subLinkAdd) subLinkAdd.addEventListener("click",(e)=>{
          e.stopPropagation();
          openSubtaskLinkModal(stage.subtasks[ti]);
        });
        const copySubEl = row.querySelector("[data-copysub]");
        if(copySubEl){
          copySubEl.style.cursor = "pointer";
          copySubEl.addEventListener("click",(e)=>{ e.stopPropagation(); copyText(stage.subtasks[ti].url); });
        }
        row.querySelector(".sub-check").addEventListener("click",(e)=>{e.stopPropagation();toggle();});
        const txt = row.querySelector(".sub-text");
        txt.addEventListener("click",(e)=>e.stopPropagation());
        txt.addEventListener("blur", ()=>{
          const v = txt.textContent.trim();
          stage.subtasks[ti].t = v || stage.subtasks[ti].t;
          save();
        });
        txt.addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ e.preventDefault(); txt.blur(); } });
        row.querySelector(".sub-rm").addEventListener("click",(e)=>{e.stopPropagation();stage.subtasks.splice(ti,1);save();renderAll();});
        bindCtx(row, ()=>{
          const sub = stage.subtasks[ti];
          return [
            {icon:ICON.link, label: sub.url ? "링크 수정" : "링크 연결",
             action:()=> openSubtaskLinkModal(sub)},
            "sep",
            {icon:ICON.trash, label:"삭제", danger:true, action:()=>{ stage.subtasks.splice(ti,1); save(); renderAll(); }},
          ];
        });
      });
      const addRow = el.querySelector(".sub-add-row");
      const addInput = addRow.querySelector("input");
      const doAdd = ()=>{
        const t = addInput.value.trim();
        if(!t) return;
        stage.subtasks.push({t, done:false});
        openStages.add(key);
        focusSubAddKey = key;      // 다시 그린 뒤 이 단계 입력칸으로 커서를 돌려준다
        save(); renderAll();
      };
      addRow.querySelector("button").addEventListener("click",(e)=>{e.stopPropagation();doAdd();});
      addInput.addEventListener("click",(e)=>e.stopPropagation());
      addInput.addEventListener("keydown",(e)=>{
        if(e.key !== "Enter") return;
        if(e.isComposing || e.keyCode === 229) return;   // 한글 조합 확정용 Enter
        e.stopPropagation(); e.preventDefault();
        doAdd();
      });
      if(focusSubAddKey === key){
        focusSubAddKey = null;
        setTimeout(()=>{ addInput.focus(); }, 0);   // rAF 는 창이 가려지면 안 돈다
      }
      stageList.appendChild(el);
    });
  }

  function renderAll(){
    if(pendingTrashId && !(state.view==="detail" && state.active===pendingTrashId)){
      const id = pendingTrashId; pendingTrashId = null;
      const idx = state.projects.findIndex(p=>p.id===id);
      if(idx>=0){
        const [pr] = state.projects.splice(idx,1);
        state.trash.push(pr);
        save();

    state.projects.forEach(syncCompleted);
    renderSidebar(); renderBody();
    playViewTransition();

  function playViewTransition(){
    const scroller = document.querySelector(".content-scroll");
    if(!scroller) return;
    const key = state.view + (state.view === "detail" ? ":" + state.active : "");
