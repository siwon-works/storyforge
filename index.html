    const goingBack = lastRenderedView && lastRenderedView.indexOf("detail") === 0;
    lastRenderedView = key;
    scroller.classList.remove("view-fwd","view-back");
    void scroller.offsetWidth;              // 리플로우 강제 — 애니메이션 재시작용

  function showRenameChannelSpot(ch){
    const el = document.querySelector('#chFilterList [data-ch="' + ch.id + '"]');
    if(!el) return;
    const r = el.getBoundingClientRect();
    const pad = 6;

    const layer = document.createElement("div");
    layer.className = "spot-layer";

    const hole = document.createElement("div");
    hole.className = "spot-hole";
    hole.style.left = (r.left - pad) + "px";
    hole.style.top = (r.top - pad) + "px";
    hole.style.width = (r.width + pad * 2) + "px";
    hole.style.height = (r.height + pad * 2) + "px";
    layer.appendChild(hole);

    const call = document.createElement("div");
    call.className = "spot-callout";
    call.innerHTML =
      '<h4>채널 이름 바꾸기</h4>' +
      '<p><b>내 채널</b>은 임시 이름입니다.<br>유튜브 채널 이름으로 바꿔두면 준비 끝입니다.</p>' +
      '<div class="spot-actions">' +
        '<button class="btn-ghost" id="spotLater">나중에</button>' +
        '<button class="btn-primary" id="spotRename">바꾸기</button>' +
      '</div>';
    layer.appendChild(call);
    document.body.appendChild(layer);

    // 채널 줄 오른쪽에 붙이되 화면 밖으로 나가지 않게
    const cw = call.offsetWidth, chh = call.offsetHeight;
    let left = r.right + 18;
    if(left + cw > window.innerWidth - 12) left = Math.max(12, r.left - cw - 18);
    let top = r.top + r.height / 2 - chh / 2;
    top = Math.min(Math.max(12, top), window.innerHeight - chh - 12);
    call.style.left = left + "px";
    call.style.top = top + "px";

    if(left > r.right){                                 // 말풍선 꼬리
      const arrow = document.createElement("div");
      arrow.className = "spot-arrow";
      arrow.style.left = (left - 18) + "px";
      arrow.style.top = (r.top + r.height / 2 - 9) + "px";
      layer.appendChild(arrow);
    }

    const close = ()=>{
      layer.remove();
      window.removeEventListener("resize", close);
      document.removeEventListener("keydown", onKey);
    };
    function onKey(e){ if(e.key === "Escape") close(); }
    layer.addEventListener("click", (e)=>{ if(e.target === layer) close(); });
    call.querySelector("#spotLater").onclick = close;
    call.querySelector("#spotRename").onclick = ()=>{
      close();
      openChannelModal(ch, ()=>renderAll());
    };
    window.addEventListener("resize", close);
    document.addEventListener("keydown", onKey);
  }

  document.addEventListener("keydown", (e)=>{
    const t = e.target;
    const typing = !!(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable));

    if(e.key === "Escape"){
      if(document.getElementById("subOverlay")){ closeSubModal(); return; }
      if(document.getElementById("modalOverlay")){ closeModal(); return; }
      if(typing){ t.blur(); return; }
      if(state.view === "detail"){
        state.view = "all"; state.active = null;
        save(); renderAll();
      }
      return;
    }

    if(typing) return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(document.getElementById("modalOverlay") || document.getElementById("subOverlay")) return;

    if(e.key === "/"){
      const s = document.getElementById("search");
      if(s){ e.preventDefault(); s.focus(); s.select(); }
      return;
    }
    if(e.key === "n" || e.key === "N"){

          const btn = m.querySelector("#invOk");
          btn.disabled = true; btn.textContent = "만드는 중…";
          const token = uid() + Math.random().toString(36).slice(2, 10);
          sb.from("channel_invites").insert({
            token: token, channel_id: c.id, role: "viewer",
            created_by: myUid, invite_email: mail,
            expires_at: new Date(Date.now() + INVITE_DAYS*86400000).toISOString()
          }).then(function(res){
            if(res.error) throw res.error;
            const url = link + "?join=" + token;
            out.innerHTML = `
              <div class="invite-box">
                <div class="invite-to">${escapeHtml(mail)} 에게 보낼 링크</div>
                <div class="invite-url" id="invUrl">${escapeHtml(url)}</div>
                <button class="btn-primary" id="invCopy" style="width:100%;margin-top:10px;">링크 복사</button>
              </div>`;
            btn.disabled = false; btn.textContent = "다시 만들기";
            out.querySelector("#invCopy").onclick = ()=>{ copyText(url); };
          }).catch(function(e){
            btn.disabled = false; btn.textContent = "링크 만들기";
            out.innerHTML = `<div class="auth-msg err">${escapeHtml(authErrText(e))}</div>`;
          });
        };
        m.querySelector("#invMail").focus();
      });
  }

  /* 초대 링크는 로그인 전에 열리는 경우가 대부분이다. 그런데 구글 로그인으로
     갔다 돌아오면 주소의 물음표 뒤가 통째로 날아간다 — 토큰도 같이 사라진다.
     그래서 부팅하자마자 브라우저에 적어두고, 로그인이 끝난 뒤에 꺼내 쓴다.
     (redirectTo 에 물음표를 붙이는 방법도 있지만, 그러면 리디렉션 허용 목록
      설정에 기대게 된다. 여기가 어긋나면 로그인 자체가 막힌다) */
  function captureJoinToken(){
    const m = location.search.match(/[?&]join=([^&]+)/);
    if(!m) return;
    try{ localStorage.setItem(JOIN_KEY, decodeURIComponent(m[1])); }catch(e){}
    // 주소에서는 지운다. 남겨두면 새로고침할 때마다 다시 수락을 시도한다.
    history.replaceState(null, "", location.origin + location.pathname);
  }
  function pendingJoinToken(){
    try{ return localStorage.getItem(JOIN_KEY); }catch(e){ return null; }
  }
  function clearJoinToken(){
    try{ localStorage.removeItem(JOIN_KEY); }catch(e){}
  }

  function consumeJoinToken(){
    const token = pendingJoinToken();
    if(!token || !sb) return;
    clearJoinToken();          // 성공하든 실패하든 한 번만 시도한다
    sb.rpc("redeem_channel_invite", {p_token: token}).then(function(res){
      if(res.error){ showFleetingToast(authErrText(res.error), true); return; }
      showFleetingToast("채널에 들어왔어요");
      location.reload();
    }).catch(function(e){
      showFleetingToast(authErrText(e), true);
    });
  }

  /* 이 채널을 함께 쓰는 사람들. 이름은 각자가 적어둔 표시 이름이다 —
     계정 이메일은 아무에게도 보여주지 않는다. */
  /* 남을 채널에서 빼는 일이라 확인을 받는다. 이 앱은 되돌릴 수 없는 동작에
     늘 확인 창을 쓴다 — 여기만 인라인으로 처리하면 그게 더 놀랍다. */
  function confirmKick(c, btn){

    const mail = btn.dataset.mail || "";
    openSubModal("내보내기", `
      <dl class="facts">
        <dt>대상</dt><dd><b>${escapeHtml(name)}</b>${mail ? `<br><span style="color:var(--sub);font-size:var(--fs-xs);">${escapeHtml(mail)}</span>` : ""}</dd>
        <dt>채널</dt><dd>${escapeHtml(c.name)}</dd>
        <dt>그 뒤</dt><dd>이 채널이 상대 목록에서 사라집니다</dd>
        <dt>다시 넣으려면</dt><dd>초대 링크를 새로 만들어야 합니다</dd>
      </dl>
      <p class="modal-question">내보낼까요?</p>
      <div class="modal-actions">
        <button class="btn-ghost" id="kkCancel">취소</button>
        <button class="btn-primary" id="kkOk" style="background:var(--danger)">내보내기</button>
      </div>`, (m2)=>{
        m2.querySelector("#kkCancel").onclick = closeSubModal;
        m2.querySelector("#kkOk").onclick = ()=>{
          const ok = m2.querySelector("#kkOk");
          ok.disabled = true; ok.textContent = "내보내는 중…";
          sb.from("channel_members").delete()
            .eq("channel_id", c.id).eq("user_id", btn.dataset.kick)
            .then(function(res){
              if(res.error) throw res.error;
              closeSubModal();
              const row = btn.closest(".member-row");
              if(row) row.remove();
              showFleetingToast(name + " 님을 내보냈어요");
            })
            .catch(function(e){
              ok.disabled = false; ok.textContent = "내보내기";
              showFleetingToast(authErrText(e), true);
            });
        };
      });
  }

  function openMembersModal(c){
    openModal("멤버", `
      <dl class="facts"><dt>채널</dt><dd>${escapeHtml(c.name)}</dd></dl>
      <div id="memberList" style="margin-top:var(--sp-3);"><div class="auth-spinner"></div></div>
      <div class="modal-actions"><button class="btn-primary" id="mbClose">닫기</button></div>`,
      (m)=>{
        m.querySelector("#mbClose").onclick = closeModal;
        const box = m.querySelector("#memberList");
        if(!sb){ box.textContent = "로그인하면 보입니다."; return; }
        /* 이메일은 접근 규칙으로 칸 단위 차단이 안 돼서 함수로 감싸져 있다.
           같은 채널 멤버가 아니면 이 호출 자체가 거절된다. */
        sb.rpc("channel_member_list", {p_channel: c.id})
          .then(function(res){
            if(res.error) throw res.error;
            const rows = res.data || [];
            if(!rows.length){ box.innerHTML = `<div class="empty-state">아직 나뿐입니다.</div>`; return; }
            const iAmOwner = !c.shared;
            box.innerHTML = rows.map(function(r){
              const me = r.member_id === myUid;
              // 소유자는 자기를 못 내보낸다. 내보내면 자기 채널에 못 들어간다.
              const canKick = iAmOwner && !me && r.member_role !== "owner";
              return `<div class="member-row">
                <span class="member-name">${escapeHtml(r.member_name || "이름 없음")}${me ? ` <span class="member-me">나</span>` : ""}
                  <span class="member-mail">${escapeHtml(r.member_email || "")}</span></span>
                <span class="member-role">${ROLE_LABEL[r.member_role] || r.member_role}</span>
                ${canKick ? `<button class="member-kick" data-kick="${escapeHtml(r.member_id)}"
                   data-name="${escapeHtml(r.member_name || "")}"
                   data-mail="${escapeHtml(r.member_email || "")}">내보내기</button>` : ""}
              </div>`;
            }).join("");
            box.querySelectorAll("[data-kick]").forEach(function(btn){
              btn.onclick = function(){ confirmKick(c, btn); };
            });
          })
          .catch(function(e){
            box.innerHTML = `<div class="empty-state">${escapeHtml(authErrText(e))}</div>`;
          });
      });
  }

  function openSettingsModal(){
    openModal("설정", `
      <div style="display:flex;flex-direction:column;gap:6px;">
        ${sb && authedUser ? `
        <button type="button" id="nickRow" class="opt-row">

          ${ICON.settings}<span style="flex:1;">진행 단계 기본값 설정</span><span style="color:var(--sub);font-size:var(--fs-sm);">▶</span>

  /* 설치.
     크롬·엣지는 beforeinstallprompt 를 건네주므로 설치창을 바로 띄운다.
     사파리에는 그런 게 없고, 크롬도 한 번 취소하면 그 기회가 사라진다.
     그때는 손으로 하는 방법을 알려주는 수밖에 없다. */
  function doInstall(){
    if(installPrompt){
      const p = installPrompt;
      installPrompt = null;                  // 한 번 쓰면 다시 못 쓰는 물건이다
      try{
        p.prompt();
        /* 설정 창은 여기서 닫는다. 결과를 기다렸다 닫으면 안 된다 —
           설치가 끝나는 순간 appinstalled 가 안내창을 띄우는데, 그 직후에
           닫기가 실행되면 방금 뜬 안내창을 도로 닫아버린다. 둘은 거의 동시에 온다. */
        closeModal();
        return;
      }catch(e){ /* 아래 안내로 넘어간다 */ }
    }
    openInstallHelp();
  }

  function openInstallHelp(){
    const ua = navigator.userAgent;
    const isIOS     = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/.test(ua);
    const isFirefox = /Firefox/.test(ua);

    let steps;
    if(isIOS){
      steps = `<li>아래 <b>공유</b> 버튼 누르기</li>
               <li>목록 내려 <b>홈 화면에 추가</b></li>
               <li><b>추가</b> 누르면 끝</li>`;
    }else if(isAndroid){
      steps = `<li>오른쪽 위 <b>⋮</b> 누르기</li>
               <li><b>앱 설치</b> 누르기</li>`;
    }else if(isFirefox){
      steps = `<li>파이어폭스는 설치가 안 돼요</li>
               <li><b>크롬</b>·<b>엣지</b>로 열면 됩니다</li>`;
    }else{
      steps = `<li>주소창 오른쪽 <b>설치 아이콘</b> 클릭</li>
               <li>없으면 <b>⋮</b> → <b>앱</b> → <b>앱으로 설치</b></li>`;
    }

    openSubModal("앱으로 설치", `
      <p class="modal-question" style="margin-top:0;">설치창을 바로 띄울 수 없어요.</p>
      <ul class="steps">${steps}</ul>
      <p class="note-sm">이미 설치하셨다면 이 안내가 뜨는 게 정상이에요.
        브라우저가 설치된 앱에는 설치창을 다시 띄우지 않거든요.</p>
      <div class="modal-actions">
        <button class="btn-ghost" id="doneBtn">이미 설치했어요</button>
        <button class="btn-primary" id="okBtn">알겠어요</button>
      </div>
    `, (m)=>{
      m.querySelector("#okBtn").onclick = closeSubModal;
      m.querySelector("#doneBtn").onclick = ()=>{
        try{ localStorage.setItem(INSTALLED_KEY, "1"); }catch(e){}
        closeSubModal(); closeModal();
        showFleetingToast("설치 항목을 감췄어요");
      };
    });
  }

  /* 계정 삭제 — 24시간 뒤에 실제로 지워진다.
     "정말요?" 한 번으로는 실수로 눌린다. 자기 이메일을 직접 쳐야 버튼이 열리게 했다. */
  function confirmDeleteAccount(){
    const email = (authedUser && authedUser.email) || "";
    const stories = state.projects.length + state.trash.length;
    const notes = state.projects.reduce((a,p)=> a + ((p.notes||[]).length), 0)
                + state.trash.reduce((a,p)=> a + ((p.notes||[]).length), 0)
                + (state.noteTrash||[]).length;
    openModal("계정 삭제", `
      <div class="warn-head">⚠️ 되돌릴 수 없음</div>
      <dl class="facts">
        <dt>삭제 대상</dt><dd>이야기 ${stories} · 메모 ${notes} · 채널 ${state.channels.length}</dd>
        <dt>삭제 범위</dt><dd>이 브라우저 + 클라우드</dd>
        <dt>실행 시점</dt><dd>24시간 뒤</dd>
        <dt>취소</dt><dd>24시간 안에 다시 로그인</dd>
        <dt>재가입</dt><dd>삭제 7일 뒤부터</dd>
      </dl>
      <p class="modal-question" style="margin-bottom:var(--sp-2);">확인을 위해 <b>${escapeHtml(email)}</b> 입력</p>
      <input type="text" id="delMail" class="auth-field" style="text-align:left;letter-spacing:0;font-weight:400;margin-bottom:0;" placeholder="${escapeHtml(email)}" autocomplete="off" spellcheck="false">
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelBtn">취소</button>
        <button class="btn-primary" id="okBtn" style="background:var(--danger)" disabled>계정 삭제</button>
      </div>
    `, (m)=>{
      const inp = m.querySelector("#delMail");
      const ok  = m.querySelector("#okBtn");
      const sync = ()=>{ ok.disabled = inp.value.trim().toLowerCase() !== email.toLowerCase(); };
      inp.addEventListener("input", sync);
      inp.focus();
      m.querySelector("#cancelBtn").onclick = closeModal;
      ok.onclick = ()=>{
        ok.disabled = true; ok.textContent = "처리 중…";
        sb.rpc("request_account_deletion").then(function(res){
          if(res.error) throw res.error;
          closeModal();
          // 로컬 사본을 지우지 않으면 취소했을 때와 구분이 안 되고, 남의 기기에 그대로 남는다
          try{ localStorage.removeItem("yadam-state-v5"); }catch(e){}
          doSignOut();
        }).catch(function(e){
          ok.disabled = false; ok.textContent = "계정 삭제";
          showFleetingToast(authErrText(e), true);
        });
      };
    });
  }

  /* ---------- 내보내기 / 불러오기 ----------
     업데이트가 데이터를 깨뜨렸을 때 되돌릴 수단. 저장 방식이 무엇이든(로컬/db/나중에 다른 서버)
     사용자 손에 사본이 남는 게 마지막 안전망이다. */
  function exportData(){
    const payload = {
      app: "이야기공방",
      schemaVersion: state.schemaVersion || SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      data: {
        projects: state.projects,
        trash: state.trash,
        noteTrash: state.noteTrash,
        channels: state.channels,
        stageTemplate: state.stageTemplate
      }
    };
    const text = JSON.stringify(payload, null, 2);
    const d = new Date();
    const pad = (n)=> String(n).padStart(2,"0");
    const filename = `이야기공방-백업-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;

    // 아티팩트 안에서는 페이지가 시작하는 다운로드가 막혀 있어 전용 통로를 쓴다
    const viaBrowser = ()=>{
      try{
        const blob = new Blob([text], {type:"application/json"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        showFleetingToast("백업 파일을 내려받았어요");
      }catch(e){
        showFleetingToast("내보내기에 실패했어요", true);
      }
    };
    if(typeof window.claude !== "undefined" && window.claude && typeof window.claude.use === "function"){
      window.claude.use("downloads").then(dl=>{
        if(!dl){ viaBrowser(); return; }
        return dl.save({filename, data:text})
          .then(()=> showFleetingToast("백업 파일을 저장했어요"))
          .catch(err=>{
            if(err && err.code === "declined") return;      // 사용자가 취소한 건 오류가 아니다
            console.warn("내보내기 실패:", err && err.code, err && err.message);
            viaBrowser();
          });
      }).catch(viaBrowser);
    }else{
      viaBrowser();
    }
  }

  function importData(file){
    const reader = new FileReader();
    reader.onload = ()=>{
      let parsed;
      try{
        parsed = JSON.parse(reader.result);
      }catch(e){
        showFleetingToast("파일을 읽을 수 없어요. 백업 파일이 맞나요?", true);
        return;
      }
      const d = parsed && parsed.data ? parsed.data : parsed;   // 예전/단순 형식도 받아준다
      if(!d || !Array.isArray(d.projects)){
        showFleetingToast("이야기공방 백업 파일이 아니에요", true);
        return;
      }
      const n = d.projects.length + (Array.isArray(d.trash) ? d.trash.length : 0);
      openModal("백업 불러오기", `
        <div class="warn-head">⚠️ 되돌릴 수 없음</div>
        <dl class="facts">
          <dt>바꾼 뒤</dt><dd>백업에 담긴 이야기 ${n}개</dd>
          <dt>지금 데이터</dt><dd>모두 사라짐</dd>
        </dl>
        <p class="note-sm">먼저 지금 데이터를 내보내 두시는 걸 권해요.</p>
        <div class="modal-actions">
          <button class="btn-ghost" id="cancelBtn">취소</button>
          <button class="btn-primary" id="okBtn" style="background:var(--danger)">덮어쓰기</button>
        </div>
      `, (m)=>{
        m.querySelector("#cancelBtn").onclick = closeModal;
        m.querySelector("#okBtn").onclick = ()=>{
          state.projects = d.projects;
          state.trash = Array.isArray(d.trash) ? d.trash : [];
          state.noteTrash = Array.isArray(d.noteTrash) ? d.noteTrash : [];
          if(Array.isArray(d.channels)) state.channels = d.channels;
          if(Array.isArray(d.stageTemplate)) state.stageTemplate = d.stageTemplate;
          state.schemaVersion = typeof parsed.schemaVersion === "number" ? parsed.schemaVersion : 0;
          state.view = "all"; state.active = null; state.channelFilter = null;
          migrateState(state);        // 옛 버전 백업이어도 지금 형식으로 올린다
          normalizeState(state);
          save();
          closeModal();
          renderAll();
          showFleetingToast(`이야기 ${state.projects.length}개를 불러왔어요`);
        };
      });
    };
    reader.onerror = ()=> showFleetingToast("파일을 읽는 중 오류가 났어요", true);
    reader.readAsText(file);
  }

  function confirmResetAll(){
    const n = state.projects.length + state.trash.length;
    openModal("모든 데이터 초기화", `
      <div class="warn-head">⚠️ 되돌릴 수 없음</div>
      <dl class="facts">
        <dt>삭제 대상</dt><dd>이야기 ${n}개 · 채널 설정</dd>
        <dt>삭제 범위</dt><dd>이 브라우저 + 클라우드</dd>
        <dt>휴지통</dt><dd>거치지 않고 바로 삭제</dd>
        <dt>그 뒤</dt><dd>빈 상태, 채널 하나만 새로 생김</dd>
        <dt>계정</dt><dd>그대로 유지</dd>
      </dl>
      <p class="modal-question">정말 초기화할까요?</p>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelBtn">취소</button>
        <button class="btn-primary" id="okBtn" style="background:var(--danger)">전부 삭제</button>
      </div>
    `, (m)=>{
      m.querySelector("#cancelBtn").onclick = closeModal;
      m.querySelector("#okBtn").onclick = ()=>{
        const btn = m.querySelector("#okBtn");
        btn.disabled = true; btn.textContent = "지우는 중…";
        resetAllData();
      };
    });
  }

  // 로컬과 db 를 함께 비운다. 한쪽만 지우면 다음 실행 때 남은 쪽에서 되살아난다.
  function resetAllData(){
    dbReady = false;                 // 초기화 도중 되쓰기 방지
    clearTimeout(syncTimer);
    const finish = ()=>{
      try{
        localStorage.removeItem("yadam-state-v5");
        localStorage.removeItem(FIRSTRUN_KEY);   // 도장도 지워야 첫 실행 안내가 다시 뜬다
      }catch(e){}
      location.reload();
    };
    if(!db){ finish(); return; }
    lastChannelsSent = new Map();
    db.collection("projects").deleteAll()
      .then(()=> db.doc("meta/app").delete().catch(()=>{}))
      // 채널 표도 비운다. 안 그러면 초기화 뒤에도 옛 채널 행이 남는다.
      .then(()=> db.collection("channels").deleteAll().catch(()=>{}))
      .then(finish)
      .catch(e=>{
        console.warn("db 초기화 중 오류 — 로컬만 비우고 계속합니다:", e && e.code, e && e.message);
        finish();
      });
  }
  function openStageSettings(){
    let items = JSON.parse(JSON.stringify(state.stageTemplate));
    let openIdx = new Set();

    function bodyHtml(){
      return `
        <div id="stItems" style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px;">
          ${items.map((st,i)=>`
            <div style="border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;">
              <div style="display:flex;gap:6px;align-items:center;padding:8px;">
                <button type="button" data-toggle="${i}" style="border:none;background:none;color:var(--sub);cursor:pointer;font-size:var(--fs-xs);width:16px;transform:rotate(${openIdx.has(i)?90:0}deg);transition:transform .12s ease;">▶</button>
                <button type="button" data-icon-i="${i}" class="stIconBtn" title="아이콘 선택">${st.icon || "🔧"}</button>
                <input type="text" data-i="${i}" class="stItemInput" value="${st.name.replace(/"/g,'&quot;')}" placeholder="단계 이름  ex) 대본" style="flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg);color:var(--text);font-size:var(--fs-sm);">
                <span style="font-size:var(--fs-xs);color:var(--sub);white-space:nowrap;">${st.url ? "🔗 " : ""}${st.subtasks.length ? st.subtasks.length+"개":""}</span>
                <button type="button" data-rm="${i}" style="border:none;background:none;color:var(--sub);cursor:pointer;font-size:var(--fs-sm);">✕</button>
              </div>
              ${openIdx.has(i) ? `
                <div style="padding:0 10px 10px 34px;display:flex;flex-direction:column;gap:6px;">
                  <div style="display:flex;gap:6px;align-items:center;">
                    <span style="font-size:var(--fs-sm);color:var(--sub);" title="이 단계에서 늘 여는 주소">🔗</span>
                    <input type="text" data-urli="${i}" class="stUrlInput" placeholder="매번 같은 주소만  ex) 클로드 프로젝트" value="${(st.url||"").replace(/"/g,'&quot;')}" style="flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel);color:var(--text);font-size:var(--fs-sm);">
                  </div>
                  ${st.subtasks.map((t,ti)=>`
                    <div style="display:flex;gap:6px;align-items:center;">
                      <input type="text" data-si="${i}" data-ti="${ti}" class="stSubInput" value="${t.replace(/"/g,'&quot;')}" placeholder="하위 작업  ex) 초안 쓰기" style="flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel);color:var(--text);font-size:var(--fs-sm);">
                      <button type="button" data-subrm="${i}:${ti}" style="border:none;background:none;color:var(--sub);cursor:pointer;font-size:var(--fs-sm);">✕</button>
                    </div>
                  `).join("")}
                  <button type="button" data-subadd="${i}" style="border:1px dashed var(--border);background:none;color:var(--accent);border-radius:var(--r-sm);padding:6px 8px;font-size:var(--fs-xs);cursor:pointer;">+ 하위 작업 추가</button>
                </div>
              ` : ""}
            </div>
          `).join("")}
        </div>
        <button type="button" id="stAddBtn" style="border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:var(--r-md);padding:8px 10px;font-size:var(--fs-sm);cursor:pointer;width:100%;">+ 단계 추가</button>
        <p style="font-size:var(--fs-xs);color:var(--sub);margin:12px 0 0;">여기서 바꾼 기본 단계·링크·하위 작업은 <b>새로 만드는 이야기</b>부터 적용돼요. 이미 있는 이야기는 그대로 유지돼요.</p>
        <div class="modal-actions"><button class="btn-ghost" id="cancelBtn">취소</button><button class="btn-primary" id="saveBtn">저장</button></div>
      `;
    }

    openSubModal("진행 단계 기본값 설정", bodyHtml(), mountFn);
    const overlayModal = document.querySelector("#subOverlay .modal");
    if(overlayModal) overlayModal.style.width = "480px";

    function rerender(m){
      m.innerHTML = `<h3>진행 단계 기본값 설정</h3>${bodyHtml()}`;
      mountFn(m);
    }

    function mountFn(m){
      m.querySelectorAll(".stItemInput").forEach(inp=>{
        inp.addEventListener("input", ()=>{ items[+inp.dataset.i].name = inp.value; });
      });
      m.querySelectorAll(".stIconBtn").forEach(btn=>{
        btn.addEventListener("click", (e)=>{
          e.stopPropagation();
          const i = +btn.dataset.iconI;
          openIconPicker(btn, items[i].icon, (ic)=>{
            items[i].icon = ic;
            btn.textContent = ic;
          });
        });
      });
      m.querySelectorAll(".stUrlInput").forEach(inp=>{
        inp.addEventListener("input", ()=>{ items[+inp.dataset.urli].url = inp.value; });
      });
      m.querySelectorAll(".stSubInput").forEach(inp=>{
        inp.addEventListener("input", ()=>{ items[+inp.dataset.si].subtasks[+inp.dataset.ti] = inp.value; });
      });
      m.querySelectorAll("[data-toggle]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const i = +btn.dataset.toggle;
          if(openIdx.has(i)) openIdx.delete(i); else openIdx.add(i);
          rerender(m);
        });
      });
      m.querySelectorAll("[data-rm]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          items.splice(+btn.dataset.rm, 1);
          rerender(m);
        });
      });
      m.querySelectorAll("[data-subrm]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const [si,ti] = btn.dataset.subrm.split(":").map(Number);
          items[si].subtasks.splice(ti,1);
          rerender(m);
        });
      });
      m.querySelectorAll("[data-subadd]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const i = +btn.dataset.subadd;
          /* 빈 칸으로 넣는다. "새 하위 작업" 같은 값을 미리 채워두면
             쓰기 전에 지워야 한다. 저장할 때 빈 것은 알아서 버려진다. */
          items[i].subtasks.push("");
          openIdx.add(i);
          rerender(m);
          const inputs = m.querySelectorAll(`.stSubInput[data-si="${i}"]`);
          if(inputs.length) inputs[inputs.length-1].focus();
        });
      });
      m.querySelector("#stAddBtn").addEventListener("click", ()=>{
        items.push({name:"", icon:"🔧", url:"", subtasks:[]});
        rerender(m);
        m.querySelectorAll(".stItemInput")[items.length-1].focus();
      });
      m.querySelector("#cancelBtn").onclick = closeSubModal;
      m.querySelector("#saveBtn").onclick = ()=>{
        const cleaned = items
          .map(st=>({name: st.name.trim(), icon: (st.icon||"").trim() || "🔧", url: normalizeLinkValue(st.url||""), subtasks: st.subtasks.map(t=>t.trim()).filter(Boolean)}))
          .filter(st=>st.name);
        if(cleaned.length===0){ alert("최소 1개 이상의 단계가 필요해요."); return; }
        // 빈 칸으로 두고 저장하면 조용히 사라진다. 사라졌다는 건 알려줘야 한다.
        const dropped = items.length - cleaned.length;
        state.stageTemplate = cleaned;
        save(); closeSubModal();
        if(dropped) showFleetingToast("이름을 안 적은 단계 " + dropped + "개는 저장하지 않았어요");
      };
    }
  }

  // content zoom (sidebar/topbar excluded)
  const ZOOM_LEVELS = [90, 100, 110, 120, 130];
  /* 본문에 zoom 이 걸리면 화면 폭과 실제 쓸 수 있는 폭이 달라진다.
     130%면 1500px 화면도 속으로는 1154px 이다. 미디어 쿼리는 그걸 모르므로
     세 칸을 그대로 유지하다가 가운데가 짓눌린다. 그래서 직접 재서 표시해둔다. */
  function updateLayoutWidth(){
    const el = document.getElementById("body");
    if(el) el.classList.toggle("narrow", el.clientWidth < 1150);
  }

  function applyZoom(){
    const z = +(localStorage.getItem("yadam-zoom") || 100);
    document.getElementById("body").style.zoom = (z/100);
    updateLayoutWidth();
  }
  window.addEventListener("resize", updateLayoutWidth);
  document.getElementById("zoomBtn").addEventListener("click", ()=>{
    const cur = +(localStorage.getItem("yadam-zoom") || 100);
    const idx = ZOOM_LEVELS.indexOf(cur);
    const next = ZOOM_LEVELS[(idx>=0 ? idx+1 : 1) % ZOOM_LEVELS.length];
    localStorage.setItem("yadam-zoom", next);
    applyZoom();
    showFleetingToast(`본문 크기 ${next}%`);
  });
  applyZoom();
  // 사이드바를 접고 펴도 본문 폭이 바뀐다. 창 크기만 보면 놓친다.
  if(window.ResizeObserver){
    const bodyEl = document.getElementById("body");
    if(bodyEl) new ResizeObserver(updateLayoutWidth).observe(bodyEl);
  }


  renderAll();
}catch(e){
  console.error("앱 초기화 오류:", e);
  const banner = document.createElement("div");
  banner.style.cssText = "position:fixed;top:0;left:0;right:0;background:#c65b4a;color:#fff;padding:10px 16px;font-size:var(--fs-sm);z-index:9999;font-family:sans-serif;";
  banner.textContent = "⚠ 앱을 불러오는 중 오류가 발생했어요: " + (e && e.message ? e.message : e) + " — 페이지를 새로고침해보세요.";
  document.body.appendChild(banner);
}
})();
</script>
</body>
</html>
