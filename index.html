<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa">
<meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#09090b">
<style>
  :root{
    --bg:#fafafa; --panel:#ffffff; --border:#e4e4e7; --text:#18181b; --sub:#71717a;
    --accent:#2563eb; --accent-soft:#eff6ff; --card-shadow:0 1px 2px rgba(0,0,0,.04);
    --danger:#dc2626; --ok:#16a34a; --overlay:rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#09090b; --panel:#18181b; --border:#27272a; --text:#fafafa; --sub:#a1a1aa;
      --accent:#3b82f6; --accent-soft:#1e293b; --card-shadow:0 1px 2px rgba(0,0,0,.3); --overlay:rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"]{
    --bg:#09090b; --panel:#18181b; --border:#27272a; --text:#fafafa; --sub:#a1a1aa;
    --accent:#3b82f6; --accent-soft:#1e293b; --card-shadow:0 1px 2px rgba(0,0,0,.3); --overlay:rgba(0,0,0,.65);
  }
  /* ===================== 디자인 규격 =====================
     값을 눈대중으로 정하지 않는다. 아래 목록에 있는 것만 쓴다.
     선택지를 줄이는 게 정돈된 인상을 만든다. */
  :root{
    /* 글자 — 5단계 */
    --fs-xs:12px;    /* 캡션, 배지 */
    --fs-sm:14px;    /* 본문 */
    --fs-md:16px;    /* 강조 본문, 버튼 */
    --fs-lg:22px;    /* 섹션 제목 */
    --fs-xl:30px;    /* 화면 제목, 큰 숫자 */

    /* 모서리 — 4단계 */
    --r-sm:6px;      /* 배지, 작은 버튼 */
    --r-md:10px;     /* 버튼, 입력창 */
    --r-lg:16px;     /* 카드, 패널 */
    --r-full:999px;  /* 알약 */

    /* 그림자 — 3단계 */
    --sh-sm:0 1px 2px rgba(16,18,32,.05);
    --sh-md:0 3px 10px rgba(16,18,32,.07);
    --sh-lg:0 14px 40px rgba(16,18,32,.16);
    --sh-accent-sm:0 2px 8px rgba(109,94,248,.22);
    --sh-accent:0 4px 14px rgba(109,94,248,.38);
    --sh-danger:0 4px 14px rgba(224,85,74,.32);

    /* 여백 — 4의 배수만 */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
    --sp-5:24px; --sp-6:32px; --sp-7:48px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif;}
  button,input,select{font-family:inherit;}
  :root{ --side-w: 272px; }
  .app{display:flex;height:100vh;overflow:hidden;position:relative;}

  /* SIDEBAR */
  .side{width:272px;flex:0 0 272px;background:var(--panel);border-right:1px solid var(--border);box-shadow:none;display:flex;flex-direction:column;overflow:hidden;direction:rtl;
    transition:flex-basis .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1);}
  .side>*{direction:ltr;}
  .side.collapsed{width:64px;flex-basis:64px;}
  .brand{display:flex;align-items:center;gap:8px;padding:18px 16px;font-weight:700;font-size:var(--fs-md);border-bottom:1px solid var(--border);white-space:nowrap;}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto;}
  .brand-logo{padding:18px 16px 10px;flex:0 0 auto;transition:opacity .16s ease;
    display:flex;align-items:center;gap:8px;}
  /* 로고 옆 환경 라벨 — 제일 먼저 눈이 가는 자리다. 개발 환경에서만 보인다. */
  .env-tag{display:none;flex:0 0 auto;font-size:var(--fs-xs);font-weight:800;letter-spacing:.02em;
    padding:3px 8px;border-radius:var(--r-sm);background:#2b2b2b;color:#f2b705;white-space:nowrap;}
  .brand-logo img{height:26px;width:auto;display:block;}
  :root[data-theme="dark"] .brand-logo img{filter:invert(1);}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand-logo img{filter:invert(1);} }
  .side.collapsed .brand-logo{opacity:0;pointer-events:none;}
  .collapse-btn{
    position:absolute; top:18px; left:calc(var(--side-w) - 16px);
    width:32px;height:32px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--panel);color:var(--sub);
    cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:50;box-shadow:var(--sh-md);
    font-size:var(--fs-md);line-height:1;
    transition:left .28s cubic-bezier(.4,0,.2,1), background .12s ease, color .12s ease, transform .12s ease, border-color .12s ease;
  }
  .collapse-btn:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);transform:scale(1.08);}
  .collapse-btn:active{transform:scale(.9);}

  /* 사이드바 전체가 한 덩어리로 스크롤되면 이야기 목록이 맨 아래로 밀려 한두 개만 보인다.
     위(로고·계정·메뉴·채널)와 아래(설정·동기화)는 제자리에 두고, 목록만 스크롤시킨다.
     그래야 목록이 남는 높이를 전부 쓴다. */
  .nav{padding:10px 8px;flex:1;min-height:0;display:flex;flex-direction:column;}
  #projList{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;}
  .new-proj-btn{width:100%;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 13px;font-size:var(--fs-sm);font-weight:500;cursor:pointer;margin-bottom:10px;transition:background .12s ease, border-color .12s ease;}
  .new-proj-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .new-proj-btn .npb-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:var(--r-sm);background:var(--accent);color:#fff;font-size:var(--fs-sm);font-weight:700;flex:0 0 auto;}
  .new-proj-btn:active{transform:scale(.97);}
  .new-proj-btn:hover{background:var(--accent);color:#fff;}
  .section-label{font-size:var(--fs-sm);font-weight:600;color:var(--sub);padding:8px 10px 4px;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center;}
  .section-label button{border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;width:24px;height:24px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;transition:transform .12s ease, border-color .12s ease;}
  .section-label button svg{width:15px;height:15px;stroke-width:3;}
  .section-label button:hover{transform:scale(1.1);border-color:var(--text);}

  /* 채널 목록 접기 — 채널이 늘어나면 이야기 목록이 밀린다.
     1개면 고를 게 없으니 목록 자체를 감추고, 2개 이상일 때만 접기 화살표를 보여준다. */
  .section-label .sec-toggle{border:none;background:none;width:auto;height:auto;padding:0;
    display:flex;align-items:center;gap:4px;color:inherit;font:inherit;letter-spacing:inherit;}
  .section-label .sec-toggle:hover{transform:none;border-color:transparent;}
  .sec-caret{width:12px;height:12px;flex:0 0 auto;transition:transform .15s ease;}
  .sec-toggle.collapsed .sec-caret{transform:rotate(-90deg);}

  .nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:var(--fs-sm);font-weight:500;margin-bottom:1px;transition:background .12s ease;}
  .nav-svg-icon{width:18px;height:18px;flex:0 0 auto;color:var(--sub);}
  .nav-item.active .nav-svg-icon{color:var(--accent);}
  .nav-item:hover{transform:translateX(2px);}
  .nav-item:active{transform:translateX(2px) scale(.98);}
  .nav-item:hover{background:var(--accent-soft);}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .nav-item .count{margin-left:auto;font-size:var(--fs-sm);font-weight:700;color:var(--text);background:var(--bg);padding:2px 8px;border-radius:var(--r-full);}
  .nav-item.active .count{background:var(--accent);color:#fff;}
  .nav-item .chdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}

  .proj{display:flex;align-items:flex-start;gap:8px;padding:10px 11px;border-radius:var(--r-md);cursor:pointer;position:relative;margin-bottom:6px;
    background:var(--panel);box-shadow:none;border:1px solid var(--border);
    transition:background .12s ease, border-color .12s ease;}
  .proj:hover{border-color:var(--sub);}
  .proj.dragging{opacity:.4;}
  .proj.drag-over{outline:2px dashed var(--accent);outline-offset:-2px;}
  .proj:hover .proj-actions{opacity:1;}
  .proj.active{background:var(--accent-soft);border-color:var(--accent);}
  .proj.active .proj-name{color:var(--accent);font-weight:600;}
  .proj.completed{opacity:.55;}
  .proj-color{width:8px;height:8px;border-radius:50%;flex:0 0 auto;margin-top:6px;}
  .proj-main{flex:1;min-width:0;}
  /* 사이드바는 훑어보는 목록이다. 제목이 길면 2줄에서 자른다 —
     카드 제목(.pcard-title)이 이미 쓰는 방식과 같다. */
  .proj-name{font-size:var(--fs-sm);line-height:1.45;font-weight:600;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .proj.completed .proj-name{text-decoration:line-through;}
  .proj-date{font-size:var(--fs-xs);color:var(--sub);margin-top:4px;}
  .countdown-live{color:inherit;font-weight:700;font-variant-numeric:tabular-nums;}
  .proj-date.soon{color:var(--danger);font-weight:600;}
  .u-red{color:#e0554a;}
  .u-orange{color:#e08a34;}
  .u-yellow{color:#c9a227;}
  .u-green{color:#3f9c6f;}
  .proj-date.u-red,.proj-date.u-orange,.proj-date.u-yellow{font-weight:600;}
  .proj-bar{height:4px;border-radius:var(--r-sm);background:var(--border);margin-top:6px;overflow:hidden;}
  .proj-bar-fill{height:100%;background:var(--accent);border-radius:var(--r-sm);}
  .proj-actions{position:absolute;right:8px;top:8px;display:flex;gap:4px;opacity:0;transition:opacity .1s;}
  .icon-btn{width:20px;height:20px;border:none;background:var(--panel);border-radius:var(--r-sm);color:var(--sub);font-size:var(--fs-xs);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s ease, color .12s ease;}
  .icon-btn:hover{transform:scale(1.12);}
  .icon-btn:active{transform:scale(.92);}
  .icon-btn:hover{color:var(--accent);}
  .icon-btn.danger:hover{color:var(--danger);}

  .side .brand,.side .nav,.side .sidebar-tools{transition:opacity .16s ease; opacity:1;}
  .side.collapsed .brand,.side.collapsed .nav,.side.collapsed .sidebar-tools{opacity:0; pointer-events:none;}

  /* 설정·가이드·동기화 표시는 항상 보여야 한다. 목록이 길어지면 스크롤 밖으로
     밀려나는데, 동기화 문제는 스크롤해야 알게 되면 이미 늦다. */
  .sidebar-tools{margin-top:auto;padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;
    position:sticky;bottom:0;background:var(--panel);z-index:2;}
  .modal.wide{width:560px;max-height:82vh;display:flex;flex-direction:column;}
  .guide-scroll{flex:1;min-height:0;overflow-y:auto;margin:-4px -4px 0;padding:4px;}
  .guide-sec{margin-bottom:20px;}
  .guide-sec h4{margin:0 0 9px;font-size:var(--fs-md);font-weight:700;display:flex;align-items:center;gap:8px;}
  .guide-sec h4 .gi{width:24px;height:24px;border-radius:var(--r-md);background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:var(--fs-sm);flex:0 0 auto;}
  .guide-sec .gsub{font-size:var(--fs-sm);color:var(--sub);margin:-5px 0 9px 32px;letter-spacing:.01em;}
  .guide-sec ul{margin:0;padding-left:32px;}
  .guide-sec li{font-size:var(--fs-sm);line-height:1.8;margin-bottom:2px;}
  .guide-sec li b{color:var(--accent);font-weight:600;}
  .guide-note{font-size:var(--fs-sm);line-height:1.7;color:var(--sub);background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 13px;margin-left:32px;}
  .sync-status{display:flex;align-items:center;gap:7px;font-size:var(--fs-sm);color:var(--sub);padding:2px 4px 4px;white-space:nowrap;}
  .sync-status .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--sub);flex:0 0 auto;}
  .sync-status.ok .sync-dot{background:var(--ok);}
  .sync-status.err .sync-dot{background:var(--danger);}
  .sync-status.err{color:var(--danger);}
  .tool-link{font-size:var(--fs-sm);font-weight:500;color:var(--text);background:none;border:none;text-align:left;cursor:pointer;padding:6px 4px;display:flex;align-items:center;gap:9px;transition:color .12s ease;}
  .tool-link:hover{color:var(--accent);}
  .tool-link:hover{color:var(--accent);}

  /* MAIN */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
    background:var(--panel);border-bottom:none;padding:24px 36px 16px;flex:0 0 auto;}
  .content-scroll{flex:1;overflow-y:auto;padding:22px 36px 24px;}
  .head-left .eyebrow{font-size:var(--fs-sm);color:var(--sub);margin-bottom:4px;}
  .head-left h1{font-size:var(--fs-xl);margin:0;display:flex;align-items:center;gap:8px;}
  .back-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:var(--fs-sm);font-weight:600;cursor:pointer;padding:6px 12px 6px 10px;border-radius:var(--r-md);margin-bottom:10px;transition:color .12s ease, border-color .12s ease, background .12s ease, transform .12s ease;}
  .back-btn svg{width:15px;height:15px;transition:transform .12s ease;flex:0 0 auto;}
  .back-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}
  .back-btn:hover svg{transform:translateX(-2px);}
  .back-btn:active{transform:scale(.97);}
  .head-left h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 auto;}
  .title-input{font-size:var(--fs-xl);font-weight:700;border:none;border-bottom:2px solid var(--accent);background:transparent;color:var(--text);outline:none;padding:0;min-width:200px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .topbar-toolbar{display:flex;align-items:center;gap:14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-full);padding:7px 18px;}
  .topbar-divider{width:1px;height:22px;background:var(--border);flex:0 0 auto;}
  .theme-btn{width:36px;height:36px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--panel);color:var(--sub);cursor:pointer;font-size:var(--fs-md);display:flex;align-items:center;justify-content:center;transition:transform .15s ease, background .15s ease;}
  .theme-btn svg{width:17px;height:17px;}
  .theme-btn:hover{transform:rotate(-12deg) scale(1.06);}
  .theme-btn:active{transform:scale(.9);}
  .zoom-ctrl{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:3px;}
  .zoom-ctrl button{width:26px;height:26px;border:none;background:none;color:var(--sub);cursor:pointer;font-size:var(--fs-md);border-radius:var(--r-sm);transition:transform .12s ease, background .12s ease;}
  .zoom-ctrl button:active{transform:scale(.88);}
  .zoom-ctrl button:hover{background:var(--accent-soft);color:var(--accent);}
  .zoom-ctrl span{font-size:var(--fs-xs);color:var(--sub);width:38px;text-align:center;user-select:none;cursor:pointer;}

  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .search{flex:1;min-width:160px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel);color:var(--text);font-size:var(--fs-sm);}
  .search:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .sort-toggle{display:flex;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;}
  .sort-toggle button{background:var(--panel);border:none;color:var(--sub);cursor:pointer;font-size:var(--fs-sm);padding:0 12px;height:38px;white-space:nowrap;transition:background .12s ease, color .12s ease;}
  .sort-toggle button.active{background:var(--accent);color:#fff;}
  .view-toggle{display:flex;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;}
  .view-toggle button{width:38px;background:var(--panel);border:none;color:var(--sub);cursor:pointer;font-size:var(--fs-md);transition:background .12s ease, color .12s ease;}
  .view-toggle button.active{background:var(--accent);color:#fff;}
  .add-btn{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:var(--r-md);padding:0 16px;font-size:var(--fs-sm);font-weight:600;cursor:pointer;white-space:nowrap;height:36px;transition:opacity .12s ease;}
  .add-btn:hover{transform:translateY(-1px);box-shadow:var(--sh-accent);}
  .add-btn:active{transform:translateY(0) scale(.97);}
  .toggle-completed{font-size:var(--fs-sm);color:var(--sub);background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:0 14px;height:36px;cursor:pointer;}
  .toggle-completed.active{border-color:var(--accent);color:var(--accent);}
  .sub-note{font-size:var(--fs-sm);color:var(--sub);margin:-6px 0 14px;}

  .channel-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .channel-filter button{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--sub);
    background:var(--panel);border:1px solid var(--border);border-radius:var(--r-full);padding:6px 13px;cursor:pointer;
    transition:background .12s ease, border-color .12s ease, color .12s ease, transform .1s ease;}
  .channel-filter button:hover{border-color:var(--accent);color:var(--text);}
  .channel-filter button:active{transform:scale(.96);}
  .channel-filter button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .channel-filter .ch-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}

  .sidebar-ch-filter{display:flex;flex-direction:column;padding:0 8px 10px;}
  .sidebar-ch-filter button{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;border-radius:var(--r-md);padding:8px 9px;cursor:grab;font-size:var(--fs-sm);font-weight:500;color:var(--text);text-align:left;transition:background .12s ease, transform .1s ease;}
  .sidebar-ch-filter button:hover{background:var(--accent-soft);transform:translateX(2px);}
  .ch-count-badge{background:var(--bg);color:var(--text);font-size:var(--fs-sm);font-weight:700;padding:2px 8px;border-radius:var(--r-full);flex:0 0 auto;}
  .sidebar-ch-filter button.active .ch-count-badge{background:var(--accent);color:#fff;}
  .sidebar-ch-filter button.active{background:var(--accent-soft);color:var(--accent);font-weight:700;}
  .sidebar-ch-filter .all-icon{width:18px;height:18px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);background:var(--border);color:var(--sub);}
  .sidebar-ch-filter button.active .all-icon{background:var(--accent);color:#fff;}
  .ch-row-wrap{position:relative;}
  .ch-row-wrap.dragging button{opacity:.35;}
  .ch-drop-indicator{height:0;margin:0 8px;border-radius:var(--r-sm);background:var(--accent);transform:scaleY(0);transition:height .12s ease, transform .12s ease, margin .12s ease;}
  .ch-drop-indicator.show{height:3px;transform:scaleY(1);margin:3px 8px;box-shadow:var(--sh-accent-sm);}

  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px 14px;}
  .pgrid.list{grid-template-columns:1fr;}
  .pcard{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--card-shadow);position:relative;cursor:pointer;transition:box-shadow .15s ease, border-color .15s ease;}
  .pcard:hover{border-color:var(--sub);box-shadow:var(--sh-sm);}
  .pcard-thumb img{transition:transform .3s ease;}
  .pcard:hover .pcard-thumb img{transform:scale(1.05);}
  .pcard.dragging{opacity:.4;}
  .pcard.drag-over{outline:2px dashed var(--accent);outline-offset:-2px;}
  .pcard.completed .pcard-thumb,.pcard.completed .pcard-body{opacity:.55;}
  .pgrid.list .pcard{display:flex;align-items:stretch;gap:14px;}

  .pcard-thumb{position:relative;width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--tc1),var(--tc2));overflow:hidden;flex:0 0 auto;}
  .pgrid.list .pcard-thumb{width:190px;flex:0 0 190px;aspect-ratio:16/9;}
  .pcard-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .pcard-thumb .thumb-letter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:var(--fs-xl);font-weight:700;color:rgba(255,255,255,.85);}
  .pcard-thumb .thumb-prog-track{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.35);}
  .pcard-thumb .thumb-prog-fill{height:100%;background:var(--accent);}
  .pcard-thumb .thumb-pct-badge{position:absolute;right:6px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-size:var(--fs-sm);font-weight:700;padding:3px 8px;border-radius:var(--r-sm);}
  .stamp-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2;}
  /* 배너는 16:9 로 납작한데 도장은 거의 정사각형(500×438)이라 높이가 먼저 걸린다.
     높이만 잡고 비율은 그대로 둔다.
     선택자를 한 단계 더 준 이유: 뒤에 오는 `.detail-banner img` 가 같은 우선순위라
     그냥 두면 그쪽의 height:100%/object-fit:cover 가 이겨서 도장이 잘린다. */
  .stamp-overlay img,
  .detail-banner .stamp-overlay img{height:68%;width:auto;max-width:78%;object-fit:contain;
    opacity:1;transform:rotate(-8deg);filter:drop-shadow(0 3px 6px rgba(0,0,0,.3));}
  .stamp-overlay-card{position:absolute;left:50%;top:55%;width:74%;transform:translate(-50%,-50%) rotate(-8deg);pointer-events:none;z-index:5;}
  .stamp-overlay-card img{width:100%;display:block;opacity:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}
  /* 목록 보기에서는 카드가 화면 폭만큼 넓어진다. 도장 폭이 카드 기준(74%)이라
     같이 커져서 줄 전체를 덮어버린다. 썸네일 위에만 얹히도록 고정한다.
     썸네일은 폭 190px 고정, 높이는 카드에 맞춰 늘어나므로 세로는 50%로 맞춘다.
     도장 이미지가 500×438이라 폭 130px이면 회전까지 더해 131px — 카드 높이 안에 들어온다. */
  .pgrid.list .stamp-overlay-card{left:95px;top:50%;width:130px;}
  .pcard-thumb.completed-dim::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.15);z-index:1;}

  .pcard-body{padding:10px 12px 12px;}
  .pgrid.list .pcard-body{flex:1;padding:10px 12px 10px 0;display:flex;flex-direction:column;justify-content:center;}
  .pcard-title{font-size:var(--fs-sm);font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .pcard.completed .pcard-title{text-decoration:line-through;}
  .pcard-meta{font-size:var(--fs-xs);color:var(--sub);margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .pcard-meta .ch-badge{color:var(--accent);}
  /* 공유받은 채널 — 색을 더 쓰지 않는다. 채널마다 이미 색이 있어서 싸운다.
     사람 아이콘과 회색 꼬리표로만 구분한다. */
  .ch-owner{color:var(--sub);font-weight:400;}
  .member-row{display:flex;align-items:center;gap:10px;padding:10px 12px;
    border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:6px;font-size:var(--fs-sm);}
  .member-name{flex:1;font-weight:600;}
  .member-me{font-size:var(--fs-xs);color:var(--sub);font-weight:400;}
  .invite-box{border:1px solid var(--border);border-radius:var(--r-md);padding:12px;background:var(--bg);}
  .invite-to{font-size:var(--fs-xs);color:var(--sub);margin-bottom:6px;}
  .invite-url{font-size:var(--fs-xs);word-break:break-all;line-height:1.6;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px;}
  .member-mail{display:block;font-size:var(--fs-xs);color:var(--sub);font-weight:400;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .member-kick{flex:0 0 auto;border:1px solid var(--border);background:var(--panel);
    color:var(--sub);border-radius:var(--r-sm);padding:5px 10px;cursor:pointer;
    font-size:var(--fs-xs);font-family:inherit;white-space:nowrap;
    transition:border-color .12s ease, color .12s ease;}
  .member-kick:hover{border-color:var(--danger);color:var(--danger);}
  .member-role{font-size:var(--fs-xs);color:var(--sub);flex:0 0 auto;}
  .ch-group-label{font-size:var(--fs-xs);color:var(--sub);font-weight:700;
    padding:10px 8px 4px;margin-top:2px;border-top:1px solid var(--border);}
  /* 공유받은 이야기는 손댈 수 없다. 버튼을 지우지 않고 막기만 한다 —
     지우면 화면 구조가 달라져서 "왜 다르지" 가 되고, 막으면 "못 만지는구나" 가 된다. */
  .ro-view button:not(.ro-allow), .ro-view input, .ro-view textarea,
  .ro-view .stage-check, .ro-view .note{pointer-events:none;}
  .ro-view .stage-link-add, .ro-view .sub-link-add, .ro-view .note-del,
  .ro-view .pcard-actions, .ro-view .proj-actions{display:none !important;}
  .ro-banner{display:flex;align-items:center;gap:8px;margin-bottom:var(--sp-3);
    padding:9px 13px;border:1px dashed var(--border);border-radius:var(--r-md);
    background:var(--bg);color:var(--sub);font-size:var(--fs-sm);}
  .ro-banner b{color:var(--text);font-weight:700;}
  .ro-banner .btn-icon{width:14px;height:14px;flex:0 0 auto;}
  .ch-shared-mark{display:inline-flex;align-items:center;flex:0 0 auto;color:var(--sub);opacity:.8;}
  .ch-shared-mark .btn-icon{width:13px;height:13px;}
  .pcard.shared{border-style:dashed;}
  .pcard-channel .shared-mark{display:inline-flex;align-items:center;gap:4px;color:var(--sub);
    font-size:var(--fs-xs);margin-left:auto;flex:0 0 auto;}
  .pcard-channel .shared-mark .btn-icon{width:12px;height:12px;}
  .pcard-meta .soon{color:var(--danger);font-weight:600;}
  .pcard-channel{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:var(--fs-sm);font-weight:600;color:var(--text);}
  .channel-avatar{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:0 0 auto;background-color:var(--accent);}
  .pcard-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .1s;z-index:2;}
  .pcard:hover .pcard-actions{opacity:1;}
  .pcard-actions .icon-btn{background:rgba(0,0,0,.55);color:#fff;}
  .pcard-actions .icon-btn:hover{color:#fff;background:var(--accent);}
  .empty-state{color:var(--sub);font-size:var(--fs-sm);padding:60px 0;text-align:center;grid-column:1/-1;}

  /* Detail */
  .date-badge{margin-top:10px;display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:7px 14px;font-size:var(--fs-sm);cursor:pointer;position:relative;}
  .channel-badge-lg{margin-top:2px;margin-bottom:10px;display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:5px 12px 5px 5px;}
  .channel-badge-lg span:not(.channel-avatar){font-size:var(--fs-sm);font-weight:600;color:var(--sub);}
  .date-badge b{color:var(--accent);font-weight:600;}
  .date-badge:hover{border-color:var(--accent);}
  /* 채널·업로드일 배지와 버튼을 한 줄에 둔다. 따로 두면 줄만 늘고 내용이 밀린다. */
  .head-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .head-meta .channel-badge-lg,
  .head-meta .date-badge,
  .head-meta .detail-actions{margin:0;}
  .detail-actions{display:flex;gap:8px;margin-top:12px;}
  .btn-icon{width:15px;height:15px;flex:0 0 auto;}
  .detail-actions button{display:inline-flex;align-items:center;gap:7px;}
  .danger-outline-btn{display:inline-flex;align-items:center;gap:7px;}
  .ctx-item{display:flex;align-items:center;gap:9px;}
  .ctx-item .btn-icon{width:14px;height:14px;opacity:.8;}
  .icon-btn .btn-icon{width:12px;height:12px;}
  .trash-actions button{display:inline-flex;align-items:center;gap:6px;}
  .trash-actions .btn-icon{width:13px;height:13px;}
  #resetRow .btn-icon,#stSettingsRow .btn-icon{width:16px;height:16px;}
  .detail-actions button{font-size:var(--fs-sm);font-weight:600;border:1.5px solid var(--border);background:var(--panel);color:var(--text);border-radius:var(--r-md);padding:9px 16px;cursor:pointer;transition:border-color .12s ease, color .12s ease, transform .1s ease, box-shadow .12s ease;}
  .danger-outline-btn{font-size:var(--fs-sm);font-weight:600;border:1px solid var(--danger);background:var(--panel);color:var(--danger);border-radius:var(--r-md);padding:8px 16px;cursor:pointer;transition:background .12s ease, color .12s ease;}
  .danger-outline-btn:hover{background:var(--danger);color:#fff;box-shadow:var(--sh-danger);transform:translateY(-1px);}
  .danger-outline-btn:active{transform:translateY(0) scale(.97);}
  .detail-actions button:hover{color:var(--accent);border-color:var(--accent);box-shadow:var(--sh-accent-sm);transform:translateY(-1px);}
  #cancelTrashBtn:hover{color:#fff !important;border-color:var(--danger) !important;box-shadow:0 4px 12px rgba(224,85,74,.35) !important;filter:brightness(1.08);}
  .detail-actions button.danger:hover{color:var(--danger);border-color:var(--danger);box-shadow:var(--sh-danger);}
  .detail-actions button:active{transform:translateY(0) scale(.97);}
  .done-banner{margin-top:14px;background:var(--accent-soft);color:var(--accent);border-radius:var(--r-md);padding:10px 14px;font-size:var(--fs-sm);max-width:640px;}

  /* 메모를 세 번째 칸으로 뺐다. 단계 아래에 두면 단계가 많을수록 멀어져서,
     정작 작업하면서 적어야 할 때 스크롤을 한참 내려야 했다.
     칸이 하나 늘었으므로 최대 폭도 같이 늘린다 — 안 늘리면 가운데가 짓눌린다. */
  .detail-grid{display:grid;grid-template-columns:260px minmax(0,1fr) 288px;
    gap:24px;align-items:start;max-width:1400px;}
  /* 제 칸에 있을 때는 단계 목록과 윗줄을 맞춘다 */
  .detail-notes .note-card{margin-top:0;}
  /* 좁으면 메모를 단계 아래로 내린다 (왼쪽 칸 밑으로 가지 않게 열을 못 박는다).
     미디어 쿼리를 못 쓴다 — 본문에 zoom 이 걸려 있어서 화면 폭과 실제 쓸 수 있는
     폭이 다르다. 130%로 키우면 1500px 화면도 속으로는 1154px 이다.
     그래서 자바스크립트가 본문 폭을 직접 재서 .narrow 를 붙인다. */
  #body.narrow .detail-grid{grid-template-columns:260px minmax(0,1fr);}
  /* 왼쪽 칸을 두 줄에 걸치게 한다. 안 그러면 첫째 줄 높이를 왼쪽 칸이 정해버려서,
     왼쪽이 단계 목록보다 길 때 메모가 그 아래까지 밀려 빈 공간이 생긴다. */
  #body.narrow .detail-left{grid-row:1 / span 2;}
  #body.narrow .detail-right{grid-column:2;grid-row:1;}
  #body.narrow .detail-notes{grid-column:2;grid-row:2;}
  #body.narrow .detail-notes .note-card{margin-top:var(--sp-4);}
  .detail-right{width:100%;min-width:0;}
  @media (max-width:760px){
    .detail-grid{grid-template-columns:1fr;}
    .detail-left,.detail-right,.detail-notes{grid-column:auto;grid-row:auto;}
  }

  .detail-banner{width:100%;aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden;position:relative;cursor:pointer;background:linear-gradient(135deg,var(--tc1),var(--tc2));}
  .detail-banner img{width:100%;height:100%;object-fit:cover;display:block;}
  .detail-banner .banner-letter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:var(--fs-xl);font-weight:700;color:rgba(255,255,255,.85);}
  /* 배너 전체가 업로드 버튼임을 마우스 올렸을 때 분명히 보여준다 */
  .detail-banner{transition:box-shadow .18s ease;}
  .detail-banner:hover{box-shadow:var(--sh-md);}
  .detail-banner img{transition:transform .35s cubic-bezier(.22,1,.36,1), filter .2s ease;}
  .detail-banner:hover img{transform:scale(1.04);filter:brightness(.72);}
  .detail-banner .banner-letter{transition:filter .2s ease, opacity .2s ease;}
  .detail-banner:hover .banner-letter{opacity:.35;}

  .detail-banner .banner-edit{position:absolute;inset:0;z-index:3;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-1);
    background:rgba(12,12,20,.34);color:#fff;text-align:center;
    opacity:0;transition:opacity .18s ease;}
  .detail-banner:hover .banner-edit{opacity:1;}
  .banner-edit-icon{width:46px;height:46px;border-radius:var(--r-full);
    background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.55);
    display:flex;align-items:center;justify-content:center;margin-bottom:var(--sp-1);
    transform:translateY(6px) scale(.9);transition:transform .22s cubic-bezier(.34,1.56,.64,1);
    backdrop-filter:blur(2px);}
  .banner-edit-icon svg{width:21px;height:21px;}
  .detail-banner:hover .banner-edit-icon{transform:translateY(0) scale(1);}
  .banner-edit-title{font-size:var(--fs-sm);font-weight:700;letter-spacing:-.01em;
    text-shadow:0 1px 3px rgba(0,0,0,.4);}
  .banner-edit-sub{font-size:var(--fs-xs);opacity:.8;text-shadow:0 1px 3px rgba(0,0,0,.4);}

  /* 이미지가 없을 땐 평소에도 눌러야 할 곳임을 알린다 */
  .banner-hint{position:absolute;left:10px;bottom:10px;z-index:2;
    display:inline-flex;align-items:center;gap:5px;
    background:rgba(0,0,0,.4);color:rgba(255,255,255,.92);
    font-size:var(--fs-xs);font-weight:600;padding:5px 10px;border-radius:var(--r-full);
    transition:opacity .18s ease;}
  .banner-hint svg{width:12px;height:12px;}
  .detail-banner:hover .banner-hint{opacity:0;}

  .level-card{margin-top:14px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh-sm);}
  @property --p{ syntax:'<number>'; inherits:true; initial-value:0; }
  .ring{--p:0;width:62px;height:62px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*3.6deg), var(--border) 0);display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto;transition:--p .5s cubic-bezier(.22,1,.36,1);}
  .ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--panel);}
  .ring span{position:relative;font-size:var(--fs-md);font-weight:800;}
  .level-info b{display:block;font-size:var(--fs-sm);color:var(--text);margin-bottom:3px;}
  .level-info small{color:var(--sub);font-size:var(--fs-xs);}

  .stage-icon{font-size:var(--fs-md);flex:0 0 auto;transition:transform .25s cubic-bezier(.22,1,.36,1);display:inline-block;}

  @keyframes pop-bounce{0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}}
  .stage-check.pop{animation:pop-bounce .35s ease;}

  @keyframes confetti-fall{
    0%{transform:translateY(-10px) rotate(0deg);opacity:1;}
    100%{transform:translateY(100vh) rotate(360deg);opacity:0;}
  }
  .celebrate-toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-16px);background:var(--accent);color:#fff;
    padding:11px 22px;border-radius:var(--r-full);font-size:var(--fs-sm);font-weight:700;box-shadow:var(--sh-lg);
    opacity:0;transition:all .3s ease;z-index:600;white-space:nowrap;pointer-events:none;}
  .celebrate-toast.show{opacity:1;transform:translate(-50%,0);}

  .progress-wrap{margin-top:22px;max-width:640px;}
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .progress-top .pct{font-size:var(--fs-lg);font-weight:700;}
  .progress-track{height:10px;border-radius:var(--r-sm);background:var(--border);overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);border-radius:var(--r-sm);transition:width .2s ease;}

  .stage-list{display:flex;flex-direction:column;gap:12px;width:100%;}
  .stage{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel);overflow:hidden;box-shadow:none;
    transition:border-color .15s ease, background .15s ease;}
  .stage:hover{border-color:var(--sub);}
  .stage.open{
    border-color:var(--accent);
    background:var(--accent-soft);
    box-shadow:none;
  }
  .stage.open .stage-head{padding:16px 18px;}
  .stage.open .stage-title{color:var(--accent);font-size:var(--fs-md);}
  .stage.open .stage-icon{transform:scale(1.2);}
  .stage.flash{animation:stage-flash .6s ease;}
  @keyframes stage-flash{
    0%{box-shadow:0 0 0 0 rgba(122,92,255,.5);}
    60%{box-shadow:0 0 0 10px rgba(122,92,255,0);}
    100%{box-shadow:0 0 0 0 rgba(122,92,255,0);}
  }
  .stage-head{display:flex;align-items:center;gap:12px;padding:17px 18px;cursor:pointer;
    transition:padding .2s ease;overflow:hidden;}
  .stage-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:var(--fs-sm);color:#fff;cursor:pointer;transition:transform .15s cubic-bezier(.34,1.56,.64,1), border-color .12s ease, background .15s ease;}
  .stage-check:hover{transform:scale(1.12);border-color:var(--accent);}
  .stage.done .stage-check{background:var(--ok);border-color:var(--ok);}
  .stage-title{font-size:var(--fs-md);font-weight:700;flex:1;transition:color .2s ease, font-size .2s ease;}
  .stage-subcount{font-size:var(--fs-xs);color:var(--sub);background:var(--bg);border:1px solid var(--border);border-radius:var(--r-full);padding:2px 8px;flex:0 0 auto;white-space:nowrap;}
  .stage.done .stage-subcount{color:var(--ok);border-color:var(--ok);}
  .stage-link-icon{flex:0 0 auto;text-decoration:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;box-shadow:var(--sh-accent-sm);transition:transform .12s ease, box-shadow .12s ease;}
  .stage-link-icon svg{width:14px;height:14px;}
  .stage-link-icon:hover{transform:scale(1.15);box-shadow:var(--sh-accent);}
  .stage.done .stage-title{color:var(--sub);}
  .stage-pct{font-size:var(--fs-md);font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums;transition:color .2s ease;}
  .stage.done .stage-pct{color:var(--ok);font-weight:700;}
  .stage-caret{color:var(--sub);font-size:var(--fs-xs);transition:transform .2s ease;flex:0 0 auto;}
  .stage.open .stage-caret{transform:rotate(90deg);}
  .stage-mini-track{width:64px;height:6px;border-radius:var(--r-sm);background:var(--border);overflow:hidden;flex:0 0 auto;}
  .stage-mini-fill{height:100%;background:linear-gradient(90deg,var(--accent),#9b82ff);display:block;transition:width .45s cubic-bezier(.22,1,.36,1);}
  .stage-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.22,1,.36,1);border-top:0 solid var(--border);}
  .stage.open .stage-body{grid-template-rows:1fr;border-top:1px solid var(--border);}
  .stage-body-inner{overflow:hidden;padding:0 16px;}
  .stage.open .stage-body-inner{padding:12px 16px 16px 50px;}
  .sub-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:var(--fs-sm);}
  .sub-check{width:17px;height:17px;border-radius:var(--r-sm);border:2px solid var(--border);flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);color:#fff;transition:transform .15s cubic-bezier(.34,1.56,.64,1), border-color .12s ease, background .15s ease;}
  .sub-check:hover{transform:scale(1.18);border-color:var(--accent);}
  .sub-item.done .sub-check{background:var(--ok);border-color:var(--ok);}
  .sub-text{flex:1;cursor:text;padding:2px 4px;border-radius:var(--r-sm);}
  .sub-text:hover{background:var(--accent-soft);}
  .sub-item.done .sub-text{color:var(--sub);text-decoration:line-through;}
  /* 하위 작업 링크 연결 — 단계와 마찬가지로 우클릭에만 두면 아무도 못 찾는다 */
  .sub-link-add{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--panel);
    color:var(--sub);cursor:pointer;padding:0;opacity:0;
    transition:opacity .14s ease, color .12s ease, border-color .12s ease, background .12s ease, transform .12s ease;}
  .sub-link-add svg{width:12px;height:12px;}
  .sub-item:hover .sub-link-add{opacity:1;}
  .sub-link-add:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);transform:scale(1.08);}
  .sub-link-add:active{transform:scale(.92);}
  .sub-rm{background:none;border:none;color:var(--sub);cursor:pointer;font-size:var(--fs-sm);opacity:.6;}
  .sub-rm:hover{opacity:1;color:var(--danger);}
  .sub-link-icon{flex:0 0 auto;text-decoration:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;box-shadow:var(--sh-accent-sm);transition:transform .12s ease;}
  .sub-link-icon svg{width:11px;height:11px;}
  .sub-link-icon:hover{transform:scale(1.15);}
  .sub-add-row{display:flex;gap:6px;margin-top:6px;}
  .sub-add-row input{flex:1;font-size:var(--fs-sm);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 8px;background:var(--bg);color:var(--text);}
  .sub-add-row button{font-size:var(--fs-sm);border:none;background:var(--accent);color:#fff;border-radius:var(--r-sm);padding:0 10px;cursor:pointer;}

  /* Trash */
  .trash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .trash-card{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--card-shadow);padding:14px;display:flex;align-items:center;gap:12px;}
  .trash-thumb{width:52px;height:52px;border-radius:var(--r-lg);flex:0 0 auto;background:linear-gradient(135deg,var(--tc1),var(--tc2));display:flex;align-items:center;justify-content:center;overflow:hidden;color:rgba(255,255,255,.85);font-weight:700;font-size:var(--fs-lg);}
  .trash-thumb img{width:100%;height:100%;object-fit:cover;}
  .trash-info{flex:1;min-width:0;}
  .trash-info .t-name{display:block;font-size:var(--fs-sm);font-weight:600;line-height:1.4;margin-bottom:6px;}
  .trash-actions{display:flex;gap:6px;flex:0 0 auto;}
  .trash-actions button{font-size:var(--fs-xs);border:1px solid var(--border);background:var(--bg);color:var(--sub);border-radius:var(--r-md);padding:6px 12px;cursor:pointer;transition:color .12s ease, border-color .12s ease;}
  .trash-actions button:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-1px);}
  .trash-actions button.danger:hover{color:var(--danger);border-color:var(--danger);}

  input.file-hidden{display:none;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:200;animation:overlay-fade .15s ease;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:22px;width:360px;max-width:92vw;box-shadow:var(--sh-lg);animation:modal-pop .15s ease;}
  @keyframes overlay-fade{from{opacity:0;}to{opacity:1;}}
  @keyframes modal-pop{from{opacity:0;transform:scale(.94) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .modal h3{margin:0 0 18px;font-size:var(--fs-lg);font-weight:700;letter-spacing:-.01em;}
  .alert-box{display:flex;gap:10px;background:#fdeceb;border:1px solid #f3c6c2;border-radius:var(--r-lg);padding:12px 14px;margin:14px 0;}
  .alert-box .alert-icon{font-size:var(--fs-lg);flex:0 0 auto;line-height:1.3;}
  .alert-box p{margin:0;font-size:var(--fs-sm);line-height:1.6;color:#8a2f27;}
  .alert-box b{color:var(--danger);}
  :root[data-theme="dark"] .alert-box{background:#3a2220;border-color:#5c332e;}
  :root[data-theme="dark"] .alert-box p{color:#f0b3ac;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .alert-box{background:#3a2220;border-color:#5c332e;}
    :root:not([data-theme="light"]) .alert-box p{color:#f0b3ac;}
  }
  .modal-subject{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border-radius:var(--r-lg);margin-bottom:4px;}
  .modal-subject .ms-name{font-weight:700;font-size:var(--fs-md);}
  .modal-subject .ms-sub{font-size:var(--fs-sm);color:var(--sub);margin-top:2px;}
  .modal-question{font-size:var(--fs-sm);color:var(--sub);margin:14px 0 0;}
  .modal-lead{font-size:var(--fs-sm);color:var(--sub);margin:0 0 14px;line-height:1.7;}
  .modal-lead b{color:var(--text);font-weight:700;}
  .modal-hint{font-size:var(--fs-xs);color:var(--sub);line-height:1.7;margin:12px 0 0;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:var(--fs-sm);color:var(--sub);margin-bottom:5px;}
  .field input[type=text],.field input[type=email],.field select{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg);color:var(--text);font-size:var(--fs-sm);}
  .field input:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .field-row{display:flex;gap:8px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .modal-actions button{border:none;border-radius:var(--r-md);padding:9px 16px;font-size:var(--fs-sm);cursor:pointer;}
  .btn-primary{background:var(--accent);color:#fff;font-weight:600;}
  .btn-primary:disabled{opacity:.35;cursor:not-allowed;}
  .btn-ghost{background:var(--bg);color:var(--sub);}
  .btn-ghost:hover{color:var(--text);}
  .new-ch-row{display:flex;gap:6px;margin-top:6px;}
  .new-ch-row input{flex:1;padding:7px 9px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg);color:var(--text);font-size:var(--fs-sm);}
  .new-ch-row button{border:none;background:var(--accent);color:#fff;border-radius:var(--r-md);padding:0 10px;font-size:var(--fs-sm);cursor:pointer;}

  .thumb-upload{display:flex;gap:10px;align-items:center;}
  .thumb-preview{width:120px;aspect-ratio:16/9;border-radius:var(--r-md);background:var(--bg);border:1px solid var(--border);overflow:hidden;position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:var(--fs-xs);}
  .ch-avatar-preview{width:72px;height:72px;border-radius:50%;background:var(--bg);border:1px solid var(--border);overflow:hidden;position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:var(--fs-xl);font-weight:700;}
  .ch-avatar-preview img{width:100%;height:100%;object-fit:cover;}
  .thumb-preview img{width:100%;height:100%;object-fit:cover;}
  .thumb-upload-btns{display:flex;flex-direction:column;gap:6px;}
  .thumb-upload-btns button{font-size:var(--fs-sm);border:1px solid var(--border);background:var(--panel);color:var(--sub);border-radius:var(--r-md);padding:6px 10px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:6px;}
  .thumb-upload-btns button svg{width:14px;height:14px;flex:none;stroke:currentColor;}
  .thumb-upload-btns button:hover{color:var(--accent);border-color:var(--accent);}

  /* Calendar popover */
  .cal-pop{position:absolute;top:calc(100% + 8px);left:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-lg);padding:14px;width:270px;z-index:100;cursor:default;}

  .icon-pop{position:fixed;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);
    box-shadow:var(--sh-lg);padding:10px;width:236px;z-index:999;cursor:default;}
  .icon-pop-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;}
  .icon-pop-grid button{width:34px;height:34px;border:1px solid transparent;background:none;border-radius:var(--r-md);font-size:var(--fs-lg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s ease, transform .1s ease;}
  .icon-pop-grid button:hover{background:var(--accent-soft);transform:scale(1.12);}
  .icon-pop-grid button.selected{border-color:var(--accent);background:var(--accent-soft);}
  .stIconBtn{width:38px;height:38px;text-align:center;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg);color:var(--text);font-size:var(--fs-lg);cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:border-color .12s ease, transform .1s ease;}
  .stIconBtn:hover{border-color:var(--accent);transform:scale(1.05);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-head button{border:none;background:var(--accent-soft);color:var(--accent);width:24px;height:24px;border-radius:var(--r-sm);cursor:pointer;}
  .cal-head span{font-size:var(--fs-sm);font-weight:600;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;}
  .cal-wd{font-size:var(--fs-xs);color:var(--sub);padding:4px 0;}
  .cal-day{font-size:var(--fs-sm);padding:6px 0;border-radius:var(--r-sm);cursor:pointer;}
  .cal-day:hover{background:var(--accent-soft);}
  .cal-day.mute{color:var(--sub);opacity:.4;}
  .cal-day.today{border:1px solid var(--accent);}
  .cal-day.selected{background:var(--accent);color:#fff;}
  .cal-time{display:flex;align-items:center;gap:6px;margin-top:12px;}
  .cal-time input,.cal-time select{flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);color:var(--text);font-size:var(--fs-sm);}
  .cal-actions{display:flex;justify-content:space-between;margin-top:12px;}
  .cal-actions button{border:none;background:var(--accent);color:#fff;border-radius:var(--r-md);padding:6px 12px;font-size:var(--fs-sm);cursor:pointer;}
  .cal-actions .clear{background:none;color:var(--sub);}

  /* Context menu */
  .ctx-menu{position:fixed;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-lg);padding:6px;z-index:300;min-width:170px;animation:modal-pop .12s ease;}
  .ctx-item{padding:8px 10px;font-size:var(--fs-sm);border-radius:var(--r-sm);cursor:pointer;white-space:nowrap;transition:background .1s ease, transform .1s ease;}
  .ctx-item:hover{transform:translateX(2px);}
  .ctx-item:hover{background:var(--accent-soft);color:var(--accent);}
  .ctx-item.danger:hover{background:#f5e2df;color:var(--danger);}
  .ctx-sep{height:1px;background:var(--border);margin:4px 2px;}
  .ctx-header{padding:7px 10px 5px;font-size:var(--fs-xs);color:var(--sub);white-space:nowrap;cursor:default;}

  /* ===================== 상단 현황 요약 ===================== */
  /* 안에 든 게 숫자 하나뿐이라 화면 폭까지 늘리면 빈 칸만 커진다. 상한을 두고 왼쪽에 모은다. */
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,230px));justify-content:start;
    gap:var(--sp-3);margin-bottom:var(--sp-5);}
  .stat{background:var(--panel);border-radius:var(--r-lg);padding:var(--sp-4) var(--sp-5);
    box-shadow:var(--sh-sm);position:relative;overflow:hidden;}
  .stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stat-c,var(--accent));}
  .stat-label{font-size:var(--fs-xs);font-weight:700;color:var(--sub);letter-spacing:.04em;}
  .stat-value{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.03em;margin-top:var(--sp-1);
    font-variant-numeric:tabular-nums;line-height:1.1;}
  .stat-value small{font-size:var(--fs-sm);font-weight:600;color:var(--sub);margin-left:3px;letter-spacing:0;}
  .stat.urgent .stat-value{color:var(--danger);}

  /* ===================== 대시보드 마감 =====================
     레이아웃은 그대로 두고 (1) 숫자를 키우고 (2) 여백을 넓히고
     (3) 선을 줄이고 그림자로 대신한다. */

  /* 숫자는 자릿수가 흔들리지 않게 */
  .stage-pct,.ring span,.thumb-pct-badge,.count,.ch-count-badge,.stage-subcount{
    font-variant-numeric:tabular-nums;}

  /* (2) 여백은 "채울 게 있을 때" 효과가 있다. 단계 줄처럼 원래 비어 있는 곳에
     여백을 더 주면 고급스러운 게 아니라 허전해진다. 글자를 키운 만큼 간격은 좁힌다. */
  .content-scroll{padding:var(--sp-5) var(--sp-6) var(--sp-6);}
  .topbar{padding:22px var(--sp-6) 16px;}
  .pgrid{gap:var(--sp-4) var(--sp-3);}
  .stage-list{gap:var(--sp-2);}
  /* 짧은 라벨이 넓은 줄에 떠 있으면 빈 느낌이 커진다 */
  .detail-right{max-width:780px;}

  /* 화면 제목을 확실히 크게 — 위계가 분명해야 정돈돼 보인다 */
  .head-left h1{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.025em;gap:10px;}

  /* 야담 제목은 60자를 넘는 일이 흔하다. 제목이 길다고 오른쪽 도구 묶음(시계·크기·테마)이
     아래로 밀려나면 안 된다. 제목 쪽만 줄어들게 하고 오른쪽은 고정한다. */
  /* 제목(30px 한 줄)과 오른쪽 묶음(시계 2줄 + 버튼)은 높이가 달라서,
     윗변만 맞추면 눈에는 오른쪽이 내려간 것처럼 보인다.
     같은 높이의 띠를 주고 그 안에서 각자 가운데 정렬하면 중심이 맞는다. */
  .topbar{flex-wrap:nowrap;}
  .head-left h1{min-height:46px;}
  .topbar-right{min-height:46px;}
  .head-left{flex:1;min-width:0;}
  .topbar-right{flex:0 0 auto;}
  #headTitleWrap{min-width:0;}

  /* 상세 화면 제목 — 목록 제목보다 한 단계 작게 하고 2줄에서 자른다.
     편집 중에는 자르지 않는다. 입력하는 글자가 가려지면 안 되니까. */
  #titleText{font-size:var(--fs-lg);line-height:1.35;}
  #titleText[contenteditable="false"]{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .head-left h1 .dot{width:10px;height:10px;}
  .title-input{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.025em;}

  /* (3) 카드는 테두리 대신 그림자로 */
  .pcard{border-color:transparent;border-radius:var(--r-lg);box-shadow:var(--sh-sm);
    transition:transform .16s cubic-bezier(.22,1,.36,1), box-shadow .16s ease;}
  .pcard:hover{border-color:transparent;transform:translateY(-3px);box-shadow:var(--sh-lg);}
  .pcard-body{padding:12px 14px 14px;}
  .stat-row{gap:var(--sp-2);margin-bottom:var(--sp-4);}
  .stat{padding:var(--sp-3) var(--sp-4);}
  .level-card{padding:var(--sp-3) var(--sp-4);}

  /* ===================== 왼쪽 보조 카드 ===================== */
  .side-card{margin-top:var(--sp-3);background:var(--panel);border-radius:var(--r-lg);
    padding:var(--sp-3) var(--sp-4) var(--sp-4);box-shadow:var(--sh-sm);}
  .side-card-head{display:flex;align-items:center;gap:7px;font-size:var(--fs-xs);
    font-weight:800;color:var(--sub);letter-spacing:.03em;margin-bottom:10px;}
  .side-card-head .btn-icon{width:14px;height:14px;}

  .next-card{border-left:3px solid var(--accent);}
  .next-stage{display:flex;align-items:center;gap:7px;font-size:var(--fs-md);font-weight:800;
    letter-spacing:-.01em;color:var(--accent);}
  .next-icon{font-size:var(--fs-md);}
  .next-sub{font-size:var(--fs-sm);line-height:1.6;margin-top:5px;word-break:keep-all;}
  .next-sub.muted{color:var(--sub);font-size:var(--fs-xs);}
  .done-card{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);font-weight:700;
    color:var(--ok);border-left:3px solid var(--ok);}
  .done-card .btn-icon{width:16px;height:16px;}

  .link-list{display:flex;flex-direction:column;gap:var(--sp-1);}
  .link-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    background:var(--bg);border:1px solid transparent;border-radius:var(--r-md);
    padding:8px 10px;cursor:pointer;text-decoration:none;color:var(--text);
    font-family:inherit;font-size:var(--fs-sm);
    transition:background .12s ease, border-color .12s ease, transform .12s ease;}
  .link-item svg{width:14px;height:14px;flex:0 0 auto;color:var(--accent);}
  .link-item:hover{background:var(--accent-soft);border-color:var(--accent);transform:translateX(2px);}
  .link-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
  /* 하위 작업 링크는 소속 단계 아래로 들여쓴다. 왼쪽 선이 어디에 딸린 것인지 잇는다. */
  .link-item.sub{margin-left:12px;border-left:2px solid var(--border);
    border-radius:0 var(--r-md) var(--r-md) 0;}
  .link-item.sub:hover{border-left-color:var(--accent);}
  .link-emoji{flex:0 0 auto;font-size:var(--fs-sm);line-height:1;}
  /* 링크가 없는 단계 — 상자를 씌우지 않는다. 눌리지 않는다는 걸 모양으로 알려야 한다.
     아래 여백은 두지 않는다. 딸린 하위 작업과 붙어 있어야 한 덩어리로 읽힌다. */
  .link-group{display:flex;align-items:center;gap:6px;padding:8px 10px 3px;
    font-size:var(--fs-sm);font-weight:600;color:var(--sub);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .link-act{flex:0 0 auto;font-size:var(--fs-xs);font-weight:700;color:var(--sub);opacity:0;
    transition:opacity .12s ease;}
  .link-item:hover .link-act{opacity:1;color:var(--accent);}

  /* ---------- 포스트잇 메모 ---------- */
  /* 진행 단계 아래 — 폭이 넓으니 메모판처럼 펼쳐진다 */
  .note-card{margin-top:var(--sp-4);}
  .note-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;}
  .note{position:relative;background:var(--n-bg);color:var(--n-ink);
    border-radius:2px 2px var(--r-sm) var(--r-sm);
    padding:10px 9px 12px;min-height:92px;cursor:pointer;
    transform:rotate(var(--tilt,0deg));
    box-shadow:0 2px 5px rgba(0,0,0,.14), 0 8px 16px -8px rgba(0,0,0,.18);
    transition:transform .16s cubic-bezier(.22,1,.36,1), box-shadow .16s ease;}
  /* 끌어서 순서 바꾸기 — 들어갈 자리에 세로 막대를 세운다 */
  .note[draggable="true"]{cursor:grab;}
  .note.dragging{opacity:.4;cursor:grabbing;}
  .note.drop-before::after,.note.drop-after::after{
    content:"";position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:var(--r-sm);
    background:var(--accent);box-shadow:var(--sh-accent-sm);}
  .note.drop-before::after{left:-7px;}
  .note.drop-after::after{right:-7px;}
  /* 한 줄로 쌓였을 때는 막대를 눕힌다. 세로로 쌓인 목록에 세로 막대를 세우면
     "이 앞"인지 "이 위"인지 읽히지 않는다. */
  .note-board.col .note.drop-before::after,
  .note-board.col .note.drop-after::after{
    left:-3px;right:-3px;top:auto;bottom:auto;width:auto;height:3px;}
  .note-board.col .note.drop-before::after{top:-7px;}
  .note-board.col .note.drop-after::after{bottom:-7px;}

  /* 휴지통에 들어간 메모 — 색은 그대로 두되 기울이지 않는다. 정리된 목록처럼 보여야 한다 */
  /* 편집 중인 메모 — 기울기를 펴고 위로 띄운다. 삐뚤어진 종이에 글을 쓰긴 어렵다. */
  .note.editing{transform:none;cursor:default;z-index:3;
    box-shadow:0 6px 18px rgba(0,0,0,.22);}
  .note-edit-area{width:100%;border:none;background:transparent;color:inherit;
    font-family:inherit;font-size:var(--fs-sm);line-height:1.5;font-weight:500;
    resize:none;outline:none;padding:0;overflow:hidden;min-height:56px;display:block;}
  /* 색 고르기 — 작으면 조준해서 눌러야 한다. 손가락으로도 눌리는 크기로 둔다.
     고른 것은 테두리를 두르지 않는다. 두르면 그 테두리가 또 하나의 색처럼 보인다.
     대신 가운데에 점을 찍는다. */
  .note-edit-colors{display:flex;gap:8px;margin-top:11px;}
  .note-edit-colors button{width:26px;height:26px;border-radius:50%;padding:0;
    border:1.5px solid;cursor:pointer;position:relative;
    transition:transform .12s ease;}
  .note-edit-colors button:hover{transform:scale(1.12);}
  .note-edit-colors button:active{transform:scale(.94);}
  .note-edit-colors button.on::after{content:"";position:absolute;inset:0;margin:auto;
    width:9px;height:9px;border-radius:50%;background:rgba(0,0,0,.45);}
  .note.trashed{cursor:default;}
  .note.trashed:hover{transform:translateY(-2px);}
  .note-from{position:relative;margin-top:8px;font-size:var(--fs-xs);opacity:.65;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .note-tr-actions{position:relative;display:flex;gap:6px;margin-top:8px;}
  .note-tr-actions button{flex:1;border:none;border-radius:var(--r-sm);padding:5px 6px;
    font-size:var(--fs-xs);font-weight:700;font-family:inherit;cursor:pointer;
    background:rgba(255,255,255,.55);color:var(--n-ink);transition:background .12s ease;}
  .note-tr-actions button:hover{background:#fff;}
  .note-tr-actions button.danger{color:var(--danger);}
  .note-tr-actions button:disabled{opacity:.45;cursor:not-allowed;}

  /* 휴지통 구역 제목 */
  .trash-sec{margin-bottom:var(--sp-6);}
  .trash-sec-head{display:flex;align-items:center;gap:8px;margin:0 0 var(--sp-3);
    font-size:var(--fs-sm);font-weight:700;color:var(--sub);letter-spacing:.02em;}
  .trash-sec-head .cnt{background:var(--panel);border:1px solid var(--border);
    border-radius:var(--r-full);padding:1px 9px;font-size:var(--fs-xs);color:var(--text);}

  /* 되돌리기 토스트 — 실수의 대부분은 누른 직후 알아차린다 */
  .celebrate-toast.with-action{display:flex;align-items:center;gap:12px;
    pointer-events:auto;padding-right:8px;}
  .celebrate-toast .toast-undo{border:none;background:rgba(255,255,255,.24);color:#fff;
    font-family:inherit;font-size:var(--fs-sm);font-weight:700;border-radius:var(--r-full);
    padding:5px 13px;cursor:pointer;transition:background .12s ease;}
  .celebrate-toast .toast-undo:hover{background:rgba(255,255,255,.4);}

  /* 위쪽 접착 띠 */
  .note::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;
    background:linear-gradient(var(--n-line), transparent);border-radius:2px 2px 0 0;opacity:.85;}
  .note:hover{transform:rotate(0deg) translateY(-3px) scale(1.03);
    box-shadow:0 4px 10px rgba(0,0,0,.18), 0 14px 26px -10px rgba(0,0,0,.28);z-index:2;}
  .note-text{position:relative;font-size:var(--fs-sm);line-height:1.55;font-weight:600;
    white-space:pre-wrap;word-break:break-word;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;}
  .note-del{position:absolute;top:3px;right:3px;width:19px;height:19px;border:none;
    background:rgba(255,255,255,.6);color:var(--n-ink);border-radius:50%;cursor:pointer;
    font-size:11px;line-height:1;opacity:0;transition:opacity .12s ease, background .12s ease;}
  .note:hover .note-del{opacity:1;}
  .note-del:hover{background:#fff;}

  /* 붙이는 순간 — 위에서 내려와 탁 붙는다 */
  @keyframes note-stick{
    0%{opacity:0;transform:translateY(-22px) scale(1.3) rotate(-8deg);}
    55%{opacity:1;transform:translateY(3px) scale(.95) rotate(2deg);}
    78%{transform:translateY(-1px) scale(1.02) rotate(calc(var(--tilt,0deg) - 1deg));}
    100%{opacity:1;transform:translateY(0) scale(1) rotate(var(--tilt,0deg));}
  }
  .note.stick{animation:note-stick .5s cubic-bezier(.22,1,.36,1);}
  @keyframes note-peel{
    to{opacity:0;transform:translateY(-10px) scale(.86) rotate(-10deg);}
  }
  .note.peel{animation:note-peel .22s ease-in forwards;pointer-events:none;}

  .note-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    min-height:92px;border:2px dashed var(--border);border-radius:var(--r-sm);
    background:transparent;color:var(--sub);cursor:pointer;font-family:inherit;
    transition:border-color .12s ease, color .12s ease, background .12s ease;}
  .note-add span{font-size:var(--fs-lg);font-weight:300;line-height:1;}
  .note-add em{font-style:normal;font-size:var(--fs-xs);font-weight:700;}
  .note-add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}

  /* 편집 모달도 포스트잇 모양으로 */
  .note-edit{background:var(--n-bg);border-radius:2px 2px var(--r-sm) var(--r-sm);
    padding:14px;box-shadow:0 3px 8px rgba(0,0,0,.14);position:relative;}
  .note-edit::before{content:"";position:absolute;left:0;right:0;top:0;height:18px;
    background:linear-gradient(var(--n-line), transparent);border-radius:2px 2px 0 0;opacity:.85;}
  .note-edit textarea{position:relative;width:100%;border:none;background:transparent;
    color:var(--n-ink);font-family:inherit;font-size:var(--fs-md);font-weight:600;
    line-height:1.7;resize:vertical;min-height:110px;outline:none;}
  .note-edit textarea::placeholder{color:var(--n-ink);opacity:.42;}
  .note-colors{display:flex;gap:8px;margin-top:12px;}
  .note-colors .swatch{width:26px;height:26px;border-radius:50%;border:2px solid;cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;}
  .note-colors .swatch:hover{transform:scale(1.12);}
  .note-colors .swatch.on{box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--text);}
  .pcard-title{font-size:var(--fs-md);font-weight:700;letter-spacing:-.01em;}
  .pcard-meta{font-size:var(--fs-xs);margin-top:var(--sp-2);}

  /* (1) 진행률을 주인공으로 */
  .thumb-pct-badge{font-size:var(--fs-md);font-weight:800;padding:4px 10px;
    border-radius:var(--r-sm);background:rgba(0,0,0,.78);letter-spacing:-.02em;}
  .pcard-thumb .thumb-prog-track{height:5px;}

  .level-card{padding:var(--sp-4) var(--sp-5);gap:var(--sp-4);border-color:transparent;
    box-shadow:var(--sh-sm);}
  .ring{width:76px;height:76px;}
  .ring::before{inset:8px;}
  .ring span{font-size:var(--fs-lg);font-weight:800;letter-spacing:-.03em;}
  .level-info b{font-size:var(--fs-md);}

  /* 단계 줄도 선 대신 면 */
  .stage{border-color:transparent;border-radius:var(--r-lg);box-shadow:var(--sh-sm);}
  .stage:hover{border-color:transparent;box-shadow:var(--sh-md);}
  .stage.open{box-shadow:var(--sh-md);}
  .stage-title{font-size:var(--fs-md);letter-spacing:-.01em;}
  .stage.open .stage-title{font-size:var(--fs-md);}
  /* 제목/링크는 글자만큼만 차지하고, 남는 공간은 펼치기용으로 넘긴다.
     링크가 줄 전체를 덮으면 하위 작업을 보려다 링크가 열린다. */
  /* 글자를 키우면 이 줄에 들어갈 것이 넘친다. 그때 제목이 한 글자씩 세로로
     쪼개지지 않게 한 줄로 묶고, 넘치면 말줄임으로 자른다. */
  .stage-title{flex:0 1 auto;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* 남는 폭은 진행 막대가 가져간다. 여기는 최소 간격만 확보. */
  .stage-fill{flex:0 1 auto;min-width:10px;align-self:stretch;}
  .stage-pct{font-size:var(--fs-md);font-weight:700;letter-spacing:-.02em;}
  /* 비어 있던 가운데를 진행 막대가 채운다 — 허전함도 줄고 정보도 늘어난다 */
  /* 최대 폭을 걸면 남는 공간이 갈 곳을 잃고 오른쪽에 버려진다. 끝까지 늘어나게 둔다. */
  /* 자리가 모자라면 막대가 먼저 양보한다. 제목·개수·퍼센트보다 덜 중요하다. */
  .stage-mini-track{flex:1 1 auto;width:auto;min-width:24px;height:8px;
    border-radius:var(--r-full);margin-left:var(--sp-2);}
  /* 칸 나눔 — 하위 작업 개수만큼 */
  .stage-mini-track.seg{display:flex;gap:3px;background:none;overflow:visible;}
  .mini-seg{flex:1;min-width:4px;border-radius:var(--r-full);background:var(--border);
    transition:background .3s cubic-bezier(.22,1,.36,1);}
  .mini-seg.on{background:var(--accent);}
  .stage.done .mini-seg.on{background:var(--ok);}
  .stage-head{padding:13px 16px;gap:10px;}
  .stage.open .stage-head{padding:13px 16px;}
  .stage-body-inner{padding:0 16px;}
  .stage.open .stage-body-inner{padding:10px 16px 14px 46px;}
  .sub-item{padding:5px 0;font-size:var(--fs-sm);}
  .stage-mini-fill{background:var(--accent);}

  /* 사이드바 — 색을 아끼고 개수만 또렷하게 */
  .side{border-right-color:transparent;box-shadow:1px 0 0 var(--border);}
  .proj{border-color:transparent;box-shadow:var(--sh-sm);border-radius:var(--r-md);
    transition:transform .16s cubic-bezier(.22,1,.36,1), box-shadow .16s ease, background .12s ease;}
  /* 끌고 있는 중에는 들어올린 상태를 유지해야 하니 hover 효과에서 뺀다 */
  .proj:not(.dragging):hover{border-color:transparent;box-shadow:var(--sh-md);
    transform:translateY(-2px) scale(1.015);}
  .proj:not(.dragging):active{transform:translateY(0) scale(.99);}
  .nav-item .count,.ch-count-badge{font-size:var(--fs-sm);font-weight:800;letter-spacing:-.02em;}
  .section-label{font-size:var(--fs-xs);letter-spacing:.06em;text-transform:uppercase;
    color:var(--sub);opacity:.75;padding-top:var(--sp-4);}

  /* 입력 요소 높이를 하나로 */
  .search{padding:11px var(--sp-4);border-radius:var(--r-md);font-size:var(--fs-sm);}
  .add-btn,.toggle-completed{height:40px;border-radius:var(--r-md);}
  .sort-toggle,.view-toggle{border-radius:var(--r-md);}
  .sort-toggle button{height:40px;}
  .view-toggle button{height:40px;width:40px;}

  .modal{border-radius:var(--r-lg);padding:var(--sp-5);box-shadow:var(--sh-lg);}
  .modal h3{font-size:var(--fs-lg);font-weight:800;letter-spacing:-.02em;}

  /* ===================== 카드 확대 + 단계 눈금 ===================== */
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));}
  .pcard-thumb .thumb-prog-track{display:none;}          /* 얇은 막대 → 눈금으로 대체 */
  .thumb-pct-badge{right:10px;bottom:10px;font-size:var(--fs-lg);font-weight:800;
    padding:5px 12px;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);}

  /* 단계 눈금 — 5칸 중 몇 칸 찼는지가 한눈에 보인다 */
  .stage-pips{display:flex;gap:3px;margin-top:10px;}
  .stage-pips span{flex:1;height:5px;border-radius:var(--r-full);background:var(--border);
    position:relative;overflow:hidden;}
  .stage-pips span i{position:absolute;inset:0;transform-origin:left;background:var(--accent);
    display:block;transition:transform .45s cubic-bezier(.22,1,.36,1);}
  .stage-pips span.full i{background:var(--ok);}
  .pcard.completed .stage-pips span i{background:var(--ok);}
  .pips-legend{display:flex;justify-content:space-between;margin-top:6px;
    font-size:var(--fs-xs);color:var(--sub);font-weight:600;}
  .pips-legend .now{color:var(--accent);font-weight:800;}

  /* 마감 임박은 카드 자체가 신호를 준다 */
  .pcard.soon-red{box-shadow:0 0 0 1.5px var(--danger), var(--sh-sm);}
  .pcard.soon-red:hover{box-shadow:0 0 0 1.5px var(--danger), var(--sh-lg);}
  /* 마무리만 남은 건 — 손이 필요하다는 신호 */
  .wrapup-note{display:flex;align-items:center;gap:6px;margin-top:10px;
    background:#fdf3d6;color:#8a6d1f;border-radius:var(--r-sm);padding:6px 10px;
    font-size:var(--fs-xs);font-weight:600;line-height:1.4;}
  .wrapup-note svg{width:13px;height:13px;flex:0 0 auto;}
  .wrapup-note b{font-weight:800;}
  :root[data-theme="dark"] .wrapup-note{background:#3a3218;color:#e8cf86;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .wrapup-note{background:#3a3218;color:#e8cf86;}
  }
  .stat.wrapup .stat-value{color:#c9a227;}

  /* 칸이 전부 같은 성격이라 예외 스타일이 필요 없다 */
  .stat{cursor:pointer;padding-right:40px;
    transition:transform .14s cubic-bezier(.22,1,.36,1), box-shadow .14s ease;}
  .stat:hover{transform:translateY(-2px);box-shadow:var(--sh-md);}
  .stat:active{transform:translateY(0) scale(.99);}
  .stat.on{box-shadow:0 0 0 1.5px var(--stat-c,var(--accent)), var(--sh-sm);}

  .stat-mark{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:var(--r-sm);
    display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--sub);transition:background .14s ease, color .14s ease;}
  .stat-mark svg{width:13px;height:13px;}
  .stat:hover .stat-mark,.stat.on .stat-mark{background:var(--stat-c,var(--accent));color:#fff;}

  .stat-sub{display:block;margin-top:6px;font-size:var(--fs-sm);color:var(--sub);font-weight:600;
    transition:color .14s ease;}
  .stat.on .stat-sub{color:var(--stat-c,var(--accent));font-weight:700;}

  /* 상세 화면 앞뒤 이동 */
  .detail-nav{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:10px;flex-wrap:wrap;}
  .detail-nav .back-btn{margin-bottom:0;}
  .detail-stepper{display:inline-flex;align-items:center;gap:var(--sp-1);
    border:1px solid var(--border);border-radius:var(--r-md);padding:3px;background:var(--panel);}
  .step-btn{width:28px;height:28px;border:none;background:none;border-radius:var(--r-sm);
    color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .12s ease, color .12s ease;}
  .step-btn svg{width:15px;height:15px;}
  .step-btn:hover:not(:disabled){background:var(--accent-soft);color:var(--accent);}
  .step-btn:disabled{opacity:.3;cursor:default;}
  .step-count{font-size:var(--fs-xs);color:var(--sub);font-weight:700;
    font-variant-numeric:tabular-nums;padding:0 var(--sp-1);}

  /* 썸네일 끌어다 놓기 */
  .detail-banner.drop-on{outline:2.5px dashed var(--accent);outline-offset:-4px;}
  .detail-banner.drop-on .banner-edit{opacity:1;}

  /* 하위 작업 입력칸을 실제로 쓸 만한 크기로 */
  .sub-add-row{gap:var(--sp-2);margin-top:10px;}
  .sub-add-row input{font-size:var(--fs-sm);padding:9px 12px;border-radius:var(--r-md);}
  .sub-add-row input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent;}
  .sub-add-row button{font-size:var(--fs-sm);font-weight:700;padding:0 14px;border-radius:var(--r-md);}
  .pcard-channel{margin-top:10px;}
  .pcard-channel span:not(.channel-avatar){color:var(--sub);font-weight:600;}

  /* ===================== 인터랙션 다듬기 ===================== */
  /* 움직임을 줄이도록 설정한 사용자는 전부 즉시 표시 */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important; scroll-behavior:auto !important;
    }
  }

  /* 목록 ↔ 상세 화면 전환 */
  @keyframes view-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @keyframes view-in-back{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:none;}}
  .view-fwd{animation:view-in .28s cubic-bezier(.22,1,.36,1);}
  .view-back{animation:view-in-back .28s cubic-bezier(.22,1,.36,1);}

  /* 체크 보상감 */
  @keyframes sub-pop{0%{transform:scale(1);}45%{transform:scale(1.32);}100%{transform:scale(1);}}
  .sub-check.pop{animation:sub-pop .34s cubic-bezier(.34,1.56,.64,1);}
  @keyframes ring-bump{0%{transform:scale(1);}40%{transform:scale(1.075);}100%{transform:scale(1);}}
  .ring.bump{animation:ring-bump .52s cubic-bezier(.34,1.56,.64,1);}

  /* 드래그 — 기존 규칙보다 뒤에 와서 덮어쓴다 */
  .pcard.dragging,.proj.dragging{
    opacity:.5;transform:scale(.97);box-shadow:var(--sh-lg);cursor:grabbing;
  }
  .pcard.drag-over,.proj.drag-over{
    outline:2px solid var(--accent);outline-offset:2px;background:var(--accent-soft);
  }
  .pcard.drag-over{box-shadow:0 0 0 4px var(--accent-soft);}

  /* 빈 화면 */
  .empty-rich{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:62px 20px;text-align:center;animation:view-in .3s cubic-bezier(.22,1,.36,1);}
  .empty-rich .ei{width:72px;height:72px;color:var(--border);margin-bottom:16px;}
  .empty-rich h3{margin:0 0 7px;font-size:var(--fs-md);font-weight:700;}
  .empty-rich p{margin:0 0 18px;font-size:var(--fs-sm);color:var(--sub);line-height:1.75;max-width:330px;}

  /* 단계 줄의 링크 연결 버튼 — 우클릭 메뉴에만 있으면 아무도 못 찾는다 */
  .stage-link-add{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;
    border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent);
    border-radius:var(--r-full);padding:5px 12px 5px 9px;font-size:var(--fs-sm);font-weight:700;cursor:pointer;
    opacity:0;transition:opacity .14s ease, background .12s ease, color .12s ease, transform .12s ease;}
  .stage-link-add svg{width:13px;height:13px;flex:0 0 auto;}
  .stage:hover .stage-link-add{opacity:1;}
  .stage-link-add:hover{background:var(--accent);color:#fff;transform:translateY(-1px);
    box-shadow:var(--sh-accent);}
  .stage-link-add:active{transform:translateY(0) scale(.96);}

  /* 링크가 걸린 단계 — 평소엔 제목 옆 작은 🔗 로 조용히, 마우스를 올리면 확실하게 */
  .stage-title-link{display:inline-flex;align-items:center;gap:7px;text-decoration:none;
    color:inherit;cursor:pointer;transition:color .12s ease;}
  .stage-title-link .lk{width:14px;height:14px;flex:0 0 auto;color:var(--accent);
    opacity:.65;transition:opacity .12s ease, transform .12s ease;}
  .stage-title-link .lk-hint{display:inline-flex;align-items:center;gap:3px;flex:0 0 auto;
    max-width:0;opacity:0;overflow:hidden;white-space:nowrap;
    font-size:var(--fs-xs);font-weight:700;color:var(--accent);
    transition:max-width .2s ease, opacity .16s ease;}
  .stage-title-link .lk-hint svg{width:10px;height:10px;flex:0 0 auto;}
  .stage:hover .stage-title-link{color:var(--accent);}
  .stage:hover .stage-title-link .lk{opacity:1;transform:scale(1.12);}
  .stage:hover .stage-title-link .lk-hint{max-width:90px;opacity:1;}
  .stage-title-link:hover > span:first-child{text-decoration:underline;text-underline-offset:3px;}


  /* ===================== 터치 기기 =====================
     호버가 없으니 "마우스를 올리면 나오는" 버튼은 영영 안 보인다. 항상 띄운다. */
  @media (hover: none){
    .pcard-actions,.proj-actions,.stage-link-add,.sub-link-add,.note-del{opacity:1;}
    .link-act{opacity:1;}
    .stat-mark{background:var(--stat-c,var(--accent));color:#fff;}
    .stage-title-link .lk-hint{max-width:90px;opacity:1;}
    .pcard:hover{transform:none;}            /* 터치에선 뜨는 효과가 어색하다 */
    .note:hover{transform:rotate(var(--tilt,0deg));}
  }

  /* ===================== 좁은 화면 =====================
     폰은 "확인 + 가벼운 기록"용. 관리·편집 기능은 숨긴다. */
  .mobile-only{display:none;}
  .side-backdrop{display:none;}
  .fab{display:none;}          /* 미디어쿼리보다 먼저 와야 안에서 켤 수 있다 */
  @media (max-width: 760px){
    .mobile-only{display:inline-flex;}

    /* 사이드바는 서랍으로 */
    .side{position:fixed;left:0;top:0;bottom:0;z-index:210;width:280px;flex-basis:280px;
      transform:translateX(-100%);transition:transform .26s cubic-bezier(.22,1,.36,1);
      box-shadow:var(--sh-lg);}
    .side.open{transform:translateX(0);}
    .side.collapsed{width:280px;flex-basis:280px;}
    .side.collapsed .brand,.side.collapsed .nav,.side.collapsed .sidebar-tools{opacity:1;pointer-events:auto;}
    .side-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:205;
      opacity:0;pointer-events:none;transition:opacity .26s ease;}
    .side-backdrop.on{opacity:1;pointer-events:auto;}
    .collapse-btn{display:none;}

    .main{width:100%;}
    .topbar{padding:14px 16px 10px;gap:10px;flex-wrap:wrap;}   /* 폰에서는 좁아서 접히는 게 낫다 */
    .content-scroll{padding:14px 16px 80px;}
    .head-left h1{font-size:var(--fs-lg);}

    /* 현황은 옆으로 넘겨본다 — 세로로 쌓으면 화면을 다 먹는다 */
    .stat-row{display:flex;overflow-x:auto;gap:10px;padding-bottom:4px;
      scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
    .stat{flex:0 0 62%;scroll-snap-align:start;}

    /* 카드 1열, 상세도 한 줄로 */
    .pgrid,.pgrid.list{grid-template-columns:1fr;}
    .pgrid.list .pcard{display:block;}
    .pgrid.list .pcard-thumb{width:100%;}
    .pgrid.list .stamp-overlay-card{left:50%;top:55%;width:74%;}   /* 폰에서는 썸네일이 전체 폭이라 원래대로 */
    .detail-grid{grid-template-columns:1fr;gap:var(--sp-4);}
    .detail-left,.detail-right,.detail-notes{grid-column:auto;grid-row:auto;}
    .detail-right{max-width:none;}
    .note-board{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));}

    /* 폰에서 안 쓰는 것 */
    .view-toggle,.zoom-ctrl,.topbar-divider{display:none;}
    .hide-mobile{display:none;}   /* 남은 시간·안내 문구 — 좁은 줄에서는 군더더기 */
    .toolbar{gap:8px;}
    .search{min-width:0;flex:1 1 100%;order:-1;}

    /* 모달은 화면에 맞게 */
    .modal,.modal.wide{width:100%;max-width:none;border-radius:var(--r-lg) var(--r-lg) 0 0;}
    .overlay{align-items:flex-end;}

    /* 새 이야기는 항상 손 닿는 곳에 */
    .fab{display:flex;position:fixed;right:16px;bottom:16px;z-index:120;
      width:56px;height:56px;border-radius:var(--r-full);border:none;
      background:var(--accent);color:#fff;font-size:26px;line-height:1;
      align-items:center;justify-content:center;box-shadow:var(--sh-lg);cursor:pointer;}
    #dashNewBtn{display:none;}
  }
  .menu-btn{width:38px;height:38px;border-radius:var(--r-md);border:1px solid var(--border);
    background:var(--panel);color:var(--text);cursor:pointer;
    align-items:center;justify-content:center;flex:0 0 auto;}
  .menu-btn svg{width:19px;height:19px;}

  /* 단축키 표기 */
  .kbd{display:inline-block;min-width:18px;border:1px solid var(--border);border-bottom-width:2px;background:var(--bg);
    border-radius:var(--r-sm);padding:1px 6px;font-size:var(--fs-xs);font-weight:700;color:var(--text);text-align:center;
    font-family:inherit;line-height:1.5;}

  /* 튜토리얼에서 채널을 만든 직후, 사이드바에 생긴 그 줄을 짚어준다 */
  @keyframes ch-spot{
    0%{box-shadow:0 0 0 0 rgba(122,92,255,.5);}
    100%{box-shadow:0 0 0 12px rgba(122,92,255,0);}
  }
  .sidebar-ch-filter button.ch-spot{background:var(--accent-soft);animation:ch-spot .9s ease-out 2;}

  /* 개발 환경 표시 띠 — 배포본과 화면이 똑같아서 헷갈리면 실데이터를 건드리게 된다.
     일부러 앱 팔레트 밖의 색(노랑/검정 경고 줄무늬)을 쓴다. 앱의 일부로 보이면 안 되고,
     디자인 토큰을 바꾸면 개발 중에 본 화면이 실제와 달라져 색 판단을 할 수 없다. */
  .env-ribbon{position:fixed;top:0;left:0;right:0;height:6px;z-index:9999;pointer-events:none;
    background:repeating-linear-gradient(45deg,#f2b705 0 12px,#2b2b2b 12px 24px);}

  /* 개발 DB를 보고 있을 때만 뜬다. 실데이터와 헷갈리면 사고가 난다.
     점선 테두리로 "임시로 다른 곳을 보고 있다"를 드러낸다. */
  .db-badge{display:none;align-items:center;justify-content:center;gap:6px;
    margin:0 8px 8px;padding:5px 10px;border-radius:var(--r-md);
    background:var(--accent-soft);border:1px dashed var(--accent);color:var(--accent);
    font-size:var(--fs-xs);font-weight:700;letter-spacing:.02em;}

  /* ===================== 로그인 게이트 =====================
     통과 전까지 앱 전체를 덮는다. 뒤에서 앱은 평소대로 그려지고 있다. */
  .auth-gate{position:fixed;inset:0;z-index:1000;background:var(--bg);
    display:flex;align-items:center;justify-content:center;padding:var(--sp-4);}
  .auth-box{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--r-lg);box-shadow:var(--sh-lg);padding:var(--sp-7) var(--sp-5) var(--sp-6);
    text-align:center;}
  .auth-icon{width:72px;height:72px;display:block;margin:0 auto var(--sp-3);}
  .auth-logo{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.03em;margin-bottom:var(--sp-1);}
  .auth-sub{font-size:var(--fs-sm);color:var(--sub);line-height:1.7;margin-bottom:var(--sp-5);
    word-break:keep-all;}
  .auth-btn{width:100%;padding:12px 16px;border:1px solid var(--border);background:var(--panel);
    color:var(--text);border-radius:var(--r-md);font-size:var(--fs-md);font-weight:600;
    font-family:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:10px;
    box-shadow:var(--sh-sm);
    transition:border-color .12s ease, background .12s ease, transform .12s ease, box-shadow .12s ease;}
  .auth-btn:hover{box-shadow:var(--sh-md);}
  .g-logo{width:18px;height:18px;flex:0 0 auto;}
  .auth-btn:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .auth-btn:active{transform:scale(.98);}
  /* 체험 입구 — 로그인이 주 동작이므로 경쟁하지 않게 선 아래로 내린다 */
  .invite-gate p{font-size:var(--fs-sm);color:var(--sub);line-height:1.7;margin:0 0 var(--sp-4);}
  .invite-gate p b{color:var(--text);font-weight:700;}
  .invite-ask{font-size:var(--fs-xs) !important;margin:var(--sp-3) 0 0 !important;}
  .auth-alt{margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;gap:3px;}
  .auth-alt a{font-size:var(--fs-sm);font-weight:700;color:var(--accent);text-decoration:none;
    padding:6px 12px;border-radius:var(--r-md);transition:background .12s ease;}
  .auth-alt a:hover{background:var(--accent-soft);text-decoration:underline;text-underline-offset:3px;}
  .auth-alt span{font-size:var(--fs-xs);color:var(--sub);}

  /* 첫 실행 안내 — 나머지를 어둡게 하고 한 곳만 밝힌다.
     단계가 하나뿐이라 진행 표시도, 건너뛰기도 필요 없다. */
  .spot-layer{position:fixed;inset:0;z-index:700;animation:overlay-fade .3s ease;}
  .spot-hole{position:fixed;border-radius:var(--r-md);pointer-events:none;
    box-shadow:0 0 0 9999px rgba(0,0,0,.62), 0 0 0 0 rgba(255,255,255,.55);
    animation:spot-pulse 1.9s ease-out infinite;}
  @keyframes spot-pulse{
    0%{box-shadow:0 0 0 9999px rgba(0,0,0,.62), 0 0 0 0 rgba(255,255,255,.5);}
    70%{box-shadow:0 0 0 9999px rgba(0,0,0,.62), 0 0 0 13px rgba(255,255,255,0);}
    100%{box-shadow:0 0 0 9999px rgba(0,0,0,.62), 0 0 0 0 rgba(255,255,255,0);}
  }
  .spot-callout{position:fixed;width:300px;max-width:calc(100vw - 32px);background:var(--panel);
