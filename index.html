    border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-lg);
    animation:modal-pop .28s cubic-bezier(.22,1,.36,1);}
  .spot-callout h4{margin:0 0 8px;font-size:var(--fs-md);font-weight:700;}
  .spot-callout p{margin:0 0 16px;font-size:var(--fs-sm);line-height:1.75;color:var(--sub);}
  .spot-callout p b{color:var(--text);font-weight:600;}
  .spot-actions{display:flex;gap:8px;justify-content:flex-end;}
  .spot-actions button{border:none;border-radius:var(--r-md);padding:9px 14px;font-size:var(--fs-sm);cursor:pointer;}
  .spot-arrow{position:fixed;width:0;height:0;border:9px solid transparent;
    border-right-color:var(--panel);filter:drop-shadow(-2px 0 1px rgba(0,0,0,.08));}
  .auth-field{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:var(--r-md);
    background:var(--bg);color:var(--text);font-size:var(--fs-md);font-family:inherit;
    text-align:center;letter-spacing:.06em;font-weight:600;margin-bottom:var(--sp-2);}
  .auth-field:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  /* 초대 코드 — 글자마다 색이 흐르게.
     input 안의 글자는 하나씩 색을 못 칠한다. 그래서 진짜 글자는 투명하게 두고,
     같은 자리에 색칠한 사본을 겹쳐 그린다. 둘의 글꼴·자간·여백이 한 픽셀이라도
     어긋나면 티가 나므로 값을 한 곳(--code-*)에 모아두고 양쪽이 같이 쓴다. */
  .code-wrap{position:relative;margin-bottom:var(--sp-2);
    --code-pad-y:11px; --code-pad-x:13px; --code-ls:.14em; --code-lh:1.45;}
  .code-wrap .auth-field{margin-bottom:0;color:transparent;caret-color:var(--accent);
    letter-spacing:var(--code-ls);line-height:var(--code-lh);
    padding:var(--code-pad-y) var(--code-pad-x);
    transition:box-shadow .18s ease, border-color .18s ease;}
  .code-wrap .auth-field::placeholder{color:var(--sub);letter-spacing:normal;font-weight:400;}
  .code-wrap.filled .auth-field{border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft), 0 2px 10px rgba(37,99,235,.18);}
  .code-ghost{position:absolute;inset:0;pointer-events:none;
    padding:var(--code-pad-y) var(--code-pad-x);
    font-family:inherit;font-size:var(--fs-md);font-weight:600;
    letter-spacing:var(--code-ls);line-height:var(--code-lh);
    text-align:center;white-space:pre;overflow:hidden;}
  .code-ghost span{animation:code-pop .18s ease-out;}
  @keyframes code-pop{from{opacity:0;transform:translateY(-3px);}to{opacity:1;transform:none;}}
  .auth-msg{font-size:var(--fs-sm);line-height:1.6;color:var(--sub);margin-top:var(--sp-3);
    min-height:1.3em;word-break:keep-all;}
  .auth-msg.err{color:var(--danger);}
  /* 설정 항목 한 줄 — 이름 + 아래 설명.
     위험한 것은 .danger 를 붙여 빨갛게 한다. 굵은 빨강을 남발하면 아무것도 안 띈다. */
  .opt-row{display:flex;align-items:center;gap:11px;padding:11px 13px;
    border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel);
    cursor:pointer;text-align:left;color:var(--accent);font-family:inherit;
    transition:border-color .12s ease, background .12s ease;}
  .opt-row:hover{border-color:var(--accent);background:var(--accent-soft);}
  .opt-row.danger{color:var(--danger);}
  .opt-row.danger:hover{border-color:var(--danger);}
  .opt-row svg{flex:0 0 auto;}
  .opt-row-txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
  .opt-row-txt b{font-size:var(--fs-sm);font-weight:600;}
  .opt-row-txt i{font-style:normal;font-size:var(--fs-xs);color:var(--sub);}
  .opt-row-arw{color:var(--sub);font-size:var(--fs-xs);flex:0 0 auto;}
  /* 안내 단계 — 브라우저 기본 <ol> 은 한글을 단어 중간에서 자른다.
     번호를 글줄 밖으로 빼고 keep-all 을 걸어야 읽힌다. */
  /* li 를 flex 로 만들면 글자 덩어리마다 따로 떨어져 단어 순서가 흐트러진다.
     li 는 평범한 블록으로 두고, 번호만 왼쪽에 띄운다. */
  /* 단계끼리는 붙이고, 앞 문장과는 띄운다. 반대로 하면 1번이 소개 문장에
     딸려 보이고 2번은 혼자 떨어져 나간다. */
  .steps{counter-reset:st;list-style:none;margin:12px 0 var(--sp-4);padding:0;}
  .steps li{position:relative;padding-left:26px;margin-bottom:4px;
    font-size:var(--fs-sm);line-height:1.55;color:var(--text);word-break:keep-all;}
  .steps li:last-child{margin-bottom:0;}
  .steps li::before{counter-increment:st;content:counter(st);
    position:absolute;left:0;top:3px;width:18px;height:18px;
    border-radius:var(--r-full);background:var(--accent-soft);color:var(--accent);
    font-size:var(--fs-xs);font-weight:700;line-height:18px;text-align:center;}
  .steps b{font-weight:600;color:var(--accent);}
  .note-sm{margin:0;font-size:var(--fs-xs);color:var(--sub);
    line-height:1.7;word-break:keep-all;}
  /* 계정 삭제 확인 — 한 줄에 하나씩, 라벨과 내용을 나눠 읽게 한다 */
  .facts{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;
    border:1px solid var(--border);border-radius:var(--r-md);padding:13px 15px;
    font-size:var(--fs-sm);line-height:1.6;margin-bottom:var(--sp-4);}
  .facts dt{color:var(--sub);white-space:nowrap;}
  .facts dd{margin:0;color:var(--text);}
  .warn-head{display:flex;align-items:center;gap:7px;font-size:var(--fs-sm);
    font-weight:600;color:var(--danger);margin-bottom:var(--sp-2);}
  .auth-warn{border:1px solid var(--danger);border-radius:var(--r-md);padding:12px 14px;
    font-size:var(--fs-sm);line-height:1.7;color:var(--text);text-align:left;
    margin-bottom:var(--sp-3);word-break:keep-all;}
  .auth-warn b{color:var(--danger);}
  .auth-warn-time{font-size:var(--fs-md);margin-bottom:6px;padding-bottom:6px;
    border-bottom:1px solid var(--border);}
  .auth-who{font-size:var(--fs-xs);color:var(--sub);margin-top:var(--sp-4);}
  .auth-who button{background:none;border:none;color:var(--sub);text-decoration:underline;
    cursor:pointer;font-size:var(--fs-xs);font-family:inherit;padding:0;}
  .auth-who button:hover{color:var(--accent);}
  .auth-spinner{width:22px;height:22px;margin:6px auto;border:2px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;animation:auth-spin .7s linear infinite;}
  @keyframes auth-spin{to{transform:rotate(360deg);}}

  /* 체험 중 배지 — 화면 아래 가운데. 위쪽은 헤더·툴바가 이미 차 있다. */
  .demo-badge{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:900;
    display:flex;align-items:center;gap:14px;max-width:calc(100vw - 24px);
    padding:10px 12px 10px 16px;border-radius:var(--r-full);
    background:var(--panel);border:1px solid var(--border);box-shadow:var(--sh-lg);
    animation:view-in .32s cubic-bezier(.22,1,.36,1);}
  .demo-text{display:flex;flex-direction:column;line-height:1.4;min-width:0;}
  .demo-text b{font-size:var(--fs-sm);font-weight:700;white-space:nowrap;}
  .demo-text span{font-size:var(--fs-xs);color:var(--sub);white-space:nowrap;}
  .demo-go{flex:0 0 auto;text-decoration:none;font-size:var(--fs-sm);font-weight:700;
    padding:8px 16px;border-radius:var(--r-full);background:var(--accent);color:#fff;
    transition:transform .12s ease, box-shadow .12s ease;}
  .demo-go:hover{transform:translateY(-1px);box-shadow:var(--sh-accent);}
  .demo-go:active{transform:translateY(0) scale(.97);}
  /* 폰에서는 가운데를 비워둔다 — 오른쪽 아래에 새 이야기 버튼(FAB)이 있다 */
  @media (max-width:760px){
    .demo-badge{left:12px;transform:none;bottom:16px;padding:8px 10px 8px 14px;gap:10px;}
  }

  /* 사이드바 계정 카드 — 로고 바로 아래. 로그인 뒤에만 나타난다 */
  /* 상단 우측 계정 버튼. 이름만 보이고 이메일은 눌렀을 때 메뉴에서 확인한다. */
  .acct-card{display:none;align-items:center;gap:8px;padding:5px 10px 5px 6px;max-width:200px;
    background:var(--panel);border:1px solid var(--border);
    border-radius:var(--r-md);cursor:pointer;text-align:left;font-family:inherit;
    transition:background .12s ease, border-color .12s ease;}
  .acct-card:hover{background:var(--accent-soft);border-color:var(--accent);}
  .acct-card:active{transform:scale(.99);}
  .acct-av{width:28px;height:28px;border-radius:50%;flex:0 0 auto;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent);color:#fff;font-weight:700;font-size:var(--fs-md);}
  .acct-av img{width:100%;height:100%;object-fit:cover;display:block;}
  .acct-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .acct-name{font-size:var(--fs-sm);font-weight:700;color:var(--text);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .acct-mail{display:none;font-size:var(--fs-xs);color:var(--sub);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .acct-caret{width:15px;height:15px;flex:0 0 auto;color:var(--sub);}
</style>
</head>

  /* 목록에 보여줄 제목 — 뒤에 붙은 검색용 태그를 걷어낸다.
     야담 제목은 "…지혜로운 장모님 |야담 옛날이야기 오디오북 설화 민담 수면동화|" 처럼
     끝에 태그가 30자씩 붙는다. 두 줄로 자르면 그 태그가 한 줄을 통째로 먹어서
     정작 필요한 내용이 잘려나간다.
     저장된 제목은 건드리지 않는다 — 업로드할 때는 태그가 필요하다. */
  function displayTitle(name){
    const s = String(name == null ? "" : name);
    const cut = s.search(/[|ㅣ]/);
    const head = (cut > 0 ? s.slice(0, cut) : s)
      .replace(/(\s*#[^\s#]+)+\s*$/, "")      // 끝에 붙은 해시태그도 함께
      .trim();
    return head || s.trim();                   // 다 걷어내서 비면 원래 것을 쓴다
  }

  // innerHTML 에 들어가는 사용자 입력용
  function escapeHtml(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function newProject(name, uploadAt, channelId, stageTemplate){
    const tmpl = stageTemplate || DEFAULT_STAGE_TEMPLATE;
    return {
      id: uid(), name, uploadAt: uploadAt || "",
      channelId: channelId || null, completed:false, thumbnail:null,
      createdAt: Date.now(), order: Date.now(),
      stages: tmpl.map(st=>({
        name: st.name, icon: st.icon || iconFor(st.name), manualDone:false,
        url: st.url || "",
        subtasks: (st.subtasks||[]).map(t=>({t, done:false}))
      }))
    };
  }

     안 보이는 픽셀까지 들고 있으면 용량만 커진다.
     인코딩은 WebP 우선 — 같은 화질에서 JPEG보다 눈에 띄게 작다. */
  /* 받기 전에 크기를 본다.
     저장되는 건 어차피 10KB 안팎이라 결과는 안전하다. 문제는 줄이기 전이다 —
     파일을 통째로 메모리에 올리고 그림으로 펼쳐야 하는데, 4MB 짜리 JPEG 도
     펼치면 48MB 를 쓴다. 카메라 원본을 그대로 끌어다 놓으면 화면이 멈춘다.
     파일 크기만으로는 모자란다. 파일은 작은데 8000px 짜리 파노라마일 수 있다. */
  const IMG_MAX_BYTES = 10 * 1024 * 1024;
  const IMG_MAX_SIDE  = 8000;

  function encodeImage(file, opt, cb){
    const o = opt || {};
    const maxW = o.maxW || 480;
    const aspect = o.aspect || null;     // 16/9, 1 …  없으면 원본 비율
    const q = o.quality || 0.68;

    if(file && file.size > IMG_MAX_BYTES){
      showFleetingToast("사진이 너무 커요 (" + Math.round(file.size/1024/1024) + "MB). 10MB 이하로 줄여주세요", true);
      return;
    }

    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        if(img.width > IMG_MAX_SIDE || img.height > IMG_MAX_SIDE){
          showFleetingToast("사진이 너무 커요 (" + img.width + "×" + img.height + "). 8000px 이하로 줄여주세요", true);
          return;
        }
        let sx = 0, sy = 0, sw = img.width, sh = img.height;
        if(aspect){                      // 가운데 기준으로 비율에 맞춰 잘라낸다
          if(sw / sh > aspect){
            const nw = Math.round(sh * aspect);
            sx = Math.round((sw - nw) / 2); sw = nw;
          }else{
            const nh = Math.round(sw / aspect);
            sy = Math.round((sh - nh) / 2); sh = nh;
          }
        }
        const w = Math.max(1, Math.min(maxW, sw));
        const h = Math.max(1, Math.round(w * sh / sw));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);

        let out = canvas.toDataURL("image/webp", q);
        if(out.indexOf("data:image/webp") !== 0){       // WebP 미지원 브라우저
          out = canvas.toDataURL("image/jpeg", Math.min(0.82, q + 0.08));
        }
        cb(out, Math.round(out.length * 0.75 / 1024));  // 대략적인 KB
      };
      img.onerror = ()=> showFleetingToast("이미지를 읽을 수 없어요", true);
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  /* 채널 id 는 사람마다 달라야 한다. 고정값을 쓰면 모든 사용자가 같은 id 를 갖게 되고,
     나중에 채널을 표로 빼서 공유할 때 기본키가 부딪힌다. */
  const DEFAULT_CHANNEL_NAME = "내 채널";
  function makeDefaultChannel(){
    return {id: uid(), name: DEFAULT_CHANNEL_NAME, color: "#7a5cff", image: null};
  }
  const DEFAULT_PROJECTS = [];

  /* 체험 모드 — 로그인 없이 예시 데이터로 앱을 둘러본다.
     저장을 하지 않는 것이 전부다. localStorage 도 db 도 건드리지 않는다.
     그래야 체험하다 나가도 흔적이 남지 않고, 진짜로 가입했을 때 빈 앱에서 시작한다. */
  const DEMO = /(^|[?&])demo=1(&|$)/.test(location.search);

  let state = null;
  if(!DEMO){
    try{
      state = JSON.parse(localStorage.getItem("yadam-state-v5") || "null");
    }catch(e){
      console.error("저장된 데이터를 읽는 중 오류 발생, 초기화합니다.", e);
      state = null;
    }
  }
  if(!state){
    state = {
      schemaVersion: 2,
      // 채널이 없으면 이야기를 만들 수 없다. 첫 실행에 하나 만들어 두고 이름만 바꾸게 한다.
      projects: DEFAULT_PROJECTS, trash: [], channels: [makeDefaultChannel()],
      active:null, view:"all", layout:"grid", search:"", channelFilter:null,
      sortMode:"date", showCompleted:false, stageTemplate: JSON.parse(JSON.stringify(DEFAULT_STAGE_TEMPLATE))
    };
  }
  function save(){
    if(DEMO) return;                 // 체험 모드는 아무것도 저장하지 않는다
    try{
      localStorage.setItem("yadam-state-v5", JSON.stringify(state));
    }catch(e){
      console.error("저장 실패:", e);
    }
    scheduleSync();   // 절대 await 하지 않음 — 실패해도 렌더를 막지 않는다
  }

  /* =========================================================================
     db 동기화 계층
     설계 원칙 (이걸 어기면 카드 클릭이 죽는다):
       1. save() 는 계속 동기 함수다. 41개 호출부를 async 로 오염시키지 않는다.
       2. 클릭 핸들러 안에서 절대 await 하지 않는다. db 쓰기는 fire-and-forget.
       3. renderAll() 은 db 를 기다리지 않는다. db 가 null 이어도 앱은 100% 동작.
       4. UI 상태(view/active/search/layout/...)는 동기화하지 않는다.
          이걸 동기화하면 스냅샷이 방금 클릭한 view 를 되돌려서
          "클릭해도 반응 없음" 으로 보인다.
     ========================================================================= */
  var db = null;                 // 로그인 뒤 connectDb() 가 채운다. 그 전엔 로컬 전용
  var dbReady = false;
  var syncTimer = null;
  var syncing = false;
  var syncAgain = false;
  var lastSent = new Map();      // projectId -> 마지막으로 db 에 보낸 JSON
  var lastMetaSent = null;
  /* 채널은 지금 두 곳에 저장된다 — meta.data.channels(원본)와 channels 표(새 구조).
     앱은 아직 meta 를 읽는다. 표는 채워만 두고, 며칠 뒤 읽기를 그쪽으로 넘긴다.
     양쪽에 쓰는 동안에는 앱을 이전 버전으로 되돌려도 잃는 게 없다. */
  var lastChannelsSent = new Map();   // channelId -> 마지막으로 표에 보낸 JSON
  var lastWriteAt = 0;           // 마지막 클라우드 쓰기가 끝난 시각 — 낡은 조회 결과를 걸러내는 기준
  var applyingRemote = false;
  var pendingRemote = null;
  var remoteProjects = null;     // 마지막 스냅샷의 프로젝트 목록
  var remoteMeta = null;
  var remoteChannels = null;     // 채널 표의 마지막 스냅샷 (행 배열)
  var myUid = null;              // 로그인한 사람의 id. 공유받은 것 구분에 쓴다
  /* 초대 토큰을 잠깐 넣어두는 자리. bootAuth 가 파일 앞쪽에서 돌기 때문에
     이 상수도 그보다 먼저 선언돼 있어야 한다. */
  const JOIN_KEY = "yadam-join";
  /* 공유받은 사람에게 "누구 채널인지" 보여주려고 소유자가 스스로 적어두는 이름.
     남의 계정 정보는 읽을 수 없으므로 이 방법밖에 없다. */
  /* 공유받은 채널을 뭐라고 부를지.
     소유자 이름은 겹칠 수 있다 — 서로 다른 두 사람이 같은 이름을 쓰면
     어느 채널이 누구 건지 구분이 안 된다. 그래서 받는 쪽이 직접 별명을 붙일 수 있다.
     별명은 내 meta 에만 저장되므로 상대는 모른다. */
  /* 채널 이름은 절대 바꿔 보여주지 않는다. 같은 채널을 두 사람이 다른 이름으로
     부르면 대화가 어긋난다. 공유받은 채널은 이름 뒤에 소유자를 괄호로 붙인다. */
  function chDisplayName(c){ return c ? c.name : ""; }
  function chOwnerSuffix(c){
    if(!c || !c.shared || !c.ownerName) return "";
    return "(" + c.ownerName + ")";
  }
  // 둘 이상이 쓰는 채널 — 내가 공유한 것이든, 공유받은 것이든
  function isCollab(c){ return !!(c && (c.shared || (c.memberCount || 1) > 1)); }

  /* 공유받은 사람에게 보이는 내 이름.
     구글 실명을 그대로 내보내지 않는다 — 처음 값으로만 쓰고, 설정에서 바꿀 수 있다. */
  function googleName(){
    const u = authedUser;
    if(!u) return null;
    const m = u.user_metadata || {};
    return m.full_name || m.name || (u.email || "").split("@")[0] || null;
  }
  function myDisplayName(){
    const n = (state.nickname || "").trim();
    return n || googleName();
  }
  var remoteReadAt = 0;          // 마지막 원격 조회를 시작한 시각
  var DOC_LIMIT = 250000;        // 문서 1개 256KiB 제한에 대한 안전 여유

  /* 정상일 때는 숨긴다. "동기화됨"이 늘 떠 있으면 자리만 먹고,
     정작 문제가 생겼을 때 눈에 들어오지 않는다. 문제일 때만 보이는 게 경고의 역할이다.
     (hidden 속성은 .sync-status 의 display:flex 에 밀려서 안 먹는다. style 로 직접 끈다) */
  function setSyncStatus(kind, text){
    const el = document.getElementById("syncStatus");
    if(!el) return;
    if(kind === "ok"){ el.style.display = "none"; return; }
    el.style.display = "flex";
    el.className = "sync-status" + (kind ? " " + kind : "");
    document.getElementById("syncStatusText").textContent = text;
  }

  // 데이터 슬라이스만 추출 — UI 상태는 제외
  /* 공유받은 이야기를 통째로 얼린다.

     화면에서 버튼을 막는 것만으로는 못 막는다. 클릭 처리가 button 뿐 아니라
     div·span·label 에도 붙어 있어서, 하나씩 찾아 막으면 계속 샌다.
     실제로 "수정되는 것처럼 보였다가 새로고침하면 원래대로" 가 그렇게 생겼다.

     얼려두면 어느 경로로 손대든 값이 안 바뀐다. 이 파일은 strict 모드가 아니라
     얼린 객체에 쓰기를 시도해도 조용히 무시된다 — 다시 그려도 원래 값 그대로다.

     주의: normalizeState 가 빠진 항목을 채우므로 그 뒤에 얼려야 한다. */
  function deepFreeze(o){
    if(!o || typeof o !== "object" || Object.isFrozen(o)) return o;
    Object.freeze(o);
    Object.keys(o).forEach(k=> deepFreeze(o[k]));
    return o;
  }
  function freezeReadOnly(){
    state.projects.forEach(p=>{ if(p._ro) deepFreeze(p); });
  }

  /* 클라우드로 나가는 유일한 통로. 공유받은 이야기는 여기서 빠진다.
     이 한 곳만 지키면 남의 이야기를 내 것으로 복제하는 일이 생길 수 없다.
     (화면에는 섞여 보여도 된다 — 화면은 아무것도 저장하지 않는다) */
  function dataSlice(){
    const out = {};
    state.projects.forEach(p=>{
      if(p._ro) return;
      out[p.id] = Object.assign({}, p, {_trashed:false});
      delete out[p.id]._ro;
    });
    state.trash.forEach(p=>{
      if(p._ro) return;
      out[p.id] = Object.assign({}, p, {_trashed:true});
      delete out[p.id]._ro;
    });
    return out;
  }

  function scheduleSync(){
    if(!dbReady || applyingRemote) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(flushSync, 700);   // 연속 편집을 한 번의 쓰기로 묶는다
  }

  function flushSync(){
    syncTimer = null;                  // 예약이 소진됐음을 알린다 — applyRemote 가 이걸 본다
    if(!db || syncing) { if(syncing) syncAgain = true; return; }
    const want = dataSlice();
    const jobs = [];   // 썽크 배열 — 동시 쓰기 폭주(resource_exhausted) 방지용으로 순차 실행
    let oversize = 0;

    /* 채널을 먼저 보낸다. projects.channel_id 가 채널 행을 가리키는 외래키라,
       채널이 아직 없는데 이야기를 보내면 거절당한다. jobs 는 순서대로 실행된다. */
    const chWant = new Map();
    const myName = myDisplayName();
    state.channels.forEach((c, i)=>{
      if(c.shared) return;                     // 남의 채널은 내가 쓰지 않는다
      chWant.set(c.id, {name: c.name, color: c.color || null, image: c.image || null,
                        order: i, ownerName: myName});
    });
    chWant.forEach((row, id)=>{
      const json = JSON.stringify(row);
      if(lastChannelsSent.get(id) === json) return;
      jobs.push(()=> db.doc("channels/" + id).set(row).then(()=>{ lastChannelsSent.set(id, json); }));
    });
    Array.from(lastChannelsSent.keys()).forEach(id=>{
      if(chWant.has(id)) return;
      jobs.push(()=> db.doc("channels/" + id).delete().then(()=>{ lastChannelsSent.delete(id); }));
    });

    const chIds = new Set(state.channels.map(c=>c.id));
    Object.keys(want).forEach(id=>{
      const json = JSON.stringify(want[id]);
      if(lastSent.get(id) === json) return;
      if(json.length > DOC_LIMIT){ oversize++; return; }
      const cid = chIds.has(want[id].channelId) ? want[id].channelId : null;
      jobs.push(()=> db.doc("projects/" + id).set(want[id], {channel_id: cid})
                       .then(()=>{ lastSent.set(id, json); }));
    });
    Array.from(lastSent.keys()).forEach(id=>{
      if(want[id]) return;
      jobs.push(()=> db.doc("projects/" + id).delete().then(()=>{ lastSent.delete(id); }));
    });

    /* 예비본에는 내 채널만 담는다. 공유받은 채널까지 넣으면, 되돌렸을 때
       남의 채널이 내 것으로 되살아난다. 화면용으로 붙인 값(shared/memberCount)도 뺀다. */
    const meta = {channels: state.channels.filter(c=>!c.shared)
                    .map(c=>({id:c.id, name:c.name, color:c.color||null, image:c.image||null})),
                  stageTemplate: state.stageTemplate,
                  noteTrash: state.noteTrash,
                  nickname: state.nickname || null};
    const mjson = JSON.stringify(meta);
    if(mjson !== lastMetaSent && mjson.length <= DOC_LIMIT){
      jobs.push(()=> db.doc("meta/app").set(meta).then(()=>{ lastMetaSent = mjson; }));
    }

    if(!jobs.length){
      if(oversize) setSyncStatus("err", "이미지가 너무 커서 일부 미동기화");
      return;
    }

    syncing = true;
    jobs.reduce((chain, job)=> chain.then(job), Promise.resolve())
      .then(()=>{
        lastWriteAt = Date.now();          // 이 시각 이전에 시작된 조회 결과는 내 쓰기를 못 봤다
        setSyncStatus(oversize ? "err" : "ok",
          oversize ? "이미지가 너무 커서 일부 미동기화" : "동기화됨");
      })
      .catch(e=>{
        // 로컬 저장은 이미 끝났다. 여기서 다시 던지지 않는다.
        console.warn("db 동기화 실패(로컬 저장은 정상):", e && e.code, e && e.message);
        setSyncStatus("err", e && e.code === "quota_exceeded" ? "저장 용량 초과" : "동기화 오류");
      })
      .then(()=>{
        syncing = false;
        if(syncAgain){ syncAgain = false; scheduleSync(); }
      });
  }

  // 원격 문서들 -> state 의 데이터 슬라이스로 반영
  function applyRemote(){
    if(!pendingRemote) return;
    /* 낡은 조회 결과로 덮으면 방금 만든 이야기가 사라진다.
       사라진 이야기가 열려 있던 것이면 화면까지 목록으로 튕긴다.
       그래서 미뤄두지 않고 "버린다" — 다음 폴링이 최신 상태를 다시 가져온다.
         1) 아직 못 보낸 내 변경이 있는 동안 도착한 것
         2) 내 마지막 쓰기보다 먼저 시작된 조회 (응답이 늦게 와도 내용은 옛날 것) */
    if(syncTimer || syncing){ pendingRemote = null; return; }
    if(pendingRemote.readAt && pendingRemote.readAt < lastWriteAt){ pendingRemote = null; return; }
    // 사용자가 입력 중이거나 모달이 열려 있으면 화면을 갈아엎지 않는다
    const ae = document.activeElement;
    if(document.querySelector(".overlay")) return;
    if(ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.isContentEditable)) return;

    const snap = pendingRemote;
    pendingRemote = null;

    // 스냅샷 문서와 data() 는 frozen 이다. 앱은 stages/subtasks 를 직접 변경하므로
    // 얕은 복사로는 안 된다 — 얕게 복사하면 체크박스 클릭이 조용히 씹힌다.
    const clone = (o)=> JSON.parse(JSON.stringify(o));
    const projects = [], trash = [];
    snap.projects.forEach(d=>{
      const p = clone(d);
      const trashed = p._trashed; delete p._trashed;
      /* 남의 이야기는 읽기 전용으로 표시한다. 이 표시가 쓰기 깔때기(dataSlice)에서
         걸러지는 유일한 기준이다 — 여기가 틀리면 남의 이야기를 내 것으로 복제한다. */
      const owner = p._owner; delete p._owner;
      p._ro = !!(myUid && owner && owner !== myUid);
      // 남의 휴지통 항목까지 보여줄 이유는 없다
      if(p._ro && trashed) return;
      (trashed ? trash : projects).push(p);
    });
    const byOrder = (a,b)=> (a.order||0) - (b.order||0);
    projects.sort(byOrder); trash.sort(byOrder);

    /* 채널은 이제 표가 원본이다. meta.data.channels 는 예비로 남겨둔다 —
       표가 비어 있는 사람(마이그레이션 이후에 가입했다가 표 쓰기가 실패한 경우 등)은
       meta 로 버티고, flushSync 가 표를 채워준다.
       표 행에 없는 항목은 로컬 것을 그대로 둔다. 안 그러면 앱이 쓰는 즉시
       "표에서 읽은 것"과 "로컬"이 계속 달라 보여 화면이 덜컹거린다. */
    const localCh = new Map(state.channels.map(c=>[c.id, c]));
    const fromRows = (rows)=> rows.map(function(r){
      const base = localCh.get(r.id) || {};
      const shared = !!(myUid && r.owner_id && r.owner_id !== myUid);
      return Object.assign({}, base, {
        id: r.id,
        name: r.name,
        color: r.color != null ? r.color : (base.color || null),
        image: r.image != null ? r.image : (base.image || null),
        shared: shared,
        ownerName: shared ? (r.owner_name || null) : null,
        memberCount: (r.channel_members && r.channel_members[0] && r.channel_members[0].count) || 1
      });
    });
    const nextData = {projects, trash,
      channels: (snap.channels && snap.channels.length) ? fromRows(snap.channels)
              : (snap.meta && snap.meta.channels ? clone(snap.meta.channels) : state.channels),
      stageTemplate: snap.meta && snap.meta.stageTemplate ? clone(snap.meta.stageTemplate) : state.stageTemplate,
      noteTrash: snap.meta && snap.meta.noteTrash ? clone(snap.meta.noteTrash) : (state.noteTrash || []),
      nickname: snap.meta && snap.meta.nickname !== undefined ? snap.meta.nickname : (state.nickname || null)};
    const cur = {projects: state.projects, trash: state.trash,
      channels: state.channels, stageTemplate: state.stageTemplate,
      noteTrash: state.noteTrash || [],
      nickname: state.nickname || null};
    if(JSON.stringify(nextData) === JSON.stringify(cur)) return;   // 내 쓰기의 메아리

    applyingRemote = true;
    try{
      state.projects = nextData.projects;
      state.trash = nextData.trash;
      state.channels = nextData.channels;
      state.stageTemplate = nextData.stageTemplate;
      state.noteTrash = nextData.noteTrash;
      state.nickname = nextData.nickname;
      normalizeState(state);        // 다른 기기가 옛 버전이었을 수 있다
      freezeReadOnly();             // 채운 뒤에 얼린다
      // 열려 있던 프로젝트가 사라졌으면 목록으로
      if(state.view === "detail" && state.active &&
         !state.projects.some(p=>p.id===state.active) &&
         !state.trash.some(p=>p.id===state.active)){
        state.view = "all"; state.active = null;
      }
      try{ localStorage.setItem("yadam-state-v5", JSON.stringify(state)); }catch(e){}
      renderAll();
    } finally {
      applyingRemote = false;
    }
  }

  function rememberSent(){
    const want = dataSlice();
    lastSent = new Map();
    Object.keys(want).forEach(id=> lastSent.set(id, JSON.stringify(want[id])));

     채널 전부를 다시 쓴다. 표가 비어 있으면 그대로 두는데, 그러면 다음

     저절로 복구되는 자리다. */
  function primeChannelsSent(rows){
    lastChannelsSent = new Map();
    (rows || []).forEach(function(r){
      // 공유받은 채널은 여기 넣으면 안 된다. 넣으면 "로컬에 없어진 채널"로 보여서
      // flushSync 가 남의 채널을 지우러 간다.
      if(myUid && r.owner_id && r.owner_id !== myUid) return;
      lastChannelsSent.set(r.id, JSON.stringify({
        name: r.name, color: r.color || null, image: r.image || null,
        order: r.sort_order || 0, ownerName: r.owner_name || null
      }));
    });
  }

  var sb = null;
  var authedUser = null;      // 계정 삭제 화면에서 이메일 확인에 쓴다

  function makeSupabaseDb(client, uid){
    const projWatch = [], metaWatch = [], chanWatch = [];
    let polling = false;

    // supabase-js 는 오류를 던지지 않고 {data, error} 로 돌려준다. 여기서 던져준다.
    function must(res){ if(res && res.error) throw res.error; return res; }
    function snapOf(v){ return {exists: v != null, data: function(){ return v; }}; }
    function toDocs(rows){
      return (rows || []).map(function(r){
        return {id: r.id, userId: r.user_id, data: function(){ return r.data; }};
      });
    }
    function stamp(){ return new Date().toISOString(); }

    /* 필터를 걸지 않는다 — RLS 가 "내 것 + 내가 멤버인 채널의 것"을 돌려준다.
       user_id 를 함께 읽어야 어느 게 남의 것인지 구분할 수 있다. */
    function readProjects(){
      return client.from("projects").select("id,data,user_id").then(must);
    }
    function readMeta(){
      return client.from("meta").select("data").eq("user_id", uid).maybeSingle().then(must);
    }
    /* 채널 표. 지금은 내가 만든 것만 읽는다 — 공유가 들어오면 이 필터를 푼다.
       stage_template 은 건드리지 않는다. 채널별 템플릿은 나중 단계다. */
    function readChannels(){
      // 필터를 걸지 않는다 — RLS 가 "내 것 + 내가 멤버인 것"만 돌려준다.
      // 멤버 수를 같이 받아야 "혼자 쓰는 채널"과 "협업 중"을 가릴 수 있다.
      return client.from("channels")
        .select("id,name,color,image,sort_order,owner_id,owner_name,channel_members(count)")
        .order("sort_order").then(must);
    }

    function pollOnce(){
      if(document.hidden) return;
      const t0 = Date.now();          // 조회를 "시작한" 시각. 응답이 늦게 와도 내용은 이 시점 것이다
      if(projWatch.length){
        readProjects().then(function(res){
          const snap = {docs: toDocs(res.data), readAt: t0};
          projWatch.forEach(function(w){ w.cb(snap); });
        }).catch(function(e){ projWatch.forEach(function(w){ if(w.err) w.err(e); }); });
      }
      if(metaWatch.length){
        readMeta().then(function(res){
          const snap = snapOf(res.data ? res.data.data : null);
          snap.readAt = t0;
          metaWatch.forEach(function(w){ w.cb(snap); });
        }).catch(function(e){ metaWatch.forEach(function(w){ if(w.err) w.err(e); }); });
      }
      if(chanWatch.length){
        readChannels().then(function(res){
          const snap = {rows: res.data || [], readAt: t0};
          chanWatch.forEach(function(w){ w.cb(snap); });
        }).catch(function(e){ chanWatch.forEach(function(w){ if(w.err) w.err(e); }); });
      }
    }
    function startPolling(){
      if(polling) return;
      polling = true;
      setInterval(pollOnce, POLL_MS);
      document.addEventListener("visibilitychange", function(){ if(!document.hidden) pollOnce(); });
      window.addEventListener("focus", pollOnce);
    }

    return {
      doc: function(path){
        const parts = path.split("/");
        if(parts[0] === "projects"){
          const id = parts[1];
          return {
            /* extra.channel_id 는 호출부가 "실제로 있는 채널"만 넣어준다.
               없는 채널을 가리키면 외래키에 걸려 이야기 저장이 통째로 거절된다. */
            set: function(obj, extra){
              return client.from("projects")
                .upsert({user_id: uid, id: id, data: obj,
                         channel_id: (extra && extra.channel_id) || null,
                         updated_at: stamp()},
                        {onConflict: "user_id,id"}).then(must);
            },
            delete: function(){
              return client.from("projects").delete().eq("user_id", uid).eq("id", id).then(must);
            },
            get: function(){
              return client.from("projects").select("data").eq("user_id", uid).eq("id", id)
                .maybeSingle().then(must)
                .then(function(res){ return snapOf(res.data ? res.data.data : null); });
            }
          };
        }
        if(parts[0] === "channels"){
          const id = parts[1];
          return {
            // obj = {name, color, image, order}
            set: function(obj){
              return client.from("channels")
                .upsert({id: id, owner_id: uid,
                         name: obj.name || "채널",
                         color: obj.color || null,
                         image: obj.image || null,
                         sort_order: obj.order || 0,
                         owner_name: obj.ownerName || null,
                         updated_at: stamp()},
                        {onConflict: "id"}).then(must);
            },
            delete: function(){
              // 이 채널의 이야기 행은 외래키 cascade 로 함께 지워진다.
              // 앱도 같은 이야기를 지우므로 둘이 겹치지만, 지우는 건 몇 번 해도 같다.
              return client.from("channels").delete()
                .eq("id", id).eq("owner_id", uid).then(must);
            }
          };
        }
        return {                                  // meta/app
          set: function(obj){
            return client.from("meta")
              .upsert({user_id: uid, data: obj, updated_at: stamp()},
                      {onConflict: "user_id"}).then(must);
          },
          delete: function(){
            return client.from("meta").delete().eq("user_id", uid).then(must);
          },
          get: function(){
            return readMeta().then(function(res){ return snapOf(res.data ? res.data.data : null); });
          },
          onSnapshot: function(cb, err){ metaWatch.push({cb: cb, err: err}); startPolling(); }
        };
      },
      collection: function(name){
        if(name === "channels"){
          return {
            get: function(){
              return readChannels().then(function(res){
                const rows = res.data || [];
                return {empty: rows.length === 0, rows: rows};
              });
            },
            deleteAll: function(){
              return client.from("channels").delete().eq("owner_id", uid).then(must);
            },
            onSnapshot: function(cb, err){ chanWatch.push({cb: cb, err: err}); startPolling(); }
          };
        }
        return {
          get: function(){
            return readProjects().then(function(res){
              const docs = toDocs(res.data);
              return {empty: docs.length === 0, docs: docs};
            });
          },
          // 초기화용 — 한 건씩 지우면 이야기 수만큼 왕복한다. 한 번에 지운다.
          deleteAll: function(){
            return client.from("projects").delete().eq("user_id", uid).then(must);
          },
          onSnapshot: function(cb, err){ projWatch.push({cb: cb, err: err}); startPolling(); }
        };
      }
    };
  }

  // ---- 연결: renderAll() 을 절대 기다리지 않는다 ----
  function connectDb(uid){
    myUid = uid;                // 내 것과 공유받은 것을 가르는 기준
    db = makeSupabaseDb(sb, uid);
    setSyncStatus("", "연결 중…");
    const startedAt = Date.now();
    Promise.all([db.collection("projects").get(), db.doc("meta/app").get(),
                 db.collection("channels").get()])
      .then(function(res){
        const projSnap = res[0], metaSnap = res[1], chSnap = res[2];
        primeChannelsSent(chSnap.rows);
        remoteChannels = chSnap.rows;
        if(projSnap.empty && !metaSnap.exists){
          // 저장소가 비어 있다 -> 지금 로컬 상태를 최초 1회 씨딩
          dbReady = true;
          lastSent = new Map(); lastMetaSent = null;
          flushSync();
        }else{
          // 저장소가 원본 -> 로컬에 반영
          pendingRemote = {
            projects: projSnap.docs.map(function(d){ return Object.assign({}, d.data(), {_owner: d.userId}); }),
            meta: metaSnap.exists ? metaSnap.data() : null,
            channels: chSnap.rows,
            readAt: startedAt
          };
          applyRemote();
          dbReady = true;
          rememberSent();
          /* meta.data.channels 는 되돌리기용 예비본이다. 표에서 읽은 채널과
             어긋나 있으면 낡은 것이므로, 다시 쓰도록 표시만 지운다.
             (rememberSent 가 방금 "보낸 셈 치고" 기억해버린 것을 취소한다) */
          const metaCh = (metaSnap.exists && metaSnap.data() && metaSnap.data().channels) || [];
          if(JSON.stringify(metaCh) !== JSON.stringify(state.channels)) lastMetaSent = null;
          setSyncStatus("ok", "동기화됨");
        }
        subscribe();
        /* 채널 표를 로컬과 맞춘다. 다를 게 없으면 flushSync 가 그냥 돌아간다.
           표가 비어 있던 사람은 여기서 채워진다. */
        scheduleSync();
        consumeJoinToken();         // 초대 링크로 들어왔으면 여기서 수락한다
        // 첫 실행 안내는 원격 데이터가 도착한 뒤에 판단한다. 먼저 띄우면
        // 다른 기기에서 로그인한 기존 사용자에게도 뜬다.
        maybeFirstRunHint();
      })
      .catch(function(e){
        console.warn("동기화 연결 실패(로컬 저장은 정상):", e && e.code, e && e.message);
        setSyncStatus("err", "동기화 오류 — 로컬에는 저장돼요");
        maybeFirstRunHint();
      });

    function subscribe(){
      db.collection("projects").onSnapshot(function(snap){
        remoteProjects = snap.docs.map(function(d){ return Object.assign({}, d.data(), {_owner: d.userId}); });
        remoteReadAt = snap.readAt || Date.now();
        pendingRemote = {projects: remoteProjects, meta: remoteMeta,
                         channels: remoteChannels, readAt: remoteReadAt};
        applyRemote();
      }, onSubErr);
      db.doc("meta/app").onSnapshot(function(snap){
        remoteMeta = snap.exists ? snap.data() : null;
        if(remoteProjects){
          pendingRemote = {projects: remoteProjects, meta: remoteMeta,
                           channels: remoteChannels,
                           readAt: Math.min(remoteReadAt || 0, snap.readAt || Date.now())};
          applyRemote();
        }
      }, onSubErr);
      db.collection("channels").onSnapshot(function(snap){
        remoteChannels = snap.rows;
        if(remoteProjects){
          pendingRemote = {projects: remoteProjects, meta: remoteMeta,
                           channels: remoteChannels,
                           readAt: Math.min(remoteReadAt || 0, snap.readAt || Date.now())};
          applyRemote();
        }
      }, onSubErr);
      // 입력 중이라 미뤄둔 원격 변경을 나중에 반영
      setInterval(applyRemote, 1500);
    }
    function onSubErr(e){
      console.warn("동기화 확인 실패:", e && e.code, e && e.message);
      setSyncStatus("err", "동기화 끊김");
    }
  }

  /* =========================================================================
     로그인 게이트

     앱은 게이트 뒤에서 평소대로 그려진다. 통과하면 게이트만 걷어낸다.
     그래서 부팅 순서를 건드리지 않는다 — renderAll() 은 원래 자리에서 돈다.
     ========================================================================= */
  const authGate = document.getElementById("authGate");
  const authBody = document.getElementById("authBody");
  const authMsg  = document.getElementById("authMsg");
  const authWho  = document.getElementById("authWho");
  const authSub  = document.getElementById("authSub");

  function authSay(text, isErr){
    authMsg.textContent = text || "";
    authMsg.className = "auth-msg" + (isErr ? " err" : "");
  }
  function authBusy(text){
    authBody.innerHTML = '<div class="auth-spinner"></div>';
    authWho.style.display = "none";
    authSay(text);
  }
  function authErrText(e){
    const m = (e && (e.message || e.error_description)) || "";
    if(/Failed to fetch|NetworkError|fetch failed/i.test(m)){
      return "서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.";
    }
    return m || "알 수 없는 오류가 생겼어요.";
  }

  function showSignIn(){
    // 초대 링크로 온 사람은 왜 로그인을 하는지 알아야 한다
    authSub.textContent = pendingJoinToken()
      ? "초대받은 채널이 있습니다. 로그인하면 들어갑니다."
      : "이야기를 만드는 곳";
    authWho.style.display = "none";
    /* 구글 공식 G 로고. 색이 네 개라 하나의 path 로는 못 그린다. */
    authBody.innerHTML =
      '<button class="auth-btn" id="googleBtn">' +
        '<svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true">' +
          '<path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>' +
          '<path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>' +
          '<path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>' +
          '<path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>' +
        '</svg>Google 계정으로 계속하기</button>' +
      '<div class="auth-alt">' +
        '<a href="./?demo=1">체험해보기</a>' +
        '<span>초대 코드 없이 둘러보기</span>' +
      '</div>';
    document.getElementById("googleBtn").onclick = signInGoogle;
    authSay("");
  }

  function signInGoogle(){
    authBusy("구글로 이동 중…");
    sb.auth.signInWithOAuth({
      provider: "google",
      // prompt=select_account — 구글이 마지막 계정으로 바로 넘기지 않고 계정을 고르게 한다.
      // 이게 없으면 계정이 여러 개인 사람은 "다른 계정으로" 를 눌러도 같은 계정으로 들어간다.
      options: {redirectTo: location.origin + location.pathname,
                queryParams: {prompt: "select_account"}}
    }).then(function(res){
      if(res.error) throw res.error;
    }).catch(function(e){ showSignIn(); authSay(authErrText(e), true); });
  }

  /* 코드 없이 온 사람이 빈 칸 하나만 보고 막히지 않게 한다.
     왜 못 들어오는지, 코드가 없으면 어디로 문의할지를 먼저 알려주고,
     코드가 있는 사람만 한 번 눌러서 칸을 연다.
     msg 가 있으면(코드 틀림 등) 칸을 바로 펴둔다 — 다시 넣어야 하니까. */
  function showInvite(user, msg){
    authSub.textContent = "초대를 받아야 들어올 수 있습니다.";
    authBody.innerHTML =
      '<div class="invite-gate" id="inviteGate">' +
        '<p>채널을 공유받으셨거나 <b>초대 코드</b>가 있어야 합니다.</p>' +
        '<button class="auth-btn" id="showCodeBtn">초대 코드 입력하기</button>' +
        '<p class="invite-ask">코드가 없으시면 <b>siwon.works@gmail.com</b></p>' +
      '</div>' +
      '<div id="codeArea" style="display:none;">' +
        '<div class="code-wrap" id="codeWrap">' +
          '<input type="text" class="auth-field" id="inviteInput" placeholder="초대 코드" autocomplete="off" spellcheck="false">' +
          '<div class="code-ghost" id="codeGhost"></div>' +
        '</div>' +
        '<button class="auth-btn" id="inviteBtn">확인</button>' +
      '</div>';
    authWho.style.display = "";
    authWho.innerHTML = escapeHtml(user.email || "") +
      ' · <button type="button" id="signOutLink">다른 계정으로</button>';
    document.getElementById("signOutLink").onclick = doSignOut;
    authSay(msg || "", !!msg);

    const gate     = document.getElementById("inviteGate");
    const codeArea = document.getElementById("codeArea");
    function openCode(){
      gate.style.display = "none";
      codeArea.style.display = "";
      document.getElementById("inviteInput").focus();
    }
    document.getElementById("showCodeBtn").onclick = openCode;
    if(msg) openCode();

    const inp   = document.getElementById("inviteInput");
    const ghost = document.getElementById("codeGhost");
    const wrap  = document.getElementById("codeWrap");

    /* 파랑(211°)에서 보라(272°)까지 글자 수에 맞춰 나눠 칠한다.
       무지개로 돌리면 유치해지므로 앱 강조색 주변에서만 움직인다. */
    function paint(){
      const s = inp.value;
      wrap.classList.toggle("filled", s.length > 0);
      if(!s){ ghost.innerHTML = ""; return; }
      const from = 211, to = 272;
      ghost.innerHTML = s.split("").map(function(ch, i){
        const t = s.length > 1 ? i / (s.length - 1) : 0;
        const hue = Math.round(from + (to - from) * t);
        return '<span style="color:hsl(' + hue + ',72%,55%)">' + escapeHtml(ch) + '</span>';
      }).join("");
    }
    /* 소문자로 쳐도, 앞뒤에 공백이 붙어도 통과시킨다.
       코드는 눈으로 옮겨 적거나 복사해서 붙여넣는 물건이라 둘 다 흔한 실수다. */
    inp.addEventListener("input", function(){
      const clean = inp.value.replace(/\s+/g, "").toUpperCase();
      if(clean !== inp.value){
        const atEnd = inp.selectionStart === inp.value.length;
        const pos = inp.selectionStart;
        inp.value = clean;
        try{ inp.setSelectionRange(atEnd ? clean.length : pos, atEnd ? clean.length : pos); }catch(e){}
      }
      paint();
    });
    paint();

    function go(){
      const code = inp.value.trim();
      if(!code){ authSay("초대 코드를 입력해 주세요.", true); inp.focus(); return; }
      authBusy("확인하는 중…");
      sb.rpc("redeem_invite", {p_code: code}).then(function(res){
        if(res.error) throw res.error;
        startApp(user);
      }).catch(function(e){ showInvite(user, authErrText(e)); });
    }
    document.getElementById("inviteBtn").onclick = go;
    inp.addEventListener("keydown", function(e){ if(e.key === "Enter") go(); });
    inp.focus();
  }

  function doSignOut(){
    if(!sb){ location.reload(); return; }
    sb.auth.signOut().then(function(){ location.reload(); })
                     .catch(function(){ location.reload(); });
  }

  function startApp(user){
    authedUser = user;
    // 공용 컴퓨터 대비 — 계정이 바뀌면 앞사람 데이터를 남기지 않는다
    const lastUid = localStorage.getItem("yadam-uid");
    if(lastUid && lastUid !== user.id){
      try{ localStorage.removeItem("yadam-state-v5"); }catch(e){}
      try{ localStorage.setItem("yadam-uid", user.id); }catch(e){}
      location.reload();
      return;
    }
    try{ localStorage.setItem("yadam-uid", user.id); }catch(e){}

    const card = document.getElementById("acctCard");
    if(card){
      const meta = user.user_metadata || {};
      const name = meta.full_name || meta.name || (user.email || "").split("@")[0];
      const pic  = meta.avatar_url || meta.picture || "";
      const av   = document.getElementById("acctAv");
      // 구글 프로필 이미지는 referrer 가 붙으면 403 이 나는 경우가 있다
      av.innerHTML = pic
        ? '<img src="' + escapeHtml(pic) + '" alt="" referrerpolicy="no-referrer">'
        : escapeHtml(String(name || "?").trim().charAt(0).toUpperCase());
      document.getElementById("acctName").textContent = name;
      document.getElementById("acctMail").textContent = user.email || "";
      card.title = user.email || "";
      card.style.display = "flex";
      card.onclick = function(){
        /* openContextMenu 는 열기만 한다. 바깥 클릭으로 닫는 처리가 따로 돌기 때문에
           그냥 두면 다시 눌렀을 때 "닫힘 → 즉시 다시 열림"이 되어 안 닫히는 것처럼 보인다. */
        if(document.querySelector(".ctx-menu")){
          document.querySelectorAll(".ctx-menu").forEach(m=>m.remove());
          return;
        }
        const r = card.getBoundingClientRect();
        openContextMenu(r.left, r.bottom + 6, [
          {header: true, label: user.email || ""},
          "sep",
          {icon: ICON.logout, label: "로그아웃", danger: true, action: doSignOut}
        ]);
      };
    }
    authGate.style.display = "none";
    connectDb(user.id);
  }

  /* 삭제 예약 화면 — 24시간이 지나기 전에 들어오면 되돌릴 수 있다.
     앱을 그냥 쓰게 두면 삭제가 예약된 걸 모른 채 계속 쓰다가 날아간다. 그래서 막아 세운다. */
  function showDeletePending(user, atMs){
    const left = Math.max(0, atMs - Date.now());
    const h = Math.floor(left / 3600000);
    const m = Math.floor((left % 3600000) / 60000);
    authSub.textContent = "계정 삭제가 예약되어 있어요.";
    authBody.innerHTML =
      '<div class="auth-warn">' +
        '<div class="auth-warn-time"><b>' + (h > 0 ? h + "시간 " : "") + m + '분</b> 남음</div>' +
        '지나면 이야기·메모·채널 모두 삭제. 되돌릴 수 없음<br>' +
        '재가입은 삭제 7일 뒤부터' +
      '</div>' +
      '<button class="auth-btn" id="undoDelBtn">삭제 취소하고 계속 쓰기</button>';
    authWho.style.display = "";
    authWho.innerHTML = escapeHtml(user.email || "") +
      ' · <button type="button" id="signOutLink">로그아웃</button>';
    document.getElementById("signOutLink").onclick = doSignOut;
    authSay("");
    document.getElementById("undoDelBtn").onclick = function(){
      authBusy("취소하는 중…");
      sb.rpc("cancel_account_deletion").then(function(res){
        if(res.error) throw res.error;
        startApp(user);
        showFleetingToast("계정 삭제를 취소했어요");
      }).catch(function(e){
        showDeletePending(user, atMs);
        authSay(authErrText(e), true);
      });
    };
  }

  function afterSignIn(user){
    authBusy("멤버 확인 중…");
    /* 서버가 없으니 기한 지난 탈퇴 예약은 누군가 로그인할 때 청소한다.
       실패해도 로그인은 진행한다 — 청소는 다음 사람이 해도 된다. */
    return Promise.resolve(sb.rpc("purge_expired_accounts")).catch(function(){})
      .then(function(){
        return sb.from("members").select("user_id,delete_at").eq("user_id", user.id).maybeSingle();
      })
      .then(function(res){
        if(res.error) throw res.error;
        if(!res.data){
          /* 채널 초대 링크로 처음 온 사람은 서비스 초대 코드가 없다.
             링크 자체가 입장권이므로 코드를 묻지 않고 여기서 바로 들여보낸다.
             redeem_channel_invite 가 members 행도 함께 만든다 (code='invite:channel'). */
          const token = pendingJoinToken();
          if(token){
            authBusy("초대 확인 중…");
            return sb.rpc("redeem_channel_invite", {p_token: token}).then(function(r2){
              clearJoinToken();
              if(r2.error){ showInvite(user, authErrText(r2.error)); return; }
              startApp(user);
            }).catch(function(e){
              clearJoinToken();
              showInvite(user, authErrText(e));
            });
          }
          showInvite(user); return;                    // 멤버가 아니다 (탈퇴 완료 포함)
        }
        const at = res.data.delete_at ? new Date(res.data.delete_at).getTime() : 0;
        if(at && at > Date.now()){ showDeletePending(user, at); return; }
        startApp(user);
      });
  }

  /* 배포본과 화면이 똑같으면 어느 쪽을 보고 있는지 헷갈린다. 세 군데로 알린다:
     로고 옆 라벨(제일 먼저 눈이 감) · 상단 띠(사이드바가 접히거나 폰일 때도 보임) ·

  /* =========================================================================
     체험 모드

     예시 데이터는 파일로 두고 받아온다. index.html 에 박아 넣으면 앱을 쓰는
     사람 모두가 쓰지도 않을 1MB 를 매번 내려받게 된다.
     받아오는 동안은 로그인 게이트를 그대로 두고 스피너만 돌린다 — 원격 데이터가
     늦게 도착해 state 를 갈아끼우는 흐름은 db 동기화와 똑같다.
     ========================================================================= */
  function showDemoBadge(){
    const bar = document.createElement("div");
    bar.className = "demo-badge";
    bar.innerHTML =
      '<div class="demo-text"><b>체험 중 · 예시 데이터</b><span>저장되지 않아요</span></div>' +

  function startDemo(){
    authSub.textContent = "예시 데이터로 둘러보기";
    authBusy("불러오는 중…");
    fetch("demo-data.json")
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(json){
        const d = (json && json.data) || {};
        state.schemaVersion = typeof json.schemaVersion === "number" ? json.schemaVersion : 0;
        state.projects      = d.projects  || [];
        state.trash         = d.trash     || [];
        state.channels      = d.channels  || [];
        state.noteTrash     = d.noteTrash || [];

        normalizeState(state);

        showDemoBadge();
        renderAll();
      })
      .catch(function(e){
        console.error("체험 데이터를 불러오지 못했습니다:", e);
        authBody.innerHTML = '<a class="auth-btn" href="./">시작하기</a>';
        authSay("예시 데이터를 불러오지 못했어요. 새로고침해 주세요.", true);
      });

  (function bootAuth(){
    if(DEMO){ startDemo(); return; }
    captureJoinToken();     // 로그인하러 나가기 전에 챙겨둔다
    if(typeof supabase === "undefined" || !supabase || typeof supabase.createClient !== "function"){
      authBody.innerHTML = "";
      authSay("로그인 모듈을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.", true);
      return;
    }
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    authBusy("확인하는 중…");
    sb.auth.getSession().then(function(res){
      const session = res && res.data && res.data.session;
      if(!session){ showSignIn(); return; }
      return afterSignIn(session.user);
    }).catch(function(e){ showSignIn(); authSay(authErrText(e), true); });
  })();

  /* =========================================================================
     데이터 마이그레이션
     흩어져 있으면 어느 보정이 언제 도는지 알 수 없어진다. 전부 여기 모은다.

     규칙 셋:
       1. 항목은 "추가"만 한다. 이름 변경·삭제는 옛 데이터를 깨뜨린다.
       2. 구조를 바꿀 때는 SCHEMA_VERSION 을 올리고 아래에 단계를 하나 더 붙인다.
       3. 읽을 때는 항상 없을 수 있다고 가정한다 (`x || 기본값`).

     항목만 더하는 변경이면 버전을 올릴 필요 없다. normalize() 가 채워준다.
     ========================================================================= */
  const SCHEMA_VERSION = 2;

  function migrateState(s){
    let v = typeof s.schemaVersion === "number" ? s.schemaVersion : 0;

    // --- v0 → v1 : 버전 개념이 없던 시절의 데이터 보정 ---
    if(v < 1){
      // 단계 템플릿이 문자열 배열이던 시절
      if(Array.isArray(s.stageTemplate) && typeof s.stageTemplate[0] === "string"){
        s.stageTemplate = s.stageTemplate.map(n=>({name:n, subtasks:[]}));
      }
      if(s.view === "settings") s.view = "all";        // 없어진 화면
      if(s.sortMode === "manual") s.sortMode = "date"; // 없어진 정렬 방식
      v = 1;
    }

    // --- v1 → v2 : 메모 한 칸 → 포스트잇 여러 장 ---
    if(v < 2){
      (s.projects || []).concat(s.trash || []).forEach(p=>{
        if(!Array.isArray(p.notes)) p.notes = [];
        if(typeof p.memo === "string" && p.memo.trim()){
          p.notes.unshift({id: uid(), text: p.memo, color: "y", createdAt: Date.now()});
        }
        delete p.memo;
      });
      v = 2;
    }

    s.schemaVersion = SCHEMA_VERSION;
    return s;
  }

  /* 버전과 무관하게 매번 도는 보정.
     빠진 항목을 기본값으로 채운다. 새 항목을 더했을 때 여기 한 줄만 추가하면
     옛 데이터도 그대로 열린다. */
  function normalizeState(s){
    if(!Array.isArray(s.projects)) s.projects = [];
    if(!Array.isArray(s.trash)) s.trash = [];
    if(!Array.isArray(s.noteTrash)) s.noteTrash = [];   // 지운 메모 — 항목 추가만이라 버전은 그대로
    if(s.sortMode === "created") s.sortMode = "date";   // 없어진 정렬 방식(등록순)
    if(!Array.isArray(s.channels)) s.channels = [];
    if(!Array.isArray(s.stageTemplate) || !s.stageTemplate.length){
      s.stageTemplate = JSON.parse(JSON.stringify(DEFAULT_STAGE_TEMPLATE));
    }
    s.stageTemplate.forEach(st=>{
      if(!st.icon) st.icon = iconFor(st.name);
      if(typeof st.url !== "string") st.url = "";
      if(!Array.isArray(st.subtasks)) st.subtasks = [];
    });

    s.channels.forEach(c=>{ if(c.image === undefined) c.image = null; });
    /* 없는 채널을 가리키는 필터가 남으면 목록이 통째로 빈다. 어느 채널도 선택 표시가
       안 돼서 원인을 찾기 어렵다. 다른 기기에서 채널을 지웠을 때 실제로 생긴다. */
    if(s.channelFilter && !s.channels.some(c=>c.id === s.channelFilter)) s.channelFilter = null;
    if(typeof s.channelsCollapsed !== "boolean") s.channelsCollapsed = false;
    if(typeof s.nickname !== "string") s.nickname = s.nickname || null;
    // 없어진 현황 칸(진행 중/완료/이번 주 마감)의 필터가 남아 있으면 풀 방법이 없다
    if(s.statFilter && s.statFilter !== "overdue" && s.statFilter !== "wrapup") s.statFilter = null;
    // 채널 0개는 "아직 시작 전"일 때만 허용. 이야기가 있는데 채널이 없으면
    // 그 이야기들이 미아가 되므로 기본 채널을 되살린다.
    if(!s.channels.length && (s.projects.length || s.trash.length)){
      s.channels = [makeDefaultChannel()];
    }

    s.projects.concat(s.trash).forEach(p=>{
      if(!Array.isArray(p.stages)) p.stages = [];
      p.stages.forEach(st=>{
        if(!Array.isArray(st.subtasks)) st.subtasks = [];
        if(!st.icon) st.icon = iconFor(st.name);
        if(typeof st.manualDone !== "boolean") st.manualDone = false;
      });
      if(typeof p.order !== "number") p.order = p.createdAt || 0;
      if(typeof p.completed !== "boolean") p.completed = false;
      if(p.thumbnail === undefined) p.thumbnail = null;
      if(!Array.isArray(p.notes)) p.notes = [];
    });
    return s;
  }

  migrateState(state);
  normalizeState(state);
  /* 브라우저에 남아 있던 state 로 시작할 때도 얼려야 한다. 원격 내용이 이것과
     같으면 applyRemote 가 "내 쓰기의 메아리" 로 보고 건너뛰어서 얼 기회가 없다. */
  freezeReadOnly();
  save();

  // ---------- helpers ----------
  function activeProject(){ return state.projects.find(p=>p.id===state.active) || state.trash.find(p=>p.id===state.active); }
  function channelOf(p){ return state.channels.find(c=>c.id===p.channelId); }

  function completionStampSvg(){
    return `<img src="${STAMP_DATA_URI}" alt="완료 도장">`;
  }

  function chAvatarHtml(ch, size){
    if(!ch) return "";
    if(ch.image){
      return `<span class="channel-avatar" style="width:${size}px;height:${size}px;background-image:url('${ch.image}');background-size:cover;background-position:center;"></span>`;
    }
    return `<span class="channel-avatar" style="width:${size}px;height:${size}px;background:${ch.color};font-size:${Math.round(size*0.5)}px;">${(ch.name||'?')[0]}</span>`;
  }

  function deleteChannelConfirm(ch){
    if(state.channels.length <= 1){        // 채널은 항상 1개 이상 유지
      openModal("채널 삭제", `
        <div class="alert-box">
          <span class="alert-icon">⚠️</span>
          <p>채널은 <b>최소 1개</b>가 있어야 해요.<br>마지막 남은 채널은 삭제할 수 없어요 — 새 채널을 먼저 만든 뒤에 삭제해주세요.</p>
        </div>
        <div class="modal-actions"><button class="btn-primary" id="okBtn">확인</button></div>
      `, (m)=>{ m.querySelector("#okBtn").onclick = closeModal; });
      return;
    }
    const affected = state.projects.filter(p=>p.channelId===ch.id).length;
    openModal("채널 삭제", `
      <div class="modal-subject">
        ${chAvatarHtml(ch, 40)}
        <div><div class="ms-name">${ch.name}</div><div class="ms-sub">${affected}개 이야기</div></div>
      </div>
      <div class="warn-head">⚠️ 되돌릴 수 없음</div>
      <dl class="facts">
        <dt>삭제 대상</dt><dd>채널 · 소속 이야기 ${affected}개</dd>
        <dt>휴지통</dt><dd>거치지 않고 바로 삭제</dd>
      </dl>
      <p class="modal-question">삭제하시겠습니까?</p>
      <div class="modal-actions"><button class="btn-ghost" id="cancelBtn">취소</button><button class="btn-primary" id="okBtn" style="background:var(--danger)">채널 삭제</button></div>
    `, (m)=>{
      m.querySelector("#cancelBtn").onclick = closeModal;
      m.querySelector("#okBtn").onclick = ()=>{
        const removedIds = state.projects.filter(p=>p.channelId===ch.id).map(p=>p.id);
        state.projects = state.projects.filter(p=>p.channelId!==ch.id);
        purgeNotesOf(removedIds);           // 이야기가 사라지면 그 메모도 되살릴 곳이 없다
        state.channels = state.channels.filter(c=>c.id!==ch.id);
        if(state.channelFilter===ch.id) state.channelFilter = null;
        if(state.active && removedIds.includes(state.active)){ state.active=null; state.view="all"; }
        save(); closeModal(); renderAll();
      };
    });
  }

  function openChannelModal(existing, onDone){
    const isNew = !existing;
    let pendingImage = isNew ? null : (existing.image || null);
    const useSub = !!document.getElementById("modalOverlay");
    const opener = useSub ? openSubModal : openModal;
    const closer = useSub ? closeSubModal : closeModal;
    opener(isNew ? "새 채널" : "채널 수정", `
      <div class="thumb-upload" style="margin-bottom:16px;">
        <div class="ch-avatar-preview" id="chAvatarPreview">
          ${pendingImage ? `<img src="${pendingImage}">` : `<span>${isNew?'?':(existing.name||'?')[0]}</span>`}
        </div>
        <div class="thumb-upload-btns">
          <button type="button" id="chImgPickBtn"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="4" width="18" height="16" rx="2" stroke-width="1.6"/><circle cx="8.5" cy="9.5" r="1.5" stroke-width="1.6"/><path d="M21 15l-5.5-5.5a1.5 1.5 0 0 0-2.12 0L4 19" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg> 이미지 선택</button>
          <button type="button" id="chImgClearBtn">기본으로</button>
        </div>
        <input type="file" accept="image/*" id="chImgFile" class="file-hidden">
      </div>
      <p style="font-size:var(--fs-xs);color:var(--sub);margin:-10px 0 14px;">정사각형 이미지 <b>150×150px</b> 권장 · 원형으로 잘려서 보여요. 이미지가 없으면 색상 원으로 대신 표시돼요.</p>
      <div class="field"><label>채널 이름</label><input type="text" id="chNameInput" value="${isNew?'':existing.name.replace(/"/g,'&quot;')}" placeholder="ex) 야담이야기"></div>
      <div class="modal-actions"><button class="btn-ghost" id="cancelBtn">취소</button><button class="btn-primary" id="okBtn">${isNew?'만들기':'저장'}</button></div>
    `, (m)=>{
      const preview = m.querySelector("#chAvatarPreview");
      const fileInput = m.querySelector("#chImgFile");
      m.querySelector("#chImgPickBtn").addEventListener("click", ()=>fileInput.click());
      fileInput.addEventListener("change", ()=>{
        const file = fileInput.files[0];
        if(!file) return;
        encodeImage(file, {maxW:96, aspect:1, quality:0.7}, (dataUrl)=>{ pendingImage = dataUrl; preview.innerHTML = `<img src="${dataUrl}">`; });
      });
      m.querySelector("#chImgClearBtn").addEventListener("click", ()=>{
        pendingImage = null;
        preview.innerHTML = `<span>${(m.querySelector("#chNameInput").value||'?')[0]}</span>`;
      });
      m.querySelector("#cancelBtn").onclick = closer;
      m.querySelector("#okBtn").onclick = ()=>{
        const name = m.querySelector("#chNameInput").value.trim();
        if(!name){ m.querySelector("#chNameInput").focus(); return; }
        if(state.channels.some(c=>c.name===name && (!existing || c.id!==existing.id))){
          alert("이미 있는 채널 이름이에요."); return;
        }
        if(isNew){
          const ch = {id:uid(), name, color:COLORS[state.channels.length%COLORS.length], image:pendingImage};
          state.channels.push(ch); save(); closer(); onDone && onDone(ch);
        } else {
          existing.name = name; existing.image = pendingImage;
          save(); closer(); onDone && onDone(existing);
        }
      };
      submitOnEnter(m, "#okBtn");
      m.querySelector("#chNameInput").focus();
    });
  }

  function stagePct(stage){
    if(stage.subtasks.length>0){
      const done = stage.subtasks.filter(s=>s.done).length;
      return Math.round(done/stage.subtasks.length*100);
    }
    return stage.manualDone ? 100 : 0;
  }
  function progressOf(p){
    const pcts = p.stages.map(stagePct);
    const overall = Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length);
    return {overall, pcts};
  }
  function syncCompleted(p){
    const overall = progressOf(p).overall;
    p.completed = overall===100;
  }


  function flavorFor(pct){
    if(pct===0) return "아직 시작 전이에요";
    if(pct<40) return "워밍업 중이에요 🔥";
    if(pct<70) return "순항 중이에요 🚀";
    if(pct<100) return "막바지예요, 조금만 더!";
    return "🎉 클리어! 수고하셨어요";
  }

  /* 되돌릴 수 있는 삭제 알림. 휴지통까지 가지 않아도 바로 물릴 수 있게 한다.
     한 번에 하나만 띄운다 — 여러 개가 쌓이면 어느 걸 되돌리는지 알 수 없다. */
  function showUndoToast(text, onUndo){
    document.querySelectorAll(".celebrate-toast.with-action").forEach(t=>t.remove());
    const toast = document.createElement("div");

    const close = ()=>{
      clearTimeout(timer);
      toast.classList.remove("show");
      setTimeout(()=>toast.remove(), 300);
    };
    const timer = setTimeout(close, 6000);
    btn.onclick = ()=>{ close(); onUndo(); };

  function showFleetingToast(text, danger){

  function fmtDateTime(iso){
    if(!iso) return null;
    const d = new Date(iso);
    if(isNaN(d)) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const dOnly = new Date(d); dOnly.setHours(0,0,0,0);
    const diff = Math.round((dOnly-today)/86400000);
    const hh = String(d.getHours()).padStart(2,"0"), mm=String(d.getMinutes()).padStart(2,"0");
    const label = `${d.getMonth()+1}월 ${d.getDate()}일(${WEEKDAYS[d.getDay()]}) ${hh}:${mm}`;
    let rel = diff===0?" · 오늘":diff===1?" · 내일":diff>1?` · D-${diff}`:" · 지남";
    const urgency = diff<=1 ? "red" : diff<=3 ? "orange" : diff<=5 ? "yellow" : "green";
    return {label, rel, soon: diff<=2, urgency, ts:d.getTime()};
  }

  function formatCountdown(ts){
    const diff = ts - Date.now();
    if(diff <= 0) return "마감 지남";
    const totalMin = Math.floor(diff/60000);
    const days = Math.floor(totalMin/1440);
    const hours = Math.floor((totalMin%1440)/60);
    const mins = totalMin%60;
    if(days>0) return `${days}일 ${hours}시간 ${mins}분 남음`;
    if(hours>0) return `${hours}시간 ${mins}분 남음`;
    return `${mins}분 남음`;
  }
  /* 사이드바용 짧은 카운트다운. 목록 한 줄에 날짜와 같이 들어가야 해서
     제일 큰 단위 하나만 쓴다. 정확한 값은 상세 화면에서 보여준다. */
  function formatCountdownShort(ts){
    const diff = ts - Date.now();
    if(diff <= 0) return "마감 지남";
    const totalMin = Math.floor(diff/60000);
    const days = Math.floor(totalMin/1440);
    if(days > 0) return `${days}일 남음`;
    const hours = Math.floor(totalMin/60);
    if(hours > 0) return `${hours}시간 남음`;
    return `${totalMin%60}분 남음`;
  }
  function countdownSpanHtml(ts, short){
    const fmt = short ? formatCountdownShort(ts) : formatCountdown(ts);
    return `<span class="countdown-live" data-ts="${ts}"${short ? ' data-short="1"' : ''}>${fmt}</span>`;
  }
  function refreshCountdowns(){
    document.querySelectorAll(".countdown-live").forEach(el=>{
      const ts = +el.dataset.ts;
      if(ts) el.textContent = el.dataset.short ? formatCountdownShort(ts) : formatCountdown(ts);
    });
  }

  function sortList(list){
    const arr = list.slice();
    if(state.sortMode==="progress"){
      // 거의 다 된 것부터 — 마무리할 게 위로 올라온다
      arr.sort((a,b)=> progressOf(b).overall - progressOf(a).overall);
    } else if(state.sortMode==="manual"){
      arr.sort((a,b)=>a.order-b.order);
    } else {
      const withDate = arr.filter(p=>fmtDateTime(p.uploadAt));
      const noDate = arr.filter(p=>!fmtDateTime(p.uploadAt));
      withDate.sort((a,b)=>fmtDateTime(a.uploadAt).ts - fmtDateTime(b.uploadAt).ts);
      return [...withDate, ...noDate];
    }
    return arr;
  }

  function sortByDeadline(list){
    const withDate = list.filter(p=>fmtDateTime(p.uploadAt));
    const noDate = list.filter(p=>!fmtDateTime(p.uploadAt));
    withDate.sort((a,b)=>fmtDateTime(a.uploadAt).ts - fmtDateTime(b.uploadAt).ts);
    return [...withDate, ...noDate];
  }

  function openDateModal(initialISO, onSave){

  function mountCalendar(container, initialISO, onSave){
    const now = new Date();
    const base = (initialISO && !isNaN(new Date(initialISO))) ? new Date(initialISO) : now;
    let viewYear = base.getFullYear(), viewMonth = base.getMonth();
    let selDate = (initialISO && !isNaN(new Date(initialISO))) ? new Date(initialISO) : null;
    let selH = selDate ? selDate.getHours() : 20;
    let selM = selDate ? selDate.getMinutes() : 0;

    function render(){
      const firstDay = new Date(viewYear, viewMonth, 1);
      const startWd = firstDay.getDay();
      const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
      const daysInPrev = new Date(viewYear, viewMonth, 0).getDate();
      const today = new Date();
      let cells = "";
      for(let i=startWd-1;i>=0;i--) cells += `<div class="cal-day mute">${daysInPrev-i}</div>`;
      for(let d=1; d<=daysInMonth; d++){
        const isToday = today.getFullYear()===viewYear && today.getMonth()===viewMonth && today.getDate()===d;
        const isSel = selDate && selDate.getFullYear()===viewYear && selDate.getMonth()===viewMonth && selDate.getDate()===d;
        cells += `<div class="cal-day${isToday?' today':''}${isSel?' selected':''}" data-d="${d}">${d}</div>`;
      }
      const totalCells = startWd + daysInMonth;
      const trailing = (7 - (totalCells % 7)) % 7;
      for(let d=1; d<=trailing; d++) cells += `<div class="cal-day mute">${d}</div>`;

      container.innerHTML = `
        <div class="cal-head">
          <button data-nav="-1">‹</button>
          <span>${viewYear}년 ${viewMonth+1}월</span>
          <button data-nav="1">›</button>
        </div>
        <div style="text-align:right;margin:-4px 0 6px;">
          <button id="calToday" style="border:none;background:none;color:var(--accent);font-size:var(--fs-xs);cursor:pointer;font-weight:600;">오늘로 이동</button>
        </div>
        <div class="cal-grid">
          ${WEEKDAYS.map(w=>`<div class="cal-wd">${w}</div>`).join("")}
          ${cells}
        </div>
        <div class="cal-time">
          <span>⏰</span>
          <input type="number" min="0" max="23" id="calH" value="${String(selH).padStart(2,'0')}">
          <span>:</span>
          <select id="calM">
            ${[0,15,30,45].map(m=>`<option value="${m}"${(Math.round(selM/15)*15%60)===m?" selected":""}>${String(m).padStart(2,'0')}</option>`).join("")}
          </select>
        </div>
        <div class="cal-actions">
          <button class="clear" id="calClear">날짜 지우기</button>
          <button id="calSave">저장</button>
        </div>
      `;
      container.querySelector('[data-nav="-1"]').onclick=()=>{viewMonth--;if(viewMonth<0){viewMonth=11;viewYear--;}render();};
      container.querySelector('[data-nav="1"]').onclick=()=>{viewMonth++;if(viewMonth>11){viewMonth=0;viewYear++;}render();};
      container.querySelector("#calToday").onclick=()=>{ const t=new Date(); viewYear=t.getFullYear(); viewMonth=t.getMonth(); render(); };
      container.querySelectorAll(".cal-day:not(.mute)").forEach(el=>{
        el.onclick=()=>{ selDate=new Date(viewYear,viewMonth,+el.dataset.d); render(); };
      });
      container.querySelector("#calClear").onclick=()=>onSave("");
      container.querySelector("#calSave").onclick=()=>{
        const d = selDate || new Date(viewYear,viewMonth,new Date().getDate());
        const h = +container.querySelector("#calH").value || 0;
        const m = +container.querySelector("#calM").value || 0;
        d.setHours(h, m, 0, 0);
        const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
        onSave(iso);
      };
    }
    render();
  }

  // ---------- context menu ----------
  /* 터치에는 우클릭이 없다. 길게 누르기를 같은 메뉴에 연결한다.
     bindCtx 로 한 번에 걸어야 우클릭/롱프레스가 어긋나지 않는다. */
  function bindCtx(el, getItems){
    const open = (x, y)=> openContextMenu(x, y, getItems());
    el.addEventListener("contextmenu", (e)=>{
      e.preventDefault(); e.stopPropagation();
      open(e.clientX, e.clientY);
    });

    let timer = null, sx = 0, sy = 0, fired = false;
    const cancel = ()=>{ clearTimeout(timer); timer = null; };
    el.addEventListener("touchstart", (e)=>{
      if(e.touches.length !== 1) return;
      const t = e.touches[0];
      sx = t.clientX; sy = t.clientY; fired = false;
      cancel();
      timer = setTimeout(()=>{
        fired = true;
        if(navigator.vibrate) navigator.vibrate(12);   // 눌린 걸 손끝으로 알려준다
        open(sx, sy);
      }, 480);
    }, {passive:true});
    el.addEventListener("touchmove", (e)=>{           // 스크롤하려던 거면 취소
      const t = e.touches[0];
      if(!t) return;
      if(Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) cancel();
    }, {passive:true});
    el.addEventListener("touchend", (e)=>{
      cancel();
      if(fired) e.preventDefault();                   // 길게 눌렀으면 클릭까지 이어지지 않게
    });
    el.addEventListener("touchcancel", cancel);
  }

  function openContextMenu(x, y, items){
    document.querySelectorAll(".ctx-menu").forEach(e=>e.remove());
    const menu = document.createElement("div");
    menu.className = "ctx-menu";
    menu.style.left = x+"px"; menu.style.top = y+"px";
    items.forEach(it=>{
      if(it==="sep"){ const s=document.createElement("div"); s.className="ctx-sep"; menu.appendChild(s); return; }
      // 누를 수 없는 설명 줄 — 계정 메뉴에서 이메일을 보여주는 데 쓴다
      if(it.header){
        const hd=document.createElement("div"); hd.className="ctx-header";
        hd.textContent = it.label; menu.appendChild(hd); return;
      }
      const el = document.createElement("div");
      el.className = "ctx-item" + (it.danger?" danger":"");
      if(it.icon){
        el.innerHTML = it.icon + "<span></span>";
        el.querySelector("span").textContent = it.label;   // 라벨은 항상 텍스트로
      }else{
        el.textContent = it.label;
      }
      el.onclick = ()=>{ it.action(); menu.remove(); };
      menu.appendChild(el);
    });
    document.body.appendChild(menu);
    const r = menu.getBoundingClientRect();
    if(r.right > window.innerWidth) menu.style.left = (window.innerWidth-r.width-8)+"px";
    if(r.bottom > window.innerHeight) menu.style.top = (window.innerHeight-r.height-8)+"px";
    setTimeout(()=>{
      document.addEventListener("click", function outside(){ menu.remove(); document.removeEventListener("click", outside); });
    },0);
  }

  function duplicateProject(p){
    const copy = JSON.parse(JSON.stringify(p));
    copy.id = uid(); copy.name = p.name + " (사본)"; copy.createdAt = Date.now(); copy.order = Date.now(); copy.completed=false;
    delete copy._ro;                       // 사본은 내 것이다
    // 남의 채널에 내 이야기를 만들 수는 없다. 내 첫 채널로 옮긴다.
    const mine = state.channels.find(c=>!c.shared);
    if(p._ro) copy.channelId = mine ? mine.id : null;
    state.projects.push(copy);
    save(); renderAll();
  }

  function trashProject(id){
